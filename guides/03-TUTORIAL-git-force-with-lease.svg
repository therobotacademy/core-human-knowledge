<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634">
  <defs>
    <marker id="aSlate" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B6B6B"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#0D7C5A"/></marker>
    <marker id="aRed"   markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#B91C1C"/></marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/></filter>
    <style>
      text{font-family:'Segoe UI', Arial, sans-serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .role{font-size:10px;letter-spacing:.12em;font-weight:700}
      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}
      .sub{font-size:9.5px;fill:#6B6B6B}
      .cmd{font-size:11px;font-weight:700;fill:#1E3A5F}
      .lbl{font-size:11px;fill:#6B6B6B}
      .bul{font-size:11px;fill:#3A3A3A}
      .ok{font-size:11px;fill:#0A5C43;font-weight:700}
      .bad{font-size:11px;fill:#B91C1C;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="634" fill="#F5F2EC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="58" fill="#1E3A5F"/>
  <rect x="0" y="0" width="6" height="58" fill="#FF8C3B"/>
  <text x="600" y="25" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">git push --force-with-lease  —  reescribir historia publicada sin destruir trabajo ajeno</text>
  <text x="600" y="45" text-anchor="middle" font-size="10.5" letter-spacing=".04em" fill="#9AB0C8">el "lease" verifica que el remoto no se ha movido desde tu último fetch  ·  si alguien empujó, <tspan class="mono" fill="#FF8C3B">stale info</tspan> rechaza en vez de borrar</text>

  <!-- ===== DIAGRAMA CENTRAL: flujo push ===== -->
  <!-- Commits locales (tú) -->
  <rect x="40" y="74" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#2E6B9E" stroke-width="1.6" filter="url(#sh)"/>
  <text x="140" y="97" text-anchor="middle" class="bt">Tu historial local</text>
  <text x="140" y="115" text-anchor="middle" class="mono" font-size="11" fill="#2E6B9E">A  →  A'  (amend)</text>

  <!-- Remoto -->
  <rect x="460" y="74" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.6" filter="url(#sh)"/>
  <text x="560" y="97" text-anchor="middle" class="bt">Remoto <tspan class="mono" font-size="11">origin/master</tspan></text>
  <text x="560" y="115" text-anchor="middle" class="mono" font-size="11" fill="#1E3A5F">A  (last fetch)</text>

  <!-- flecha push -->
  <line x1="242" y1="101" x2="458" y2="101" stroke="#6B6B6B" stroke-width="1.4" marker-end="url(#aSlate)" stroke-dasharray="5,3"/>
  <text x="350" y="94" text-anchor="middle" class="sub" font-style="italic">push A'</text>

  <!-- comprobación lease -->
  <rect x="714" y="74" width="204" height="54" rx="8" fill="#EBF4FF" stroke="#2E6B9E" stroke-width="1.4" filter="url(#sh)"/>
  <text x="816" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="#2E6B9E">¿remoto == last fetch?</text>
  <text x="816" y="115" text-anchor="middle" class="sub">origin/master coincide con tu lease</text>

  <line x1="660" y1="101" x2="712" y2="101" stroke="#2E6B9E" stroke-width="1.4" marker-end="url(#aSlate)"/>

  <!-- SÍ → éxito -->
  <rect x="966" y="58" width="194" height="40" rx="7" fill="#E6F7F2" stroke="#0D7C5A" stroke-width="1.4" filter="url(#sh)"/>
  <text x="1063" y="83" text-anchor="middle" class="ok">✓  push aceptado</text>

  <!-- NO → rechazo -->
  <rect x="966" y="112" width="194" height="40" rx="7" fill="#FFF5F5" stroke="#B91C1C" stroke-width="1.4" filter="url(#sh)"/>
  <text x="1063" y="137" text-anchor="middle" class="bad">✗  stale info — rechazado</text>

  <line x1="918" y1="90" x2="964" y2="78" stroke="#0D7C5A" stroke-width="1.3" marker-end="url(#aGreen)"/>
  <text x="940" y="82" class="ok" font-size="9.5">SÍ</text>
  <line x1="918" y1="110" x2="964" y2="128" stroke="#B91C1C" stroke-width="1.3" marker-end="url(#aRed)"/>
  <text x="937" y="127" class="bad" font-size="9.5">NO</text>

  <!-- ===== PANEL COMPARACIÓN 3 OPCIONES ===== -->
  <rect x="40" y="148" width="1120" height="130" rx="9" fill="#FFFFFF" stroke="#E8E3D8" stroke-width="1.3" filter="url(#sh)"/>
  <text x="58" y="170" class="role" fill="#9B9B9B">COMPARACIÓN — las tres opciones</text>
  <line x1="58" y1="178" x2="1142" y2="178" stroke="#E8E3D8" stroke-width="1.2"/>

  <!-- cabeceras de columna -->
  <text x="200" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B6B6B">Comando</text>
  <text x="580" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B6B6B">Comprobación de seguridad</text>
  <text x="980" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B6B6B">Riesgo</text>
  <line x1="58" y1="200" x2="1142" y2="200" stroke="#F0ECE4" stroke-width="1"/>

  <!-- fila 1: push normal -->
  <rect x="58" y="206" width="280" height="26" rx="4" fill="#F5F2EC"/>
  <text x="76" y="224" class="mono" font-size="11.5" fill="#1E3A5F">git push</text>
  <text x="420" y="224" text-anchor="middle" class="lbl">Solo fast-forward</text>
  <text x="980" y="224" text-anchor="middle" class="lbl">No sirve tras reescribir historia</text>

  <!-- fila 2: force -->
  <rect x="58" y="236" width="280" height="26" rx="4" fill="#FFF5F5"/>
  <text x="76" y="254" class="mono" font-size="11.5" fill="#B91C1C">git push --force</text>
  <text x="420" y="254" text-anchor="middle" class="bad">Ninguna</text>
  <text x="980" y="254" text-anchor="middle" class="bad">Destruye commits que no hayas visto  ⚠</text>

  <!-- fila 3: force-with-lease -->
  <rect x="58" y="266" width="280" height="26" rx="4" fill="#E6F7F2"/>
  <text x="76" y="284" class="mono" font-size="11.5" fill="#0A5C43">git push --force-with-lease</text>
  <text x="420" y="284" text-anchor="middle" class="ok">Compara con tu último fetch</text>
  <text x="980" y="284" text-anchor="middle" class="ok">Rechaza si alguien movió el remoto  ✓</text>

  <!-- ===== CHIPS DE REGLAS ===== -->
  <!-- Chip 1 -->
  <rect x="40" y="294" width="368" height="52" rx="8" fill="#FFFFFF" stroke="#C2510A" stroke-width="1.4"/>
  <text x="58" y="314" font-size="10" font-weight="700" fill="#C2510A">① EL LEASE = UNA PROMESA FECHADA</text>
  <text x="58" y="332" class="sub" font-size="10.5">"Creo que origin está en X." Si X cambió, el push se rechaza.</text>
  <text x="58" y="348" class="sub" font-size="10.5">El valor de X viene del último <tspan class="mono">git fetch</tspan> que hiciste.</text>

  <!-- Chip 2 -->
  <rect x="420" y="294" width="368" height="52" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4"/>
  <text x="438" y="314" font-size="10" font-weight="700" fill="#B91C1C">② NO HAGAS FETCH JUSTO ANTES SIN INSPECCIONAR</text>
  <text x="438" y="332" class="sub" font-size="10.5">Fetch refresca el lease → ya no detecta el cambio.</text>
  <text x="438" y="348" class="sub" font-size="10.5">Inspecciona siempre, o ancla: <tspan class="mono">--force-with-lease=master:&lt;sha&gt;</tspan></text>

  <!-- Chip 3 -->
  <rect x="800" y="294" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#0D7C5A" stroke-width="1.4"/>
  <text x="818" y="314" font-size="10" font-weight="700" fill="#0D7C5A">③ OPCIÓN MÁS SEGURA (git moderno)</text>
  <text x="818" y="332" class="sub" font-size="10.5"><tspan class="mono">--force-with-lease --force-if-includes</tspan></text>
  <text x="818" y="348" class="sub" font-size="10.5">Verifica que tu historial contiene los commits remotos.</text>

  <!-- ===== CASO REAL DEL REPO ===== -->
  <rect x="40" y="360" width="554" height="88" rx="9" fill="#FAFAF7" stroke="#2E6B9E" stroke-width="1.3" filter="url(#sh)"/>
  <text x="58" y="380" class="role" fill="#2E6B9E">CASO REAL — push-prompt-log.ps1 · un commit por día</text>
  <text x="58" y="400" class="mono" font-size="10.5" fill="#1E3A5F">if ($head -eq $msg) {</text>
  <text x="58" y="416" class="mono" font-size="10.5" fill="#1E3A5F">    git commit --amend --no-edit  →  git push --force-with-lease</text>
  <text x="58" y="432" class="mono" font-size="10.5" fill="#6B6B6B">} else { git commit -m $msg  →  git push  }</text>
  <text x="58" y="446" class="sub">Sesiones paralelas + evaluador nocturno compiten en master — el lease protege a todos.</text>

  <!-- ===== RECETA MANUAL ===== -->
  <rect x="606" y="360" width="554" height="88" rx="9" fill="#FAFAF7" stroke="#E8E3D8" stroke-width="1.3" filter="url(#sh)"/>
  <text x="624" y="380" class="role" fill="#9B9B9B">RECETA — tras enmendar un commit publicado</text>
  <text x="624" y="400" class="mono" font-size="10.5" fill="#1E3A5F">git fetch origin</text>
  <text x="624" y="416" class="mono" font-size="10.5" fill="#6B6B6B">git log --oneline HEAD..origin/master   # ← debe estar VACÍO</text>
  <text x="624" y="432" class="mono" font-size="10.5" fill="#0A5C43">git push --force-with-lease</text>
  <text x="624" y="448" class="sub">Si no está vacío: <tspan class="mono">git pull --rebase</tspan> → <tspan class="mono">git push --force-with-lease</tspan></text>

  <!-- ===== CHULETA ===== -->
  <rect x="40" y="462" width="1120" height="104" rx="9" fill="#FAFAF7" stroke="#E8E3D8"/>
  <text x="58" y="482" class="role" fill="#9B9B9B">CHULETA — comandos</text>
  <!-- col izq -->
  <text x="58"  y="504" class="mono cmd">git push</text>
  <text x="290" y="504" class="lbl">push normal (fast-forward, sin reescritura)</text>
  <text x="58"  y="524" class="mono cmd">git push --force-with-lease</text>
  <text x="290" y="524" class="lbl">enmendaste / rebasaste un commit ya publicado</text>
  <text x="58"  y="544" class="mono cmd">git push --force-with-lease=master:&lt;sha&gt;</text>
  <text x="290" y="544" class="lbl">anclar el tip remoto esperado (máxima precisión)</text>
  <!-- col der -->
  <text x="630" y="504" class="mono cmd">git fetch  →  git rebase  →  --force-with-lease</text>
  <text x="970" y="504" class="lbl">lease rechazado → integra y reintenta</text>
  <text x="630" y="524" class="mono cmd">--force-with-lease --force-if-includes</text>
  <text x="970" y="524" class="lbl">opción más segura (git moderno)</text>
  <text x="630" y="544" class="mono bad">git push --force</text>
  <text x="970" y="544" class="bad">NUNCA — cero comprobaciones, borra commits</text>
  <!-- línea separadora -->
  <line x1="620" y1="462" x2="620" y2="566" stroke="#E8E3D8" stroke-width="1"/>

  <!-- ===== LEYENDA ===== -->
  <g>
    <rect x="40"  y="582" width="13" height="13" rx="2" fill="#2E6B9E"/><text x="58"  y="593" class="sub">tus commits locales</text>
    <rect x="220" y="582" width="13" height="13" rx="2" fill="#1E3A5F"/><text x="238" y="593" class="sub">remoto / lease</text>
    <rect x="380" y="582" width="13" height="13" rx="2" fill="#0D7C5A"/><text x="398" y="593" class="sub">push aceptado (lease ok)</text>
    <rect x="600" y="582" width="13" height="13" rx="2" fill="#B91C1C"/><text x="618" y="593" class="sub">push rechazado / peligro</text>
    <rect x="820" y="582" width="13" height="13" rx="2" fill="#C2510A"/><text x="838" y="593" class="sub">regla / gotcha</text>
  </g>

  <!-- FOOTER -->
  <text x="600" y="622" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9B9B9B">Tutorial git push --force-with-lease · reescritura segura de historia publicada · paleta COIIAOC (tipografía V2) · 2026-06-22</text>
</svg>
