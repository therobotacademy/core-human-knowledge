<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <marker id="aSlate" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B6B6B"/></marker>
    <marker id="aOrange" markerWidth="11" markerHeight="9" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#C2510A"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#0D7C5A"/></marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/></filter>
    <style>
      text{font-family:'Segoe UI', Arial, sans-serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .role{font-size:10px;letter-spacing:.1em;font-weight:700}
      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}
      .sub{font-size:9.5px;fill:#6B6B6B}
      .cmd{font-size:11.5px;font-weight:700;fill:#1E3A5F}
      .lbl{font-size:10.5px;fill:#6B6B6B}
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="#F5F2EC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="58" fill="#1E3A5F"/>
  <rect x="0" y="0" width="6" height="58" fill="#FF8C3B"/>
  <text x="600" y="25" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">GitHub Spec-Kit — Spec-Driven Development (SDD) Lifecycle</text>
  <text x="600" y="45" text-anchor="middle" font-size="10.5" letter-spacing=".04em" fill="#9AB0C8">elimina el <tspan fill="#B91C1C">vibe coding</tspan> · ciclo determinista: <tspan fill="#0D7C5A">constitution → spec → plan → tasks → analyze → implement</tspan></text>

  <!-- PIPELINE HORIZONTAL (7 FASES DETERMINISTAS) -->
  <rect x="25" y="74" width="1150" height="135" rx="8" fill="#FFFFFF" stroke="#E8E3D8" filter="url(#sh)"/>
  <text x="40" y="94" class="bt">Flujo determinista de comandos SDD</text>

  <!-- Step 1: Constitution -->
  <rect x="40" y="106" width="138" height="56" rx="6" fill="#F5F2EC" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="109" y="124" text-anchor="middle" class="mono cmd" font-size="11">/speckit-constitution</text>
  <text x="109" y="141" text-anchor="middle" class="sub">Reglas del proyecto</text>
  <text x="109" y="153" text-anchor="middle" class="mono" font-size="9" fill="#2E6B9E">constitution.md</text>

  <line x1="178" y1="134" x2="202" y2="134" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>

  <!-- Step 2: Specify -->
  <rect x="204" y="106" width="138" height="56" rx="6" fill="#F5F2EC" stroke="#2E6B9E"/>
  <text x="273" y="124" text-anchor="middle" class="mono cmd" font-size="11">/speckit-specify</text>
  <text x="273" y="141" text-anchor="middle" class="sub">Requisitos funcionales</text>
  <text x="273" y="153" text-anchor="middle" class="mono" font-size="9" fill="#2E6B9E">spec.md</text>

  <line x1="342" y1="134" x2="366" y2="134" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>

  <!-- Step 3: Clarify -->
  <rect x="368" y="106" width="138" height="56" rx="6" fill="#F5F2EC" stroke="#C2510A"/>
  <text x="437" y="124" text-anchor="middle" class="mono cmd" font-size="11" fill="#7C2D12">/speckit-clarify</text>
  <text x="437" y="141" text-anchor="middle" class="sub">Máx. 5 preguntas</text>
  <text x="437" y="153" text-anchor="middle" class="sub" fill="#C2510A">Resuelve dudas</text>

  <line x1="506" y1="134" x2="530" y2="134" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>

  <!-- Step 4: Plan -->
  <rect x="532" y="106" width="138" height="56" rx="6" fill="#F5F2EC" stroke="#2E6B9E"/>
  <text x="601" y="124" text-anchor="middle" class="mono cmd" font-size="11">/speckit-plan</text>
  <text x="601" y="141" text-anchor="middle" class="sub">Stack &amp; arquitectura</text>
  <text x="601" y="153" text-anchor="middle" class="mono" font-size="9" fill="#2E6B9E">plan.md + models</text>

  <line x1="670" y1="134" x2="694" y2="134" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>

  <!-- Step 5: Tasks -->
  <rect x="696" y="106" width="138" height="56" rx="6" fill="#F5F2EC" stroke="#2E6B9E"/>
  <text x="765" y="124" text-anchor="middle" class="mono cmd" font-size="11">/speckit-tasks</text>
  <text x="765" y="141" text-anchor="middle" class="sub">Desglose atómico</text>
  <text x="765" y="153" text-anchor="middle" class="mono" font-size="9" fill="#2E6B9E">tasks.md</text>

  <line x1="834" y1="134" x2="858" y2="134" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>

  <!-- Step 6: Analyze -->
  <rect x="860" y="106" width="138" height="56" rx="6" fill="#FFF7ED" stroke="#C2510A" stroke-width="1.6"/>
  <text x="929" y="124" text-anchor="middle" class="mono cmd" font-size="11" fill="#7C2D12">/speckit-analyze</text>
  <text x="929" y="141" text-anchor="middle" class="sub">Auditoría cruzada</text>
  <text x="929" y="153" text-anchor="middle" class="sub" font-weight="700" fill="#B91C1C">Read-only check</text>

  <line x1="998" y1="134" x2="1022" y2="134" stroke="#C2510A" stroke-width="2" marker-end="url(#aOrange)"/>

  <!-- Step 7: Implement -->
  <rect x="1024" y="106" width="138" height="56" rx="6" fill="#E7F1EC" stroke="#0D7C5A" stroke-width="1.8"/>
  <text x="1093" y="124" text-anchor="middle" class="mono cmd" font-size="11" fill="#0A5C43">/speckit-implement</text>
  <text x="1093" y="141" text-anchor="middle" class="sub" fill="#0A5C43">Genera código y test</text>
  <text x="1093" y="153" text-anchor="middle" class="sub" font-weight="700" fill="#0D7C5A">Ejecución final ✓</text>

  <text x="40" y="192" class="sub" font-size="9.5" fill="#6B6B6B">Principio fundamental: <tspan font-weight="700" fill="#1E3A5F">Ningún código se genera</tspan> sin que el análisis cruzado valide que <tspan class="mono">spec.md</tspan>, <tspan class="mono">plan.md</tspan> y <tspan class="mono">tasks.md</tspan> coinciden al 100%.</text>

  <!-- PANEL IZQUIERDO: ANATOMÍA DE specs/NNN-feature -->
  <rect x="25" y="224" width="370" height="280" rx="8" fill="#FFFFFF" stroke="#2E6B9E" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="25" y="224" width="370" height="26" rx="8" fill="#2E6B9E"/>
  <text x="40" y="241" class="role" fill="#FFFFFF">ESTRUCTURA DE UNA FEATURE (specs/NNN-*)</text>

  <text x="40" y="270" class="mono cmd" font-size="11" fill="#1E3A5F">spec.md</text>
  <text x="135" y="270" class="lbl">Requisitos funcionales puros (sin tech).</text>

  <text x="40" y="296" class="mono cmd" font-size="11" fill="#1E3A5F">plan.md</text>
  <text x="135" y="296" class="lbl">Decisiones técnicas, stack y fases.</text>

  <text x="40" y="322" class="mono cmd" font-size="11" fill="#1E3A5F">data-model.md</text>
  <text x="135" y="322" class="lbl">Entidades, contratos de datos y tipos.</text>

  <text x="40" y="348" class="mono cmd" font-size="11" fill="#1E3A5F">research.md</text>
  <text x="135" y="348" class="lbl">Alternativas evaluadas y descartadas.</text>

  <text x="40" y="374" class="mono cmd" font-size="11" fill="#1E3A5F">tasks.md</text>
  <text x="135" y="374" class="lbl">Subtareas ordenadas por dependencia.</text>

  <text x="40" y="400" class="mono cmd" font-size="11" fill="#1E3A5F">contracts/*</text>
  <text x="135" y="400" class="lbl">Esquemas JSON, OpenAPI o interfaces.</text>

  <text x="40" y="426" class="mono cmd" font-size="11" fill="#1E3A5F">quickstart.md</text>
  <text x="135" y="426" class="lbl">Casos de validación e integración.</text>

  <line x1="40" y1="446" x2="375" y2="446" stroke="#E8E3D8" stroke-width="1"/>
  <text x="40" y="468" class="sub" fill="#0D7C5A" font-weight="700">Trazabilidad total: cada test deriva de un requisito en spec.md.</text>
  <text x="40" y="486" class="sub">Los artefactos son portables e independientes del modelo LLM.</text>

  <!-- PANEL CENTRAL: CHULETA DE COMANDOS -->
  <rect x="415" y="224" width="370" height="280" rx="8" fill="#FAFAF7" stroke="#E8E3D8" filter="url(#sh)"/>
  <rect x="415" y="224" width="370" height="26" rx="8" fill="#1E3A5F"/>
  <text x="430" y="241" class="role" fill="#FFFFFF">CHULETA DE COMANDOS TERMINAL / CLI</text>

  <rect x="430" y="260" width="340" height="230" rx="6" fill="#FFFFFF" stroke="#E8E3D8"/>
  <text x="445" y="278" class="mono" font-size="10" fill="#6B6B6B"># Instalación CLI (vía uv)</text>
  <text x="445" y="293" class="mono" font-size="10" fill="#C2510A">uv tool install specify-cli</text>
  
  <text x="445" y="316" class="mono" font-size="10" fill="#6B6B6B"># Setup inicial del repo</text>
  <text x="445" y="331" class="mono" font-size="10" fill="#1E3A5F">specify init . --integration claude</text>
  <text x="445" y="346" class="mono" font-size="10" fill="#1E3A5F">specify check</text>

  <text x="445" y="369" class="mono" font-size="10" fill="#6B6B6B"># Ciclo guiado con el Agente</text>
  <text x="445" y="384" class="mono" font-size="10" fill="#0D7C5A">/speckit-constitution [principios]</text>
  <text x="445" y="399" class="mono" font-size="10" fill="#0D7C5A">/speckit-specify [descripción]</text>
  <text x="445" y="414" class="mono" font-size="10" fill="#0D7C5A">/speckit-clarify</text>
  <text x="445" y="429" class="mono" font-size="10" fill="#0D7C5A">/speckit-plan [arquitectura]</text>
  <text x="445" y="444" class="mono" font-size="10" fill="#0D7C5A">/speckit-tasks</text>
  <text x="445" y="459" class="mono" font-size="10" fill="#C2510A">/speckit-analyze</text>
  <text x="445" y="474" class="mono" font-size="10" fill="#0D7C5A">/speckit-implement</text>

  <!-- PANEL DERECHO: CHIPS DE REGLAS ①②③ -->
  <rect x="805" y="224" width="370" height="280" rx="8" fill="#FFFFFF" stroke="#0D7C5A" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="805" y="224" width="370" height="26" rx="8" fill="#0D7C5A"/>
  <text x="820" y="241" class="role" fill="#FFFFFF">REGLAS DE ORO DE ESPECIFICACIÓN</text>

  <rect x="820" y="260" width="340" height="52" rx="6" fill="#F5F2EC" stroke="#0D7C5A" stroke-width="1.2"/>
  <text x="830" y="278" font-size="11" font-weight="700" fill="#0A5C43">① spec.md = qué, nunca cómo</text>
  <text x="830" y="293" class="sub">Define casos de uso, valor de negocio y criterios de aceptación sin mencionar librerías ni base de datos.</text>

  <rect x="820" y="322" width="340" height="52" rx="6" fill="#F5F2EC" stroke="#C2510A" stroke-width="1.2"/>
  <text x="830" y="340" font-size="11" font-weight="700" fill="#7C2D12">② El plan valida la constitución</text>
  <text x="830" y="355" class="sub">Cada /speckit-plan ejecuta Constitution Check. Las decisiones que violan principios son rechazadas.</text>

  <rect x="820" y="384" width="340" height="52" rx="6" fill="#F5F2EC" stroke="#2E6B9E" stroke-width="1.2"/>
  <text x="830" y="402" font-size="11" font-weight="700" fill="#1E3A5F">③ Análisis cruzado antes de codificar</text>
  <text x="830" y="417" class="sub">/speckit-analyze garantiza consistencia exacta entre spec, plan y tasks antes de invocar la implementación.</text>

  <rect x="820" y="446" width="340" height="44" rx="6" fill="#FFF7ED" stroke="#B91C1C" stroke-width="1.2"/>
  <text x="830" y="464" font-size="10.5" font-weight="700" fill="#B91C1C">⚠ Cero Vibe Coding: <tspan font-weight="normal" fill="#6B6B6B">No programes sin checklist de tareas validado.</tspan></text>

  <!-- LEYENDA Y FOOTER -->
  <rect x="25" y="525" width="14" height="14" rx="3" fill="#1E3A5F"/>
  <text x="45" y="536" class="lbl" font-weight="700">Constitución &amp; Setup</text>

  <rect x="220" y="525" width="14" height="14" rx="3" fill="#2E6B9E"/>
  <text x="240" y="536" class="lbl" font-weight="700">Fases de Especificación / Plan</text>

  <rect x="460" y="525" width="14" height="14" rx="3" fill="#C2510A"/>
  <text x="480" y="536" class="lbl" font-weight="700">Clarificación &amp; Auditoría</text>

  <rect x="680" y="525" width="14" height="14" rx="3" fill="#0D7C5A"/>
  <text x="700" y="536" class="lbl" font-weight="700">Implementación ejecutable</text>

  <line x1="25" y1="560" x2="1175" y2="560" stroke="#E8E3D8" stroke-width="1"/>
  <text x="600" y="580" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9B9B9B">Spec-Kit: Spec-Driven Development · core-human-knowledge · paleta COIIAOC (tipografía V2) · 2026-09-10</text>
</svg>
