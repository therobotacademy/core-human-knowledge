<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634">
  <defs>
    <marker id="aSlate" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B6B6B"/></marker>
    <marker id="aMute" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#9B9B9B"/></marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/></filter>
    <style>
      text{font-family:'Segoe UI', Arial, sans-serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .role{font-size:10px;letter-spacing:.12em;font-weight:700}
      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}
      .sub{font-size:9.5px;fill:#6B6B6B}
      .cmd{font-size:11.5px;font-weight:700;fill:#1E3A5F}
      .lbl{font-size:11px;fill:#6B6B6B}
      .bul{font-size:11px;fill:#3A3A3A}
    </style>
  </defs>

  <rect width="1200" height="634" fill="#F5F2EC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="58" fill="#1E3A5F"/>
  <rect x="0" y="0" width="6" height="58" fill="#FF8C3B"/>
  <text x="600" y="25" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">git worktree  —  un repositorio, varias carpetas de trabajo a la vez</text>
  <text x="600" y="45" text-anchor="middle" font-size="10.5" letter-spacing=".04em" fill="#9AB0C8">cada carpeta con una rama distinta checada  ·  todas comparten un único <tspan class="mono" fill="#FF8C3B">.git</tspan>  ·  sin clonar ni hacer <tspan class="mono" fill="#FF8C3B">stash</tspan></text>

  <!-- ===== HUB: repositorio .git único ===== -->
  <rect x="420" y="76" width="360" height="54" rx="9" fill="#1E3A5F" filter="url(#sh)"/>
  <text x="600" y="100" text-anchor="middle" font-size="13.5" font-weight="800" fill="#FFFFFF">1 repositorio  ·  <tspan class="mono" font-size="12.5" fill="#FF8C3B">.git</tspan>  único</text>
  <text x="600" y="118" text-anchor="middle" font-size="9.5" fill="#9AB0C8">commits · ramas · tags · stash · remotes  —  base de objetos compartida</text>

  <!-- fan-out arrows (mismo .git → 3 HEAD distintos) -->
  <line x1="520" y1="132" x2="222" y2="170" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>
  <line x1="600" y1="132" x2="600" y2="170" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>
  <line x1="680" y1="132" x2="978" y2="170" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>
  <text x="600" y="160" text-anchor="middle" class="sub" font-style="italic">misma base · distinto HEAD por carpeta</text>

  <!-- ===== 3 WORKTREES (carpetas hermanas) ===== -->
  <!-- 1 · carpeta principal (rama activa) -->
  <rect x="60" y="176" width="74" height="12" rx="3" fill="#0D7C5A"/>
  <rect x="60" y="184" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#0D7C5A" stroke-width="1.6" filter="url(#sh)"/>
  <text x="220" y="208" text-anchor="middle" class="bt">carpeta principal</text>
  <text x="220" y="228" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0A5C43">skill/prueba-validacion</text>
  <text x="220" y="246" text-anchor="middle" class="sub">tu trabajo — la rama activa</text>

  <!-- 2 · referencia LAB4 -->
  <rect x="440" y="176" width="74" height="12" rx="3" fill="#C2510A"/>
  <rect x="440" y="184" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#C2510A" stroke-width="1.6" filter="url(#sh)"/>
  <text x="600" y="208" text-anchor="middle" class="bt"><tspan class="mono" font-size="12">..\LAB4-master</tspan></text>
  <text x="600" y="228" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#C2510A">master</text>
  <text x="600" y="246" text-anchor="middle" class="sub">referencia LAB4 — solo consulta</text>

  <!-- 3 · revisar un PR -->
  <rect x="820" y="176" width="74" height="12" rx="3" fill="#2E6B9E"/>
  <rect x="820" y="184" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#2E6B9E" stroke-width="1.6" filter="url(#sh)"/>
  <text x="980" y="208" text-anchor="middle" class="bt"><tspan class="mono" font-size="12">..\revision-pr</tspan></text>
  <text x="980" y="228" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#2E6B9E">labs/1</text>
  <text x="980" y="246" text-anchor="middle" class="sub">revisar / ejecutar un PR aparte</text>

  <!-- ===== PANELES: comparten vs propio ===== -->
  <!-- SE COMPARTE -->
  <rect x="40" y="268" width="556" height="132" rx="9" fill="#FFFFFF" stroke="#0D7C5A" stroke-width="1.4" filter="url(#sh)"/>
  <text x="58" y="290" class="role" fill="#0A5C43">● SE COMPARTE  entre todos los worktrees</text>
  <line x1="58" y1="300" x2="578" y2="300" stroke="#E7F1EC" stroke-width="1.4"/>
  <text x="64" y="322" class="bul"><tspan fill="#0D7C5A" font-weight="700">·</tspan>  Historial — commits · ramas · tags</text>
  <text x="64" y="344" class="bul"><tspan fill="#0D7C5A" font-weight="700">·</tspan>  El <tspan class="mono" font-size="10.5">stash</tspan> (es global)</text>
  <text x="64" y="366" class="bul"><tspan fill="#0D7C5A" font-weight="700">·</tspan>  <tspan class="mono" font-size="10.5">remotes</tspan> y la mayoría de <tspan class="mono" font-size="10.5">config</tspan></text>
  <text x="64" y="388" class="bul"><tspan fill="#0D7C5A" font-weight="700">·</tspan>  Los hooks de <tspan class="mono" font-size="10.5">.git/hooks</tspan></text>

  <!-- ES PROPIO -->
  <rect x="604" y="268" width="556" height="132" rx="9" fill="#FFFFFF" stroke="#C2510A" stroke-width="1.4" filter="url(#sh)"/>
  <text x="622" y="290" class="role" fill="#7C2D12">● PROPIO  de cada worktree</text>
  <line x1="622" y1="300" x2="1142" y2="300" stroke="#FBEADB" stroke-width="1.4"/>
  <text x="628" y="322" class="bul"><tspan fill="#C2510A" font-weight="700">·</tspan>  El directorio de trabajo (los ficheros en disco)</text>
  <text x="628" y="344" class="bul"><tspan fill="#C2510A" font-weight="700">·</tspan>  El <tspan class="mono" font-size="10.5">HEAD</tspan> — qué rama/commit tiene checada</text>
  <text x="628" y="366" class="bul"><tspan fill="#C2510A" font-weight="700">·</tspan>  El índice (staging area)</text>
  <text x="628" y="388" class="bul"><tspan fill="#C2510A" font-weight="700">·</tspan>  Ignorados / no rastreados (<tspan class="mono" font-size="10.5">.tmp</tspan>, <tspan class="mono" font-size="10.5">node_modules</tspan>) <tspan font-weight="700" fill="#B91C1C">— NO viajan</tspan></text>

  <!-- ===== REGLAS (3 chips) ===== -->
  <rect x="40" y="412" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="58" y="432" font-size="10" font-weight="700" fill="#1E3A5F">① UNA RAMA → UN WORKTREE</text>
  <text x="58" y="449" class="sub" font-size="10.5">Git impide checar la misma rama en dos carpetas.</text>

  <rect x="420" y="412" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#0D7C5A" stroke-width="1.4"/>
  <text x="438" y="432" font-size="10" font-weight="700" fill="#0D7C5A">② NO DUPLICA EL .git</text>
  <text x="438" y="449" class="sub" font-size="10.5">Solo un puntero ligero — no como <tspan class="mono">git clone</tspan>.</text>

  <rect x="800" y="412" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#C2510A" stroke-width="1.4"/>
  <text x="818" y="432" font-size="10" font-weight="700" fill="#C2510A">③ ADIÓS A switch / stash</text>
  <text x="818" y="449" class="sub" font-size="10.5">Cada rama vive en su carpeta, todas a la vez.</text>

  <!-- ===== CHULETA ===== -->
  <rect x="40" y="474" width="1120" height="100" rx="9" fill="#FAFAF7" stroke="#E8E3D8"/>
  <text x="58" y="495" class="role" fill="#9B9B9B">CHULETA — comandos esenciales</text>
  <!-- col izq -->
  <text x="58" y="518" class="cmd mono">git worktree add ..\dir &lt;rama&gt;</text><text x="330" y="518" class="lbl">carpeta nueva con una rama existente</text>
  <text x="58" y="540" class="cmd mono">git worktree list</text><text x="330" y="540" class="lbl">ver todos los worktrees</text>
  <text x="58" y="562" class="cmd mono">git worktree remove ..\dir</text><text x="330" y="562" class="lbl">quitar (<tspan class="mono">--force</tspan> si hay cambios)</text>
  <!-- col der -->
  <text x="620" y="518" class="cmd mono">git worktree add -b &lt;rama&gt; ..\dir base</text><text x="930" y="518" class="lbl">crea rama nueva + carpeta</text>
  <text x="620" y="540" class="cmd mono">git worktree add --detach ..\dir &lt;ref&gt;</text><text x="930" y="540" class="lbl">inspección sin ocupar rama</text>
  <text x="620" y="562" class="cmd mono">git worktree prune</text><text x="930" y="562" class="lbl">limpiar carpeta borrada a mano</text>

  <!-- ===== LEYENDA ===== -->
  <g>
    <rect x="40" y="588" width="13" height="13" rx="2" fill="#1E3A5F"/><text x="58" y="598" class="sub">hub = el <tspan class="mono">.git</tspan> compartido</text>
    <rect x="232" y="588" width="13" height="13" rx="2" fill="#0D7C5A"/><text x="250" y="598" class="sub">rama activa (tu trabajo)</text>
    <rect x="452" y="588" width="13" height="13" rx="2" fill="#C2510A"/><text x="470" y="598" class="sub">worktree de referencia (consulta)</text>
    <rect x="720" y="588" width="13" height="13" rx="2" fill="#2E6B9E"/><text x="738" y="598" class="sub">worktree de revisión (PR / build)</text>
  </g>

  <!-- FOOTER -->
  <text x="600" y="622" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9B9B9B">Tutorial git worktree · un repo, varias carpetas · Windows + PowerShell · paleta COIIAOC (tipografía V2) · 2026-06-09</text>
</svg>
