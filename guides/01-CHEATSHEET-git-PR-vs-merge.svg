<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618" viewBox="0 0 1200 618">
  <defs>
    <marker id="aSlate" markerWidth="10" markerHeight="8" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B6B6B"/></marker>
    <marker id="aOrange" markerWidth="11" markerHeight="9" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#C2510A"/></marker>
    <marker id="aMute" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#9B9B9B"/></marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/></filter>
    <style>
      text{font-family:'Segoe UI', Arial, sans-serif}
      .mono{font-family:Consolas,'Courier New',monospace}
      .role{font-size:10px;letter-spacing:.12em;font-weight:700}
      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}
      .sub{font-size:9.5px;fill:#6B6B6B}
      .cmd{font-size:12px;font-weight:700;fill:#1E3A5F}
      .lbl{font-size:11px;fill:#6B6B6B}
    </style>
  </defs>

  <rect width="1200" height="618" fill="#F5F2EC"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="58" fill="#1E3A5F"/>
  <rect x="0" y="0" width="6" height="58" fill="#FF8C3B"/>
  <text x="600" y="25" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">Git nativo (merge)  vs.  Pull Requests (gh)  —  operaciones independientes</text>
  <text x="600" y="45" text-anchor="middle" font-size="10.5" letter-spacing=".04em" fill="#9AB0C8">el <tspan fill="#FF8C3B">git push</tspan> es el único puente  LOCAL → GitHub</text>

  <!-- FRONTERA -->
  <line x1="600" y1="76" x2="600" y2="340" stroke="#9B9B9B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="300" y="92" text-anchor="middle" class="role" fill="#1E3A5F">● TU REPO · GIT NATIVO (local)</text>
  <text x="900" y="92" text-anchor="middle" class="role" fill="#2E6B9E">● GITHUB · servidor (gh)</text>

  <!-- ===== LEFT · git flow ===== -->
  <rect x="150" y="104" width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E8E3D8" filter="url(#sh)"/>
  <text x="300" y="130" text-anchor="middle" class="bt">rama  <tspan class="mono" font-size="11.5">dev/mi-rama</tspan></text>

  <line x1="300" y1="146" x2="300" y2="170" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>
  <text x="312" y="162" class="mono lbl">git commit</text>

  <rect x="150" y="172" width="300" height="42" rx="8" fill="#FFFFFF" stroke="#E8E3D8" filter="url(#sh)"/>
  <text x="300" y="198" text-anchor="middle" class="cmd mono">git checkout master</text>

  <line x1="300" y1="214" x2="300" y2="268" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#aSlate)"/>
  <text x="312" y="244" class="mono lbl" fill="#0D7C5A">git merge --no-ff</text>

  <rect x="150" y="270" width="300" height="58" rx="8" fill="#E7F1EC" stroke="#0D7C5A" stroke-width="1.6" filter="url(#sh)"/>
  <text x="300" y="293" text-anchor="middle" class="bt" fill="#0A5C43">master (local) ✓</text>
  <text x="300" y="312" text-anchor="middle" class="sub" fill="#0A5C43">la rama queda integrada — el MERGE integra</text>

  <!-- ===== git push (the bridge) ===== -->
  <line x1="450" y1="299" x2="658" y2="299" stroke="#C2510A" stroke-width="2.6" marker-end="url(#aOrange)"/>
  <rect x="512" y="284" width="78" height="18" rx="9" fill="#F5F2EC"/>
  <text x="551" y="297" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#C2510A">git push</text>

  <!-- ===== RIGHT · PR object ===== -->
  <rect x="660" y="104" width="480" height="140" rx="9" fill="#FFF7ED" stroke="#C2510A" stroke-width="2" filter="url(#sh)"/>
  <text x="680" y="126" class="bt" fill="#7C2D12">PR · objeto de GitHub  (gh)</text>
  <text x="680" y="150" class="mono" font-size="12" font-weight="700" fill="#C2510A">gh pr create</text>
  <text x="846" y="150" class="lbl" fill="#4A3000">crea la propuesta (necesita commits de diff)</text>
  <text x="680" y="172" class="mono" font-size="12" font-weight="700" fill="#C2510A">gh pr close</text>
  <text x="846" y="172" class="lbl" fill="#4A3000">cierra · <tspan font-weight="700" fill="#B91C1C">NO fusiona</tspan></text>
  <text x="680" y="194" class="mono" font-size="12" font-weight="700" fill="#C2510A">gh pr merge</text>
  <text x="846" y="194" class="lbl" fill="#4A3000">fusiona + cierra (en el servidor)</text>
  <line x1="680" y1="206" x2="1120" y2="206" stroke="#E8C9A8" stroke-width="1"/>
  <text x="680" y="226" font-style="italic" font-size="9.5" fill="#8A4A00">independiente del merge local · no toca tu repo · login propio (gh auth)</text>

  <!-- alt path: gh pr merge → origin -->
  <line x1="760" y1="244" x2="760" y2="269" stroke="#9B9B9B" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#aMute)"/>
  <text x="772" y="261" class="lbl" font-size="9.5" font-style="italic">o bien: gh pr merge</text>

  <!-- origin/master (push target) -->
  <rect x="660" y="270" width="380" height="58" rx="8" fill="#1E3A5F" filter="url(#sh)"/>
  <text x="850" y="293" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">origin/master  (GitHub)</text>
  <text x="850" y="312" text-anchor="middle" font-size="9.5" fill="#9AB0C8">= lo único que GitHub «ve»</text>

  <!-- ===== REGLAS (3 chips) ===== -->
  <rect x="40" y="364" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="58" y="384" font-size="10" font-weight="700" fill="#1E3A5F">① EL PUENTE</text>
  <text x="58" y="401" class="sub" font-size="10.5">El push es lo único que sube a GitHub.</text>

  <rect x="420" y="364" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#C2510A" stroke-width="1.4"/>
  <text x="438" y="384" font-size="10" font-weight="700" fill="#C2510A">② CERRAR ≠ MERGEAR</text>
  <text x="438" y="401" class="sub" font-size="10.5">Cerrar un PR no fusiona nada.</text>

  <rect x="800" y="364" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#0D7C5A" stroke-width="1.4"/>
  <text x="818" y="384" font-size="10" font-weight="700" fill="#0D7C5A">③ EL ORDEN IMPORTA</text>
  <text x="818" y="401" class="sub" font-size="10.5">¿Registro de PR? Créalo ANTES del merge.</text>

  <!-- ===== EJEMPLO de la sesión ===== -->
  <rect x="40" y="430" width="1120" height="86" rx="9" fill="#FAFAF7" stroke="#E8E3D8"/>
  <text x="58" y="451" class="role" fill="#9B9B9B">EN ESTA SESIÓN</text>
  <text x="58" y="475" font-size="11"><tspan font-weight="700" fill="#2E6B9E">Rama A</tspan> <tspan class="mono" fill="#1C1C1C">commit → push → gh pr create #8 → gh pr close → git merge --no-ff → push</tspan></text>
  <text x="58" y="492" font-size="10.5" fill="#6B6B6B">⟹ el PR quedó <tspan font-weight="700" fill="#B91C1C">Closed</tspan>, pero la rama <tspan font-weight="700" fill="#0D7C5A">SÍ se integró</tspan> por el merge nativo posterior.</text>
  <text x="58" y="509" font-size="11"><tspan font-weight="700" fill="#2E6B9E">Rama B</tspan> <tspan class="mono" fill="#1C1C1C">git merge --no-ff → push</tspan><tspan fill="#6B6B6B">  ⟹  gh pr create después falla: «No commits between…» (ya integrada).</tspan></text>

  <!-- ===== LEYENDA ===== -->
  <g>
    <rect x="40" y="534" width="13" height="13" rx="2" fill="#0D7C5A"/><text x="58" y="544" class="sub">merge = integra (git)</text>
    <rect x="232" y="534" width="13" height="13" rx="2" fill="#C2510A"/><text x="250" y="544" class="sub">PR = documenta/revisa (gh)</text>
    <rect x="470" y="534" width="13" height="13" rx="2" fill="#1E3A5F"/><text x="488" y="544" class="sub">GitHub (servidor) = lo que pusheas</text>
    <line x1="740" y1="540" x2="772" y2="540" stroke="#9B9B9B" stroke-width="1.2" stroke-dasharray="5 4"/><text x="780" y="544" class="sub">frontera local | GitHub</text>
  </g>

  <!-- FOOTER -->
  <text x="600" y="600" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9B9B9B">Cheatsheet git/gh · merge (nativo) y PR (GitHub) son independientes · sesión dev DDF-Wizard · paleta COIIAOC (tipografía V2) · 2026-06-09</text>
</svg>
