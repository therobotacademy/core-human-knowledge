  <style>

      padding: 0 24px;
      border-left: 6px solid var(--c-accent-orange);

      top: 0;

    }

    }
    .badge-count {

    }

      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      background: var(--c-surface);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--c-border);
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 480px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--c-border);
      border-radius: 6px;
      background: var(--c-panel);
      outline: none;
      transition: all 0.15s;

    .search-box input:focus {
      border-color: var(--c-blue);

      font-size: 14px;

    }
    .shortcut-hint {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 11px;

      padding: 2px 6px;
      border-radius: 4px;

    .chip {

  <script>
    // Embedded Catalog Data
    const CATALOG = {"version":"1.0.0","lastUpdated":"2026-09-10T19:11:20Z","totalGuides":6,"availableTypes":["ALL","CHEATSHEET","TUTORIAL","PROCEDIMIENTO","REFERENCIA"],"guides":[{"id":"01","type":"CHEATSHEET","slug":"git-PR-vs-merge","title":"Cheatsheet · Git nativo (merge) vs. Pull Requests de GitHub (`gh`)","summary":"**Idea rectora: un *merge* y un *PR* son operaciones independientes.**","mdFilename":"01-CHEATSHEET-git-PR-vs-merge.md","svgFilename":"01-CHEATSHEET-git-PR-vs-merge.svg","hasSvg":true,"tags":["cheatsheet","git","PR","vs","merge"],"contentMarkdown":"# Cheatsheet · Git nativo (merge) vs. Pull Requests de GitHub (`gh`)\r\n\r\n\u003e **Idea rectora: un *merge* y un *PR* son operaciones independientes.**\r\n\u003e - El **merge** es **git nativo**: fusiona ramas en tu repo local; GitHub no se entera hasta que haces `push`.\r\n\u003e - El **PR** es un objeto **de GitHub** (una solicitud de revisión/integración) que vive en el servidor; no cambia tu repo local.\r\n\u003e - Puedes **mergear sin PR**, y **cerrar un PR sin mergear**. No son lo mismo.\r\n\r\n---\r\n\r\n## Sección 1 · Pull Requests (GitHub · vía `gh`)\r\n\r\n**Qué es:** una propuesta de integrar la rama `HEAD` en la rama `BASE`, gestionada en GitHub. Sirve para revisión/registro; **por sí solo no toca tu código local**.\r\n\r\n**Reglas que aprendimos:**\r\n- **Cerrar ≠ mergear.** `gh pr close` descarta la propuesta **sin fusionar nada**.\r\n- **Hace falta diferencia.** Sólo se puede crear un PR si `HEAD` tiene commits que no están en `BASE`. Si la rama **ya está mergeada** → error `No commits between BASE and HEAD`.\r\n- **El orden importa:** si quieres dejar registro de PR, **crea el PR ANTES del merge**. Después del merge ya no se puede.\r\n\r\n**Comandos:**\r\n```bash\r\ngh pr create --base master --head dev/mi-rama \\\r\n     --title \"Título\" --body-file cuerpo.md     # crear\r\ngh pr view 8 --json number,state,headRefName     # consultar\r\ngh pr close 8                                    # cerrar SIN borrar rama\r\ngh pr close 8 --delete-branch                    # cerrar Y borrar rama\r\ngh pr merge 8 --merge | --squash | --rebase      # mergear DESDE GitHub\r\n```\r\n\r\n**Autenticación de `gh` (distinta de git):**\r\n- `gh` necesita su propio login (`gh auth login`); el *credential helper* de git **no** lo loguea.\r\n- Si `gh` no está logueado pero git sí puede pushear, reutiliza la credencial de git como token:\r\n  ```bash\r\n  GH_TOKEN=$(printf \"protocol=https\\nhost=github.com\\n\\n\" \\\r\n       | git credential fill | sed -n \u0027s/^password=//p\u0027)\r\n  GH_TOKEN=\"$GH_TOKEN\" gh pr create ...\r\n  ```\r\n- En Windows, si `gh` no está en el PATH: `\u0026 \"C:\\Program Files\\GitHub CLI\\gh.exe\" ...`\r\n\r\n---\r\n\r\n## Sección 2 · Git nativo (merge) y su relación con GitHub\r\n\r\n**El merge real** (lo que de verdad mete la rama en `master`):\r\n```bash\r\ngit stash push -m wip -- ruta/fichero   # 1. árbol limpio (o commitea) antes de cambiar de rama\r\ngit checkout master                     # 2. sitúate en la rama destino\r\ngit merge --no-ff dev/mi-rama \\         # 3. fusiona (--no-ff = commit de merge explícito)\r\n     -m \"Merge dev/mi-rama: ...\"\r\ngit push origin master                  # 4. SUBE el resultado a GitHub  ← clave\r\ngit checkout dev/mi-rama \u0026\u0026 git stash pop # 5. vuelve y recupera tu trabajo\r\n```\r\n- `--no-ff` crea un **commit de merge** (deja constancia de la integración, convención del repo).\r\n  *Alternativa:* fast-forward (sin commit de merge) si la rama es `master`+N lineal.\r\n\r\n**Relación con GitHub:**\r\n- GitHub solo \"ve\" lo que **pusheas**. El merge local **no aparece** en GitHub hasta `git push`.\r\n- **Merge local + push = `master` actualizado en GitHub, sin ningún PR.**\r\n- Si había un PR **abierto** de esa rama, al pushear el merge GitHub suele marcarlo **\"Merged\"** al detectar los commits en `BASE`. Si lo habías **cerrado antes** (como el #8), queda **\"Closed\"**, no \"Merged\".\r\n- `gh pr close` **no hace nada** en tu git local ni en `master`.\r\n\r\n**Conservar la rama:** ni el merge ni `gh pr close` (sin `--delete-branch`) la borran. Para borrarla:\r\n```bash\r\ngit branch -d dev/mi-rama                 # local\r\ngit push origin --delete dev/mi-rama      # remota\r\n```\r\n\r\n---\r\n\r\n## Tabla resumen — qué hace cada operación\r\n\r\n| Acción | ¿Cambia `master` local? | ¿Sube a GitHub? | ¿Afecta al PR? |\r\n|---|:--:|:--:|:--:|\r\n| `git merge --no-ff` | **sí** | no (hasta push) | no |\r\n| `git push origin master` | no (sube lo ya hecho) | **sí** | lo marca *merged* si seguía abierto |\r\n| `gh pr create` | no | no | **crea** el PR |\r\n| `gh pr close` | no | no | **cierra** (sin fusionar) |\r\n| `gh pr merge` | — | sí (lo hace `gh`) | **mergea + cierra** |\r\n\r\n---\r\n\r\n## Lo que pasó en esta sesión (ejemplo real)\r\n\r\n- **Rama A `dev/ddf-wizard-alpha`:** `commit` → `push` → `gh pr create` (#8) → `gh pr close 8` (sin mergear) → `git merge --no-ff` a `master` → `push`.\r\n  → El PR quedó **Closed**, pero el trabajo **sí entró** en `master` por el merge nativo posterior. (PR y merge, independientes.)\r\n- **Rama B `dev/ddf-app-template`:** `git merge --no-ff` directo a `master` → `push`. Al intentar `gh pr create` **después**, GitHub respondió `No commits between master and dev/ddf-app-template` → ya estaba integrada, no había nada que proponer.\r\n\r\n\u003e Moraleja: **el merge integra; el PR documenta/revisa.** Si quieres ambas cosas con su registro en GitHub, haz el PR **primero** y mergéalo (o ciérralo) **después**.\r\n\r\n---\r\n\r\n*Referencia derivada de las operaciones de la sesión dev DDF-Wizard · 2026-06-09.*\r\n","contentSvg":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\r\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"618\" viewBox=\"0 0 1200 618\"\u003e\r\n  \u003cdefs\u003e\r\n    \u003cmarker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" ori  y2=\"340\" stroke=\"#9B9B9B\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/\u003e\r\n  \u003ctext x=\"300\" y=\"92\" text-anchor=\"middle\" class=\"role\" fill=\"#1E3A5F\"\u003e● TU REPO · GIT NATIVO (local)\u003c/text\u003e\r\n  \u003ctext x=\"900\" y=\"92\" text-anchor=\"middle\" class=\"role\" fill=\"#2E6B9E\"\u003e● GITHUB · servidor (gh)\u003c/text\u003e\r\n\r\n  \u003c!-- ===== LEFT · git flow ===== --\u003e\r\n  \u003crect x=\"150\" y=\"104\" width=\"300\" height=\"42\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\r\n  \u003ctext x=\"300\" y=\"130\" text-anchor=\"middle\" class=\"bt\"\u003erama  \u003ctspan class=\"mono\" font-size=\"11.5\"\u003edev/mi-rama\u003c/tspan\u003e\u003c/text\u003e\r\n\r\n  \u003cline x1=\"300\" y1=\"146\" x2=\"300\" y2=\"170\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\r\n  \u003ctext x=\"312\" y=\"162\" class=\"mono lbl\"\u003egit commit\u003c/text\u003e\r\n\r\n  \u003crect x=\"150\" y=\"172\" width=\"300\" height=\"42\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\r\n  \u003ctext x=\"300\" y=\"198\" text-anchor=\"middle\" class=\"cmd mono\"\u003egit checkout master\u003c/text\u003e\r\n\r\n  \u003cline x1=\"300\" y1=\"214\" x2=\"300\" y2=\"268\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\r\n  \u003ctext x=\"312\" y=\"244\" class=\"mono lbl\" fill=\"#0D7C5A\"\u003egit merge --no-ff\u003c/text\u003e\r\n\r\n  \u003crect x=\"150\" y=\"270\" width=\"300\" height=\"58\" rx=\"8\" fill=\"#E7F1EC\" stroke=\"#0D7C5A\" stroke-width=\"1.6\" filter=\"url(#sh)\"/\u003e\r\n  \u003ctext x=\"300\" y=\"293\" text-anchor=\"middle\" class=\"bt\" fill=\"#0A5C43\"\u003emaster (local) ✓\u003c/text\u003e\r\n  \u003ctext x=\"300\" y=\"312\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\"\u003ela rama queda integrada — el MERGE integra\u003c/text\u003e\r\n\r\n  \u003c!-- ===== git push (the bridge) ===== --\u003e\r\n  \u003cline x1=\"450\" y1=\"299\" x2=\"658\" y2=\"299\" stroke=\"#C2510A\" stroke-width=\"2.6\" marker-end=\"url(#aOrange)\"/\u003e\r\n  \u003crect x=\"512\" y=\"284\" width=\"78\" height=\"18\" rx=\"9\" fill=\"#F5F2EC\"/\u003e\r\n  \u003ctext x=\"551\" y=\"297\" text-anchor=\"middle\" class=\"mono\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C2510A\"\u003egit push\u003c/text\u003e\r\n\r\n  \u003c!-- ===== RIGHT · PR object ===== --\u003e\r\n  \u003crect x=\"660\" y=\"104\" width=\"480\" height=\"140\" rx=\"9\" fill=\"#FFF7ED\" stroke=\"#C2510A\" stroke-width=\"2\" filter=\"url(#sh)\"/\u003e\r\n  \u003ctext x=\"680\" y=\"126\" class=\"bt\" fill=\"#7C2D12\"\u003ePR · objeto de GitHub  (gh)\u003c/text\u003e\r\n  \u003ctext x=\"680\" y=\"150\" class=\"mono\" font-size=\"12\" font-weight=\"700\" fill=\"#C2510A\"\u003egh pr create\u003c/text\u003e\r\n  \u003ctext x=\"846\" y=\"150\" class=\"lbl\" fill=\"#4A3000\"\u003ecrea la propuesta (necesita commits de diff)\u003c/text\u003e\r\n  \u003ctext x=\"680\" y=\"172\" class=\"mono\" font-size=\"12\" font-weight=\"700\" fill=\"#C2510A\"\u003egh pr close\u003c/text\u003e\r\n  \u003ctext x=\"846\" y=\"172\" class=\"lbl\" fill=\"#4A3000\"\u003ecierra · \u003ctspan font-weight=\"700\" fill=\"#B91C1C\"\u003eNO fusiona\u003c/tspan\u003e\u003c/text\u003e\r\n  \u003ctext x=\"680\" y=\"194\" class=\"mono\" font-size=\"12\" font-weight=\"700\" fill=\"#C2510A\"\u003egh pr merge\u003c/text\u003e\r\n  \u003ctext x=\"846\" y=\"194\" class=\"lbl\" fill=\"#4A3000\"\u003efusiona + cierra (en el servidor)\u003c/text\u003e\r\n  \u003cline x1=\"680\" y1=\"206\" x2=\"1120\" y2=\"206\" stroke=\"#E8C9A8\" stroke-width=\"1\"/\u003e\r\n  \u003ctext x=\"680\" y=\"226\" font-style=\"italic\" font-size=\"9.5\" fill=\"#8A4A00\"\u003eindependiente del merge local · no toca tu repo · login propio (gh auth)\u003c/text\u003e\r\n\r\n  \u003c!-- alt path: gh pr merge → origin --\u003e\r\n  \u003cline x1=\"760\" y1=\"244\" x2=\"760\" y2=\"269\" stroke=\"#9B9B9B\" stroke-width=\"1.1\" stroke-dasharray=\"4 3\" marker-end=\"url(#aMute)\"/\u003e\r\n  \u003ctext x=\"772\" y=\"261\" class=\"lbl\" font-size=\"9.5\" font-style=\"italic\"\u003eo bien: gh pr merge\u003c/text\u003e\r\n\r\n  \u003c!-- origin/master (push target) --\u003e\r\n  \u003crect x=\"660\" y=\"270\" width=\"380\" height=\"58\" rx=\"8\" fill=\"#1E3A5F\" filter=\"url(#sh)\"/\u003e\r\n  \u003ctext x=\"850\" y=\"293\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#FFFFFF\"\u003eorigin/master  (GitHub)\u003c/text\u003e\r\n  \u003ctext x=\"850\" y=\"312\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#9AB0C8\"\u003e= lo único que GitHub «ve»\u003c/text\u003e\r\n\r\n  \u003c!-- ===== REGLAS (3 chips) ===== --\u003e\r\n  \u003crect x=\"40\" y=\"364\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#1E3A5F\" stroke-width=\"1.4\"/\u003e\r\n  \u003ctext x=\"58\" y=\"384\" font-size=\"10\" font-weight=\"700\" fill=\"#1E3A5F\"\u003e① EL PUENTE\u003c/text\u003e\r\n  \u003ctext x=\"58\" y=\"401\" class=\"sub\" font-size=\"10.5\"\u003eEl push es lo único que sube a GitHub.\u003c/text\u003e\r\n\r\n  \u003crect x=\"420\" y=\"364\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.4\"/\u003e\r\n  \u003ctext x=\"438\" y=\"384\" font-size=\"10\" font-weight=\"700\" fill=\"#C2510A\"\u003e② CERRAR ≠ MERGEAR\u003c/text\u003e\r\n  \u003ctext x=\"438\" y=\"401\" class=\"sub\" font-size=\"10.5\"\u003eCerrar un PR no fusiona nada.\u003c/text\u003e\r\n\r\n  \u003crect x=\"800\" y=\"364\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.4\"/\u003e\r\n  \u003ctext x=\"818\" y=\"384\" font-size=\"10\" font-weight=\"700\" fill=\"#0D7C5A\"\u003e③ EL ORDEN IMPORTA\u003c/text\u003e\r\n  \u003ctext x=\"818\" y=\"401\" class=\"sub\" font-size=\"10.5\"\u003e¿Registro de PR? Créalo ANTES del merge.\u003c/text\u003e\r\n\r\n  \u003c!-- ===== EJEMPLO de la sesión ===== --\u003e\r\n  \u003crect x=\"40\" y=\"430\" width=\"1120\" height=\"86\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\"/\u003e\r\n  \u003ctext x=\"58\" y=\"451\" class=\"role\" fill=\"#9B9B9B\"\u003eEN ESTA SESIÓN\u003c/text\u003e\r\n  \u003ctext x=\"58\" y=\"475\" font-size=\"11\"\u003e\u003ctspan font-weight=\"700\" fill=\"#2E6B9E\"\u003eRama A\u003c/tspan\u003e \u003ctspan class=\"mono\" fill=\"#1C1C1C\"\u003ecommit → push → gh pr create #8 → gh pr close → git merge --no-ff → push\u003c/tspan\u003e\u003c/text\u003e\r\n  \u003ctext x=\"58\" y=\"492\" font-size=\"10.5\" fill=\"#6B6B6B\"\u003e⟹ el PR quedó \u003ctspan font-weight=\"700\" fill=\"#B91C1C\"\u003eClosed\u003c/tspan\u003e, pero la rama \u003ctspan font-weight=\"700\" fill=\"#0D7C5A\"\u003eSÍ se integró\u003c/tspan\u003e por el merge nativo posterior.\u003c/text\u003e\r\n  \u003ctext x=\"58\" y=\"509\" font-size=\"11\"\u003e\u003ctspan font-weight=\"700\" fill=\"#2E6B9E\"\u003eRama B\u003c/tspan\u003e \u003ctspan class=\"mono\" fill=\"#1C1C1C\"\u003egit merge --no-ff → push\u003c/tspan\u003e\u003ctspan fill=\"#6B6B6B\"\u003e  ⟹  gh pr create después falla: «No commits between…» (ya integrada).\u003c/tspan\u003e\u003c/text\u003e\r\n\r\n  \u003c!-- ===== LEYENDA ===== --\u003e\r\n  \u003cg\u003e\r\n    \u003crect x=\"40\" y=\"534\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#0D7C5A\"/\u003e\u003ctext x=\"58\" y=\"544\" class=\"sub\"\u003emerge = integra (git)\u003c/text\u003e\r\n    \u003crect x=\"232\" y=\"534\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#C2510A\"/\u003e\u003ctext x=\"250\" y=\"544\" class=\"sub\"\u003ePR = documenta/revisa (gh)\u003c/text\u003e\r\n    \u003crect x=\"470\" y=\"534\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#1E3A5F\"/\u003e\u003ctext x=\"488\" y=\"544\" class=\"sub\"\u003eGitHub (servidor) = lo que pusheas\u003c/text\u003e\r\n    \u003cline x1=\"740\" y1=\"540\" x2=\"772\" y2=\"540\" stroke=\"#9B9B9B\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"780\" y=\"544\" class=\"sub\"\u003efrontera local | GitHub\u003c/text\u003e\r\n  \u003c/g\u003e\r\n\r\n  \u003c!-- FOOTER --\u003e\r\n  \u003ctext x=\"600\" y=\"600\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\"\u003eCheatsheet git/gh · merge (nativo) y PR (GitHub) son independientes · sesión dev DDF-Wizard · paleta COIIAOC (tipografía V2) · 2026-06-09\u003c/text\u003e\r\n\u003c/svg\u003e\r\n"},{"id":"02","type":"TUTORIAL","slug":"git-worktree","title":"Tutorial — `git worktree`","summary":"Cómo tener **varias ramas abiertas a la vez en carpetas distintas**, compartiendo un único repositorio.","mdFilename":"02-TUTORIAL-git-worktree.md","svgFilename":"02-TUTORIAL-git-worktree.svg","hasSvg":true,"tags":["tutorial","git","worktree"],"contentMarkdown":"# Tutorial — `git worktree`\n\n\u003e Cómo tener **varias ramas abiertas a la vez en carpetas distintas**, compartiendo un único repositorio.\n\u003e Escrito sobre el caso real de este repo (`master` con LAB4 + rama `skill/prueba-validacion`), en Windows + PowerShell.\n\n---\n\n## 1. El problema que resuelve\n\nCon git \"normal\" solo puedes tener **una rama** checada en tu carpeta a la vez. Si estás en `skill/prueba-validacion` y necesitas mirar (o ejecutar) los ficheros de `master`, tienes que:\n\n- `git switch master` → pero entonces **pierdes de vista** tu trabajo de PV (y si tienes cambios sin commitear, te toca `git stash`).\n- o clonar el repo otra vez en otra carpeta → pero eso **duplica** el `.git` entero y se desincroniza.\n\n`git worktree` resuelve esto: **un mismo repositorio, varios directorios de trabajo**, cada uno con una rama distinta checada, todos compartiendo la misma base de objetos y refs.\n\n```\n                ┌──────────────────────────────┐\n                │   repositorio (.git único)    │\n                │  commits · ramas · tags · stash│\n                └───────────────┬───────────────┘\n              ┌─────────────────┼──────────────────┐\n              ▼                 ▼                  ▼\n   carpeta principal     ../LAB4-master      ../revision-pr\n   rama: skill/pv        rama: master        rama: labs/1\n   (tu trabajo)          (referencia LAB4)   (revisar otra cosa)\n```\n\nEs **un solo repo** visto desde tres carpetas, cada una \"congelada\" en una rama diferente.\n\n---\n\n## 2. Modelo mental (lo que comparten y lo que no)\n\n| Se **comparte** entre worktrees | Es **propio** de cada worktree |\n| --- | --- |\n| Historial de commits, ramas, tags | El directorio de trabajo (los ficheros en disco) |\n| El `stash` (es global) | El `HEAD` (qué rama/commit tiene checada) |\n| `remotes` y la mayoría de `config` | El índice (staging area) |\n| Los hooks de `.git/hooks` | Ficheros **no rastreados** e **ignorados** (`.tmp/`, `node_modules/`, PDFs de QA…) |\n\n**Consecuencia práctica clave:** los ficheros ignorados/temporales **no viajan** entre worktrees. Si en la carpeta principal tienes `.tmp/` con scripts de build o `node_modules/`, en `../LAB4-master` **no estarán** — cada worktree parte limpio salvo lo versionado. Esto suele ser una ventaja (aíslas builds), pero conviene saberlo.\n\n**La regla de oro:** una rama solo puede estar checada en **un** worktree a la vez. Git te impedirá checar `master` en dos sitios — y está bien, porque evita que edites la misma rama desde dos carpetas y te pises.\n\n---\n\n## 3. El caso de este repo\n\nSituación: estás en `skill/prueba-validacion` y quieres **consultar los ficheros de LAB4 que viven en `master`** sin mezclarlos en tu rama de trabajo.\n\n```powershell\n# Estás en la carpeta principal, rama skill/prueba-validacion\ngit worktree add ..\\LAB4-master master\n```\n\nEsto crea la carpeta hermana `..\\LAB4-master` con `master` checado. Ahora:\n\n- **Carpeta principal** (`46-UNIPRO-...`) → rama `skill/prueba-validacion`, tu trabajo del skill.\n- **`..\\LAB4-master`** → rama `master`, con `raw-unipro/LABORATORIOS/LAB4.../materiales/`, `intuitions.md`, `wiki/lab4-guia/`, etc., para consultar o ejecutar.\n\nCuando termines de consultar, la quitas (sección 6). El trabajo de PV nunca se \"ensucia\" con el contenido de LAB4.\n\n\u003e En este repo ya hicimos la **Opción A** (merge de `master` en la rama PV), así que LAB4 ya está disponible en la carpeta principal. El worktree (Opción B) es la alternativa para cuando **no** quieras esa mezcla — ver la comparación en §7.\n\n---\n\n## 4. Comandos esenciales\n\n### Crear un worktree\n\n```powershell\n# Rama EXISTENTE en una carpeta nueva\ngit worktree add ..\\LAB4-master master\n\n# Rama NUEVA creada al vuelo (equivale a git switch -c)\ngit worktree add -b hotfix/typo ..\\hotfix master\n#  └ crea la rama hotfix/typo a partir de master, en ../hotfix\n\n# Solo inspeccionar un commit/rama SIN ocupar la rama (HEAD desacoplado)\ngit worktree add --detach ..\\inspeccion v1.0\n#  útil para mirar/compilar algo puntual sin \"reservar\" la rama\n```\n\n### Listar\n\n```powershell\ngit worktree list\n# C:/.../46-UNIPRO-...        0964670 [skill/prueba-validacion]\n# C:/.../LAB4-master          83cdd35 [master]\n```\n\n### Quitar (cuando ya no lo necesitas)\n\n```powershell\ngit worktree remove ..\\LAB4-master        # debe estar limpio\ngit worktree remove --force ..\\LAB4-master # si tiene cambios sin guardar\n```\n\n### Limpiar referencias huérfanas\n\nSi borraste la carpeta **a mano** (con el explorador) en vez de con `remove`, git se queda con un registro fantasma. Lo limpias con:\n\n```powershell\ngit worktree prune\n```\n\n### Otros\n\n```powershell\ngit worktree move ..\\LAB4-master ..\\nueva-ubicacion   # mover de sitio\ngit worktree lock ..\\LAB4-master      # evita que prune lo borre (p. ej. en un USB)\ngit worktree unlock ..\\LAB4-master\n```\n\n---\n\n## 5. Anatomía (para entender qué pasa por dentro)\n\n- La carpeta principal tiene el `.git/` real (la base de datos del repo).\n- Cada worktree enlazado **no** tiene un `.git/` carpeta, sino un **fichero** `.git` con una línea `gitdir: .../.git/worktrees/\u003cnombre\u003e`.\n- Dentro de `.git/worktrees/\u003cnombre\u003e/` git guarda el `HEAD`, el índice y la config propia de ese worktree.\n\nNo necesitas tocar nada de eso, pero saberlo explica por qué **no se duplica** el historial (a diferencia de un `git clone`): solo se añade un puntero ligero.\n\n---\n\n## 6. Ciclo de vida típico (de principio a fin)\n\n```powershell\n# 1. Crear el worktree de referencia\ngit worktree add ..\\LAB4-master master\n\n# 2. Trabajar: en la carpeta principal sigues con PV;\n#    cuando necesites LAB4, abres ..\\LAB4-master (otra ventana del editor)\n\n# 3. (opcional) actualizarlo si master avanza\ncd ..\\LAB4-master\ngit pull            # o git fetch + git merge\ncd ..\\46-UNIPRO-... # vuelves a tu carpeta de PV\n\n# 4. Al terminar, eliminarlo\ngit worktree remove ..\\LAB4-master\n```\n\n---\n\n## 7. ¿Worktree o merge? (Opción B vs Opción A)\n\nLas dos formas de \"trabajar en PV teniendo LAB4 a mano\":\n\n| | **Opción A — merge** (`git merge master`) | **Opción B — worktree** |\n| --- | --- | --- |\n| Qué hace | Trae el contenido de `master` **dentro** de la rama PV | Monta `master` en **otra carpeta** |\n| Resultado | Una sola carpeta con LAB4 + PV juntos | Dos carpetas, ramas separadas |\n| LAB4 acaba… | **versionado en PV** (hasta que mergees a master) | solo como **referencia**, fuera de los commits de PV |\n| Historia | crea un commit de merge | no toca la historia |\n| Cuándo conviene | quieres de verdad incorporar lo de master a tu rama | LAB4 es **solo consulta** y quieres PV \"limpia\" |\n| Coste | resolver conflictos una vez | gestionar una carpeta extra |\n\nRegla rápida: **¿necesito que el contenido de master forme parte de mi rama?** → A (merge). **¿solo lo quiero ver/ejecutar al lado?** → B (worktree).\n\n---\n\n## 8. Worktree frente a otras alternativas\n\n| Herramienta | Para qué | Por qué worktree puede ser mejor |\n| --- | --- | --- |\n| `git switch` | cambiar de rama en la misma carpeta | switch te obliga a **abandonar** la rama actual; worktree las tiene **a la vez** |\n| `git stash` | guardar cambios a medias | con worktree no necesitas stash: cada rama vive en su carpeta |\n| `git clone` (2.ª copia) | otra copia del repo | clone **duplica** `.git` y se desincroniza; worktree comparte uno solo |\n\nCasos de uso habituales del worktree:\n- **Referencia en paralelo** (nuestro caso: LAB4 mientras trabajas en PV).\n- **Hotfix urgente**: arreglar un bug en `master` sin tocar tu feature a medias.\n- **Revisar un PR**: checar la rama de otro en una carpeta aparte y ejecutarla.\n- **Builds/tests largos**: lanzar la suite en un worktree mientras sigues programando en otro.\n\n---\n\n## 9. Notas para Windows + PowerShell (este repo)\n\n- **Rutas con espacios:** este repo cuelga de `...\\Mi unidad\\__Active-AGENTS\\...`. Si la ruta del worktree lleva espacios, **entre comillas**:\n  ```powershell\n  git worktree add \"..\\LAB4 master\" master\n  ```\n  (Mejor evita espacios en el nombre del worktree: usa `..\\LAB4-master`.)\n- **Pon el worktree FUERA del repo**, como hermano (`..\\nombre`), nunca dentro de la carpeta del repo (git intentaría rastrearlo y se lía).\n- **Google Drive:** la carpeta está sincronizada con Drive. Un worktree hermano (`..\\LAB4-master`) **también** se sincronizará. No es un problema, pero genera tráfico de sync; para algo efímero, considera crearlo en una ruta local fuera de Drive (p. ej. `C:\\tmp\\LAB4-master`):\n  ```powershell\n  git worktree add C:\\tmp\\LAB4-master master\n  ```\n- **Ficheros de bloqueo de Office (`~$*.docx`) y `.tmp/`:** recuerda que **no** se comparten entre worktrees (son ignorados/no rastreados). Cada carpeta tiene los suyos.\n\n---\n\n## 10. Errores comunes y cómo evitarlos\n\n| Síntoma | Causa | Solución |\n| --- | --- | --- |\n| `fatal: \u0027master\u0027 is already checked out at ...` | intentas checar en dos sitios la misma rama | usa otra rama, o `--detach` para solo inspeccionar |\n| Borré la carpeta a mano y `worktree list` aún la muestra | git no se enteró | `git worktree prune` |\n| `remove` se queja de cambios sin guardar | el worktree está sucio | commitea/descarta, o `git worktree remove --force` |\n| No veo mi `node_modules` / `.tmp` en el nuevo worktree | son ignorados, no se comparten | reinstala/regenera en ese worktree si los necesitas |\n| El worktree quedó \"detached HEAD\" | lo creaste con un commit/tag, no una rama | normal para inspección; crea rama con `git switch -c` si vas a commitear |\n\n---\n\n## 11. Chuleta\n\n```powershell\ngit worktree add  ..\\dir \u003crama\u003e        # nueva carpeta con una rama existente\ngit worktree add -b \u003crama\u003e ..\\dir base # crear rama nueva + carpeta\ngit worktree add --detach ..\\dir \u003cref\u003e # inspección sin ocupar rama\ngit worktree list                      # ver todos\ngit worktree remove ..\\dir             # quitar (limpio)\ngit worktree remove --force ..\\dir     # quitar (con cambios)\ngit worktree prune                     # limpiar fantasmas\ngit worktree move ..\\dir ..\\otro       # mover\ngit worktree lock / unlock ..\\dir      # proteger de prune\n```\n\n**En una frase:** `git worktree` te da varias \"ventanas\" sobre el mismo repositorio, cada una en una rama distinta y en su propia carpeta, sin clonar ni hacer malabares con `stash` — ideal para tener `master` (referencia de LAB4) abierto al lado de tu rama de trabajo `skill/prueba-validacion`.\n","contentSvg":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"634\" viewBox=\"0 0 1200 634\"\u003e\n  \u003cdefs\u003e\n    \u003cmarker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aMute\" markerWidth=\"9\" markerHeight=\"7\" refX=\"7\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 8 3.5, 0 7\" fill=\"#9B9B9B\"/\u003e\u003c/marke ext x=\"600\" y=\"118\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#9AB0C8\"\u003ecommits · ramas · tags · stash · remotes  —  base de objetos compartida\u003c/text\u003e\n\n  \u003c!-- fan-out arrows (mismo .git → 3 HEAD distintos) --\u003e\n  \u003cline x1=\"520\" y1=\"132\" x2=\"222\" y2=\"170\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n  \u003cline x1=\"600\" y1=\"132\" x2=\"600\" y2=\"170\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n  \u003cline x1=\"680\" y1=\"132\" x2=\"978\" y2=\"170\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n  \u003ctext x=\"600\" y=\"160\" text-anchor=\"middle\" class=\"sub\" font-style=\"italic\"\u003emisma base · distinto HEAD por carpeta\u003c/text\u003e\n\n  \u003c!-- ===== 3 WORKTREES (carpetas hermanas) ===== --\u003e\n  \u003c!-- 1 · carpeta principal (rama activa) --\u003e\n  \u003crect x=\"60\" y=\"176\" width=\"74\" height=\"12\" rx=\"3\" fill=\"#0D7C5A\"/\u003e\n  \u003crect x=\"60\" y=\"184\" width=\"320\" height=\"72\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.6\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"220\" y=\"208\" text-anchor=\"middle\" class=\"bt\"\u003ecarpeta principal\u003c/text\u003e\n  \u003ctext x=\"220\" y=\"228\" text-anchor=\"middle\" class=\"mono\" font-size=\"12\" font-weight=\"700\" fill=\"#0A5C43\"\u003eskill/prueba-validacion\u003c/text\u003e\n  \u003ctext x=\"220\" y=\"246\" text-anchor=\"middle\" class=\"sub\"\u003etu trabajo — la rama activa\u003c/text\u003e\n\n  \u003c!-- 2 · referencia LAB4 --\u003e\n  \u003crect x=\"440\" y=\"176\" width=\"74\" height=\"12\" rx=\"3\" fill=\"#C2510A\"/\u003e\n  \u003crect x=\"440\" y=\"184\" width=\"320\" height=\"72\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.6\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"600\" y=\"208\" text-anchor=\"middle\" class=\"bt\"\u003e\u003ctspan class=\"mono\" font-size=\"12\"\u003e..\\LAB  · Windows + PowerShell · paleta COIIAOC (tipografía V2) · 2026-06-09\u003c/text\u003e\n\u003c/svg\u003e\n"},{"id":"03","type":"TUTORIAL","slug":"git-force-with-lease","title":"Tutorial — `git push --force-with-lease`","summary":"Cómo reescribir historia ya publicada **sin machacar** el trabajo de un compañero (o de una sesión paralela).","mdFilename":"03-TUTORIAL-git-force-with-lease.md","svgFilename":"03-TUTORIAL-git-force-with-lease.svg","hasSvg":true,"tags":["tutorial","git","force","with","lease"],"contentMarkdown":"# Tutorial — `git push --force-with-lease`\n\n\u003e Cómo reescribir historia ya publicada **sin machacar** el trabajo de un compañero (o de una sesión paralela).\n\u003e Fundamentado en el caso real de este repo: el hook `push-prompt-log.ps1`, que enmienda el mismo commit diario y debe force-pushear — pero nunca sobrescribir lo que otro publicó mientras tanto.\n\n---\n\n## 1. El problema que resuelve\n\nUn push normal solo acepta **fast-forward**: el tip remoto debe ser ancestro de lo que mandas (solo añades commits encima). En cuanto **reescribes** historia — `git commit --amend`, `git rebase`, `git reset` — tu commit nuevo ya no desciende del tip remoto, y git se niega:\n\n```\n$ git push\n ! [rejected]  master -\u003e master (non-fast-forward)\nerror: failed to push some refs\nhint: Updates were rejected because the tip of your current branch is behind...\n```\n\nPara avanzar necesitas forzar. La pregunta es **cuál** de las dos fuerzas usar.\n\n---\n\n## 2. Las tres opciones (y por qué solo una es segura)\n\n| Comando | Comprobación de seguridad | Riesgo |\n|---|---|---|\n| `git push` | Solo fast-forward | No sirve tras reescribir historia |\n| `git push --force` | Ninguna | **Destruye** commits que no hayas visto |\n| `git push --force-with-lease` | Compara con tu último `fetch` | Rechaza si alguien movió el remoto |\n\n\u003e **Regla de oro:** nunca escribas `--force`. Escribe `--force-with-lease`.\n\n---\n\n## 3. Cómo funciona el \"lease\" (fianza)\n\nCuando haces `git fetch`, git registra dónde estaba el remoto en tu **ref de seguimiento** (`origin/master`). El lease es la promesa *\"creo que el remoto sigue en el commit X\"*. Al hacer push, git verifica esa promesa:\n\n- **Remoto sigue en X** (lo que viste la última vez) → el push **se acepta**.\n- **Remoto avanzó a Y** (alguien empujó algo) → el lease **se rompe**, el push **se rechaza** sin destruir nada.\n\n```\n$ git push --force-with-lease\n ! [rejected]  master -\u003e master (stale info)\nerror: failed to push some refs\n```\n\n`stale info` = el lease funcionó. Nadie perdió trabajo.\n\n---\n\n## 4. Por qué `--force` es peligroso\n\n```\nTú:        hiciste fetch de master en commit A, enmendaste → A\u0027\nMientras:  una sesión paralela publicó B encima de A\nTú:        git push --force   # remoto era A→B, ahora es A\u0027\n                              # commit B DESAPARECE. Silenciosamente.\n```\n\nNunca viste `B`. `--force` lo borró. En un `master` compartido así es como se pierde trabajo.\n\n---\n\n## 5. Cuándo necesitas un force push\n\nCada vez que **reescribes un commit ya publicado**:\n\n- `git commit --amend` sobre un commit ya pusheado (exactamente lo que hace el hook de este repo)\n- `git rebase` de una rama ya publicada (squash, reword, reorder, drop)\n- `git reset --hard \u003canterior\u003e` y re-push\n\n**No** necesitas force para trabajo normal (añadir commits nuevos = fast-forward).\n\n---\n\n## 6. El caso real de este repo\n\n`push-prompt-log.ps1` mantiene **un commit por día** (`c1 daily \u003cfecha\u003e`). El primer prompt del día lo crea; los posteriores lo **enmiendan** (reescriben un commit ya publicado) y vuelven a pushear:\n\n```powershell\nif ($head -eq $msg) {\n    # El commit de hoy está en HEAD: pliega los nuevos prompts.\n    git commit --amend --no-edit *\u003e$null\n    # --force-with-lease aborta con seguridad si una sesión paralela o el\n    # evaluador en la nube movió origin desde nuestro último fetch.\n    git push --force-with-lease *\u003e$null\n} else {\n    git commit -m $msg *\u003e$null   # primer commit del día\n    git push *\u003e$null             # push normal: solo fast-forward\n}\n```\n\nPor qué el lease es imprescindible aquí:\n\n- **Sesiones paralelas.** Varios procesos Claude comparten `master`. Dos amend-and-push en carrera son inevitables. El lease hace que **el perdedor sea rechazado** (y reintente) en vez de **borrar al ganador**.\n- **El evaluador en la nube.** La rutina nocturna hace commit `eval: …` y pushea a `master`. Si aterriza entre nuestro amend y nuestro push, el lease lo detecta.\n\nEl modo de fallo es suave: al recibir un lease roto el hook simplemente **sale** (el commit queda local); el siguiente `Stop` reintenta cuando la copia local esté al día.\n\n---\n\n## 7. Receta paso a paso (manual)\n\nEnmendaste un commit publicado y necesitas actualizar el remoto:\n\n```bash\n# 1. Asegura que tu ref de seguimiento refleja la realidad.\ngit fetch origin\n\n# 2. Comprueba que no vas a pisarte nada nuevo:\ngit log --oneline origin/master..HEAD     # tus commits que no están en remoto\ngit log --oneline HEAD..origin/master     # commits remotos que no están en los tuyos  ← quieres VACÍO\n\n# 3. Si la segunda línea está vacía, pushea con seguridad:\ngit push --force-with-lease\n\n# 4. Si NO estaba vacía, integra primero:\ngit pull --rebase        # o merge\ngit push --force-with-lease\n```\n\n---\n\n## 8. Gotchas\n\n- **No hagas `git fetch` inmediatamente antes de un `--force-with-lease` sin inspeccionar.** Hacer fetch refresca el lease al nuevo valor remoto — ya no puede detectar el cambio. Inspecciona siempre tras el fetch (receta §7) o ancla el lease explícitamente:\n  ```bash\n  git push --force-with-lease=master:\u003csha-que-esperas\u003e\n  ```\n- **Protege la ref, no el árbol de trabajo.** `--force-with-lease` no sabe nada de cambios locales sin commitear; solo compara el tip de rama.\n- **Opción más fuerte (git moderno):** `git push --force-with-lease --force-if-includes` también verifica que tu historial local **contenga** los commits remotos que vas a sobrescribir — cierra el hueco de \"hice fetch pero no mergé\".\n- **Hooks y CI** deben usar siempre `--force-with-lease`, nunca `--force` — no hay ningún humano mirando que pueda notar una sobrescritura silenciosa.\n\n---\n\n## 9. Chuleta\n\n```bash\n# Situación normal (solo añades commits)\ngit push\n\n# Enmendaste/rebasaste un commit ya publicado\ngit push --force-with-lease\n\n# Lease rechazado (stale info) → integra y reintenta\ngit fetch origin\ngit rebase origin/master     # o merge\ngit push --force-with-lease\n\n# Anclar el tip remoto esperado (máxima precisión)\ngit push --force-with-lease=master:\u003csha\u003e\n\n# Opción más segura en git moderno\ngit push --force-with-lease --force-if-includes\n\n# NUNCA\ngit push --force\n```\n\n---\n\n*Complementario a `02-TUTORIAL-git-worktree.md`. Uso real en `artifacts/Daily-Prompt-Evaluator/push-prompt-log.ps1`.*\n","contentSvg":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"634\" viewBox=\"0 0 1200 634\"\u003e\n  \u003cdefs\u003e\n    \u003cmarker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aGreen\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#0D7C5A\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aRed\"   markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#B91C1C\"/\u003e\u003c/marker\u003e\n    \u003cfilter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"\u003e\u003cfeDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.08)\"/\u003e\u003c/filter\u003e\n    \u00 t x=\"460\" y=\"74\" width=\"200\" height=\"54\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#1E3A5F\" stroke-width=\"1.6\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"560\" y=\"97\" text-anchor=\"middle\" class=\"bt\"\u003eRemoto \u003ctspan class=\"mono\" font-size=\"11\"\u003eorigin/master\u003c/tspan\u003e\u003c/text\u003e\n  \u003ctext x=\"560\" y=\"115\" text-anchor=\"middle\" class=\"mono\" font-size=\"11\" fill=\"#1E3A5F\"\u003eA  (last fetch)\u003c/text\u003e\n\n  \u003c!-- flecha push --\u003e\n  \u003cline x1=\"242\" y1=\"101\" x2=\"458\" y2=\"101\" stroke=\"#6B6B6B\" stroke-width=\"1.4\" marker-end=\"url(#aSlate)\" stroke-dasharray=\"5,3\"/\u003e\n  \u003ctext x=\"350\" y=\"94\" text-anchor=\"middle\" class=\"sub\" font-style=\"italic\"\u003epush A\u0027\u003c/text\u003e\n\n  \u003c!-- comprobación lease --\u003e\n  \u003crect x=\"714\" y=\"74\" width=\"204\" height=\"54\" rx=\"8\" fill=\"#EBF4FF\" stroke=\"#2E6B9E\" stroke-width=\"1.4\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"816\" y=\"97\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2E6B9E\"\u003e¿remoto == last fetch?\u003c/text\u003e\n  \u003ctext x=\"816\" y=\"115\" text-anchor=\"middle\" class=\"sub\"\u003eorigin/master coincide con tu lease\u003c/text\u003e\n\n  \u003cline x1=\"660\" y1=\"101\" x2=\"712\" y2=\"101\" stroke=\"#2E6B9E\" stroke-width=\"1.4\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- SÍ → éxito --\u003e\n  \u003crect x=\"966\" y=\"58\" width=\"194\" height=\"40\" rx=\"7\" fill=\"#E6F7F2\" stroke=\"#0D7C5A\" stroke-width=\"1.4\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"1063\" y=\"83\" text-anchor=\"middle\" class=\"ok\"\u003e✓  push aceptado\u003c/text\u003e\n\n  \u003c!-- NO → rechazo --\u003e\n  \u003crect x=\"966\" y=\"112\" width=\"194\" height=\"40\" rx=\"7\" fill=\"#FFF5F5\" stroke=\"#B91C1C\" stroke-width=\"1.4\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"1063\" y=\"137\" text-anchor=\"middle\" class=\"bad\"\u003e✗  stale info — rechazado\u003c CIONAR\u003c/text\u003e\n  \u003ctext x=\"438\" y=\"332\" class=\"sub\" font-size=\"10.5\"\u003eFetch refresca el lease → ya no detecta el cambio.\u003c/text\u003e\n  \u003ctext x=\"438\" y=\"348\" class=\"sub\" font-size=\"10.5\"\u003eInspecciona siempre, o ancla: \u003ctspan class=\"mono\"\u003e--force-with-lease=master:\u0026lt;sha\u0026gt;\u003c/tspan\u003e\u003c/text\u003e\n\n  \u003c!-- Chip 3 --\u003e\n  \u003crect x=\"800\" y=\"294\" width=\"360\" height=\"52\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.4\"/\u003e\n  \u003ctext x=\"818\" y=\"314\" font-size=\"10\" font-weight=\"700\" fill=\"#0D7C5A\"\u003e③ OPCIÓN MÁS SEGURA (git moderno)\u003c/text\u003e\n  \u003ctext x=\"818\" y=\"332\" class=\"sub\" font-size=\"10.5\"\u003e\u003ctspan class=\"mono\"\u003e--force-with-lease --force-if-includes\u003c/tspan\u003e\u003c/text\u003e\n  \u003ctext x=\"818\" y=\"348\" class=\"sub\" font-size=\"10.5\"\u003eVerifica que tu historial contiene los commits remotos.\u003c/text\u003e\n\n  \u003c!-- ===== CASO REAL DEL REPO ===== --\u003e\n  \u003crect x=\"40\" y=\"360\" width=\"554\" height=\"88\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#2E6B9E\" stroke-width=\"1.3\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"58\" y=\"380\" class=\"role\" fill=\"#2E6B9E\"\u003eCASO REAL — push-prompt-log.ps1 · un commit por día\u003c/text\u003e\n  \u003ctext x=\"58\" y=\"400\" class=\"mono\" font-size=\"10.5\" fill=\"#1E3A5F\"\u003eif ($head -eq $msg) {\u003c/text\u003e\n  \u003ctext x=\"58\" y=\"416\" class=\"mono\" font-size=\"10.5\" fill=\"#1E3A5F\"\u003e    git commit --amend --no-edit  →  git push --force-with-lease\u003c/text\u003e\n  \u003ctext x=\"58\" y=\"432\" class=\"mono\" font-size=\"10.5\" fill=\"#6B6B6B\"\u003e} else { git commit -m $msg  →  git push  }\u003c/text\u003e\n  \u003ctext x=\"58\" y=\"446\" class=\"sub\"\u003eSesiones paralelas + evaluador nocturno compiten en master — el lease protege a todos.\u003c/text\u003e\n\n  \u003c!-- ===== RECETA MANUAL ===== --\u003e\n  \u003crect x=\"606\" y=\"360\" width=\"554\" height=\"88\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\" stroke-width=\"1.3\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"624\" y=\"380\" class=\"role\" fill=\"#9B9B9B\"\u003eRECETA — tras enmendar un commit publicado\u003c/text\u003e\n  \u003ctext x=\"624\" y=\"400\" class=\"mono\" font-size=\"10.5\" fill=\"#1E3A5F\"\u003egit fetch origin\u003c/text\u003e\n  \u003ctext x=\"624\" y=\"416\" class=\"mono\" font-size=\"10.5\" fill=\"#6B6B6B\"\u003egit log --oneline HEAD..origin/master   # ← debe estar VACÍO\u003c/text\u003e\n  \u003ctext x=\"624\" y=\"432\" class=\"mono\" font-size=\"10.5\" fill=\"#0A5C43\"\u003egit push --force-with-lease\u003c/text\u003e\n  \u003ctext x=\"624\" y=\"448\" class=\"sub\"\u003eSi no está vacío: \u003ctspan class=\"mono\"\u003egit pull --rebase\u003c/tspan\u003e → \u003ctspan class=\"mono\"\u003egit push --force-with-lease\u003c/tspan\u003e\u003c/text\u003e\n\n  \u003c!-- ===== CHULETA ===== --\u003e\n  \u003crect x=\"40\" y=\"462\" width=\"1120\" height=\"104\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\"/\u003e\n  \u003ctext x=\"58\" y=\"482\" class=\"role\" fill=\"#9B9B9B\"\u003eCHULETA — comandos\u003c/text\u003e\n  \u003c!-- col izq --\u003e\n  \u003ctext x=\"58\"  y=\"504\" class=\"mono cmd\"\u003egit push\u003c/text\u003e\n  \u003ctext x=\"290\" y=\"504\" class=\"lbl\"\u003epush normal (fast-forward, sin reescritura)\u003c/text\u003e\n  \u003ctext x=\"58\"  y=\"524\" class=\"mono cmd\"\u003egit push --force-with-lease\u003c/text\u003e\n  \u003ctext x=\"290\" y=\"524\" class=\"lbl\"\u003eenmendaste / rebasaste un commit ya publicado\u003c/text\u003e\n  \u003ctext x=\"58\"  y=\"544\" class=\"mono cmd\"\u003egit push --force-with-lease=master:\u0026lt;sha\u0026gt;\u003c/text\u003e\n  \u003ctext x=\"290\" y=\"544\" class=\"lbl\"\u003eanclar el tip remoto esperado (máxima precisión)\u003c/text\u003e\n  \u003c!-- col der --\u003e\n  \u003ctext x=\"630\" y=\"504\" class=\"mono cmd\"\u003egit fetch  →  git rebase  →  --force-with-lease\u003c/text\u003e\n  \u003ctext x=\"970\" y=\"504\" class=\"lbl\"\u003elease rechazado → integra y reintenta\u003c/text\u003e\n  \u003ctext x=\"630\" y=\"524\" class=\"mono cmd\"\u003e--force-with-lease --force-if-includes\u003c/text\u003e\n  \u003ctext x=\"970\" y=\"524\" class=\"lbl\"\u003eopción más segura (git moderno)\u003c/text\u003e\n  \u003ctext x=\"630\" y=\"544\" class=\"mono bad\"\u003egit push --force\u003c/text\u003e\n  \u003ctext x=\"970\" y=\"544\" class=\"bad\"\u003eNUNCA — cero comprobaciones, borra commits\u003c/text\u003e\n  \u003c!-- línea separadora --\u003e\n  \u003cline x1=\"620\" y1=\"462\" x2=\"620\" y2=\"566\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n\n  \u003c!-- ===== LEYENDA ===== --\u003e\n  \u003cg\u003e\n    \u003crect x=\"40\"  y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#2E6B9E\"/\u003e\u003ctext x=\"58\"  y=\"593\" class=\"sub\"\u003etus commits locales\u003c/text\u003e\n    \u003crect x=\"220\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#1E3A5F\"/\u003e\u003ctext x=\"238\" y=\"593\" class=\"sub\"\u003eremoto / lease\u003c/text\u003e\n    \u003crect x=\"380\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#0D7C5A\"/\u003e\u003ctext x=\"398\" y=\"593\" class=\"sub\"\u003epush aceptado (lease ok)\u003c/text\u003e\n    \u003crect x=\"600\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#B91C1C\"/\u003e\u003ctext x=\"618\" y=\"593\" class=\"sub\"\u003epush rechazado / peligro\u003c/text\u003e\n    \u003crect x=\"820\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#C2510A\"/\u003e\u003ctext x=\"838\" y=\"593\" class=\"sub\"\u003eregla / gotcha\u003c/text\u003e\n  \u003c/g\u003e\n\n  \u003c!-- FOOTER --\u003e\n  \u003ctext x=\"600\" y=\"622\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\"\u003eTutorial git push --force-with-lease · reescritura segura de historia publicada · paleta COIIAOC (tipografía V2) · 2026-06-22\u003c/text\u003e\n\u003c/svg\u003e\n"},{"id":"04","type":"CHEATSHEET","slug":"latex-overleaf-ficheros","title":"Cheatsheet · LaTeX y Overleaf: mapa de ficheros, compilación y Git","summary":"Guía de referencia rápida para identificar los ficheros de un documento LaTeX/Overleaf: qué se edita, qué se genera solo, cómo funciona el ciclo de compilación de 3 pasadas y qué versionar en Git.","mdFilename":"04-CHEATSHEET-latex-overleaf-ficheros.md","svgFilename":"04-CHEATSHEET-latex-overleaf-ficheros.svg","hasSvg":true,"tags":["cheatsheet","latex","overleaf","ficheros","git"],"contentMarkdown":"# Cheatsheet · LaTeX y Overleaf: mapa de ficheros, compilación y Git\n\n\u003e Guía de referencia rápida para identificar los ficheros de un documento LaTeX/Overleaf: qué se edita, qué se genera solo, cómo funciona el ciclo de compilación de 3 pasadas y qué versionar en Git.\n\n---\n\n## Idea rectora\n\n**LaTeX** es un lenguaje de composición: texto + comandos en un `.tex` que un compilador convierte en `.pdf`. **Overleaf** es su entorno en navegador que compila automáticamente en segundo plano. En Git y en el flujo de trabajo: **versiona y sube únicamente las fuentes (`.tex`, `.bib`, figuras); ignora siempre los ficheros intermedios (`.aux`, `.log`, `.bbl`...)**.\n\n---\n\n## 1. Mapa de ficheros: fuente vs. intermedios\n\n### Ficheros que SÍ importan (fuente + resultado)\n\n| Fichero | Qué es | ¿Se edita? | ¿Se sube a Overleaf? | ¿En Git? |\n|---|---|---|---|---|\n| `main.tex` | **El documento/paper:** Texto y comandos. | ✅ Sí (o se genera de `.md`) | ✅ Sí (indispensable) | ✅ Sí |\n| `references.bib` | **Bibliografía:** Entradas BibTeX por cita. | ✅ Sí (al añadir citas) | ✅ Sí | ✅ Sí |\n| `template.tex` / `.cls` / `.sty` | **Plantilla / estilo:** Preámbulo y macros. | ⚠️ Rara vez | ✅ Sí | ✅ Sí |\n| `figures/` | **Activos visuales:** Imágenes, gráficas. | ⚠️ Al actualizar figuras | ✅ Sí | ✅ Sí |\n| `main.pdf` | **Resultado final:** Documento generado. | ❌ No (se autogenera) | ❌ No (Overleaf lo crea) | ⚠️ Opcional |\n\n### Ficheros intermedios (generados automáticamente — NO tocar)\n\n| Extensión | Nombre | Función en el compilador |\n|---|---|---|\n| `.aux` | **Auxiliar** | Almacena etiquetas (`\\label`), números de tabla/figura y citas entre pasadas de compilación. |\n| `.log` | **Registro** | Transcripción de avisos, warnings y errores de compilación (`undefined control sequence`, etc.). |\n| `.out` | **Bookmarks** | Hipervínculos e índice de navegación generado por el paquete `hyperref`. |\n| `.bbl` | **Bibliografía formateada** | Puente generado por BibTeX a partir de `references.bib` y `.aux` listo para incrustar. |\n| `.blg` | **Log de BibTeX** | Errores y diagnósticos específicos de procesamiento bibliográfico. |\n| `.toc` / `.lot` / `.lof` | **Sumarios** | Tablas de contenido, listas de tablas y listas de figuras. |\n\n---\n\n## 2. El ciclo de compilación: por qué se compila 3 veces (+ bibtex)\n\nCuando compilas en local, las referencias cruzadas y la bibliografía no pueden resolverse en una sola pasada:\n\n```\n[1ª Pasada: pdflatex] ─▶ Escribe .aux (etiquetas/citas como \u0027??\u0027)\n         │\n         ▼\n[2ª Pasada: bibtex]   ─▶ Lee .aux + references.bib ─▶ Genera .bbl\n         │\n         ▼\n[3ª Pasada: pdflatex] ─▶ Incrusta .bbl y resuelve referencias cruzadas\n         │\n         ▼\n[4ª Pasada: pdflatex] ─▶ Cuadra numeración definitiva y saltos de página ─▶ PDF final\n```\n\n\u003e **En Overleaf:** Todo este ciclo ocurre de forma automática al pulsar *Recompile*. Los ficheros `.aux`, `.bbl` y `.log` se generan en servidores internos y permanecen ocultos.\n\n---\n\n## 3. Reglas de oro numeradas\n\n1. **① Versiona la fuente pura:** En Git solo viven `.tex`, `.bib`, estilos (`.sty`/`.cls`) y la carpeta de figuras.\n2. **② El `.aux` es el árbitro:** Si una referencia (`\\ref`) o cita (`\\cite`) aparece rota con `??`, el problema está en la sincronización del `.aux` o en la falta de una pasada de compilación.\n3. **③ Overleaf solo necesita insumos:** No exportes ni subas ficheros auxiliares a Overleaf; deja que el motor de Overleaf los regenere limpios en cada build.\n\n---\n\n## 4. Chuleta `.gitignore` recomendada\n\nAñade este bloque al `.gitignore` en la raíz del documento:\n\n```gitignore\n# LaTeX - Ficheros intermedios generados (nunca versionar)\n*.aux\n*.log\n*.out\n*.bbl\n*.blg\n*.toc\n*.lot\n*.lof\n*.synctex.gz\n*.fls\n*.fdb_latexmk\n```\n","contentSvg":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"620\" viewBox=\"0 0 1200 620\"\u003e\n  \u003cdefs\u003e\n    \u003cmarker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aOrange\" markerWidth=\"11\" markerHeight=\"9\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 10 3.5, 0 7\" fill=\"#C2510A\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aGreen\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#0D7C5A\"/\u003e\u003c/marker\u003e\n    \u003cfilter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"\u003e\u003cfeDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.08)\"/\u003e\u003c/filter\u003e\n    \u003cstyle\u003e\n      text{font-family:\u0027Segoe UI\u0027, Arial, sans-serif}\n      .mono{font-family:Consolas,\u0027Courier New\u0027,monospace}\n      .role{font-size:10.5px;letter-spacing:.1em;font-weight:700}\n      .bt{font-size:13px;font-weight:700;fill:#1E3A5F}\n      .sub{font-size:10px;fill:#6B6B6B}\n      .cmd{font-size:11.5px;font-weight:700;fill:#1E3A5F}\n      .lbl{font-size:10.5px;fill:#6B6B6B}\n    \u003c/style\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- BACKGROUND --\u003e\n  \u003crect width=\"1200\" height=\"620\" fill=\"#F5F2EC\"/\u003e\n\n  \u003c!-- HEADER --\u003e\n  \u003crect x=\"0\" y=\"0\" width=\"1200\" height=\"58\" fill=\"#1E3A5F\"/\u003e\n  \u003crect x=\"0\" y=\"0\" width=\"6\" height=\"58\" fill=\"#FF8C3B\"/\u003e\n  \u003ctext x=\"600\" y=\"25\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"#FFFFFF\"\u003eLaTeX y Overleaf — mapa de ficheros, ciclo de compilación y Git\u003c/text\u003e\n  \u003ctext x=\"600\" y=\"45\" text-anchor=\"middle\" font-size=\"10.5\" letter-spacing=\".04em\" fill=\"#9AB0C8\"\u003eversiona sólo la \u003ctspan fill=\"#0D7C5A\" font-weight=\"700\"\u003efuente (.tex, .bib)\u003c/tspan\u003e · los \u003ctspan fill=\"#C2510A\" font-weight=\"700\"\u003eintermedios (.aux, .bbl)\u003c/tspan\u003e son basura regenerable\u003c/text\u003e\n\n  \u003c!-- PANEL 1: FUENTES (SÍ VERSIONAR) --\u003e\n  \u003crect x=\"30\" y=\"74\" width=\"340\" height=\"230\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.8\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"30\" y=\"74\" width=\"340\" height=\"28\" rx=\"8\" fill=\"#E7F1EC\"/\u003e\n  \u003ctext x=\"45\" y=\"93\" class=\"role\" fill=\"#0A5C43\"\u003e✔ FUENTES REALES (SÍ GIT / SÍ OVERLEAF)\u003c/text\u003e\n  \n  \u003ctext x=\"45\" y=\"125\" class=\"mono cmd\" fill=\"#0D7C5A\"\u003emain.tex\u003c/text\u003e\n  \u003ctext x=\"140\" y=\"125\" class=\"lbl\"\u003eTexto + comandos. La fuente viva.\u003c/text\u003e\n  \n  \u003ctext x=\"45\" y=\"155\" class=\"mono cmd\" fill=\"#0D7C5A\"\u003ereferences.bib\u003c/text\u003e\n  \u003ctext x=\"140\" y=\"155\" class=\"lbl\"\u003eBase de datos de citas BibTeX.\u003c/text\u003e\n  \n  \u003ctext x=\"45\" y=\"185\" class=\"mono cmd\" fill=\"#0D7C5A\"\u003etemplate.tex\u003c/text\u003e\n  \u003ctext x=\"140\" y=\"185\" class=\"lbl\"\u003ePreámbulo, paquetes y layout.\u003c/text\u003e\n  \n  \u003ctext x=\"45\" y=\"215\" class=\"mono cmd\" fill=\"#0D7C5A\"\u003efigures/*\u003c/text\u003e\n  \u003ctext x=\"140\" y=\"215\" class=\"lbl\"\u003eDiagramas, gráficas y activos PNG/PDF.\u003c/text\u003e\n  \n  \u003cline x1=\"45\" y1=\"235\" x2=\"355\" y2=\"235\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"45\" y=\"258\" class=\"mono cmd\" fill=\"#1E3A5F\"\u003emain.pdf\u003c/text\u003e\n  \u003ctext x=\"140\" y=\"258\" class=\"lbl\" fill=\"#2E6B9E\"\u003eEntregable final (Overleaf lo compila).\u003c/text\u003e\n  \u003ctext x=\"45\" y=\"285\" class=\"sub\" font-style=\"italic\"\u003eTodo lo que no esté en esta lista es generado automáticamente.\u003c/text\u003e\n\n  \u003c!-- PANEL 2: INTERMEDIOS (IGNORAR EN GIT) --\u003e\n  \u003crect x=\"390\" y=\"74\" width=\"360\" height=\"230\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.8\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"390\" y=\"74\" width=\"360\" height=\"28\" rx=\"8\" fill=\"#FFF7ED\"/\u003e\n  \u003ctext x=\"405\" y=\"93\" class=\"role\" fill=\"#7C2D12\"\u003e✖ INTERMEDIOS DE PASADA (NO GIT / NO EDITAR)\u003c/text\u003e\n  \n  \u003ctext x=\"405\" y=\"123\" class=\"mono cmd\" fill=\"#C2510A\"\u003e.aux\u003c/text\u003e\n  \u003ctext x=\"460\" y=\"123\" class=\"lbl\"\u003eMemoria intermedia (\\label, \\ref, citas).\u003c/text\u003e\n  \n  \u003ctext x=\"405\" y=\"151\" class=\"mono cmd\" fill=\"#C2510A\"\u003e.log\u003c/text\u003e\n  \u003ctext x=\"460\" y=\"151\" class=\"lbl\"\u003eRegistro completo de warnings y errores.\u003c/text\u003e\n  \n  \u003ctext x=\"405\" y=\"179\" class=\"mono cmd\" fill=\"#C2510A\"\u003e.bbl\u003c/text\u003e\n  \u003ctext x=\"460\" y=\"179\" class=\"lbl\"\u003eBibliografía precompilada (puente BibTeX).\u003c/text\u003e\n\n  \u003ctext x=\"405\" y=\"207\" class=\"mono cmd\" fill=\"#C2510A\"\u003e.out\u003c/text\u003e\n  \u003ctext x=\"460\" y=\"207\" class=\"lbl\"\u003eBookmarks y destinos de hipervínculos.\u003c/text\u003e\n  \n  \u003ctext x=\"405\" y=\"235\" class=\"mono cmd\" fill=\"#C2510A\"\u003e.blg\u003c/text\u003e\n  \u003ctext x=\"460\" y=\"235\" class=\"lbl\"\u003eLog del procesador BibTeX.\u003c/text\u003e\n\n  \u003cline x1=\"405\" y1=\"250\" x2=\"735\" y2=\"250\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"405\" y=\"272\" class=\"sub\" fill=\"#B91C1C\" font-weight=\"700\"\u003e¡Son efímeros! Nunca los subas a Overleaf ni a tu repo.\u003c/text\u003e\n  \u003ctext x=\"405\" y=\"290\" class=\"sub\"\u003eOverleaf los genera dentro de un contenedor en cada clic en Recompile.\u003c/text\u003e\n\n  \u003c!-- PANEL 3: PIPELINE DE 3 PASADAS --\u003e\n  \u003crect x=\"30\" y=\"320\" width=\"720\" height=\"150\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"45\" y=\"342\" class=\"bt\"\u003eCiclo de compilación local: ¿por qué compilar 3 veces (+ bibtex)?\u003c/text\u003e\n  \n  \u003c!-- Step 1 --\u003e\n  \u003crect x=\"45\" y=\"358\" width=\"135\" height=\"48\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"112\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\"\u003e1. pdflatex\u003c/text\u003e\n  \u003ctext x=\"112\" y=\"394\" text-anchor=\"middle\" class=\"sub\"\u003eEscribe .aux (citas \u0027??\u0027)\u003c/text\u003e\n\n  \u003cline x1=\"180\" y1=\"382\" x2=\"215\" y2=\"382\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 2 --\u003e\n  \u003crect x=\"220\" y=\"358\" width=\"135\" height=\"48\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#C2510A\"/\u003e\n  \u003ctext x=\"287\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#7C2D12\"\u003e2. bibtex\u003c/text\u003e\n  \u003ctext x=\"287\" y=\"394\" text-anchor=\"middle\" class=\"sub\"\u003eLee .aux + .bib → .bbl\u003c/text\u003e\n\n  \u003cline x1=\"355\" y1=\"382\" x2=\"390\" y2=\"382\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 3 --\u003e\n  \u003crect x=\"395\" y=\"358\" width=\"145\" height=\"48\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"467\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\"\u003e3. pdflatex (2ª)\u003c/text\u003e\n  \u003ctext x=\"467\" y=\"394\" text-anchor=\"middle\" class=\"sub\"\u003eIncrusta .bbl y resuelve\u003c/text\u003e\n\n  \u003cline x1=\"540\" y1=\"382\" x2=\"575\" y2=\"382\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 4 --\u003e\n  \u003crect x=\"580\" y=\"358\" width=\"150\" height=\"48\" rx=\"6\" fill=\"#E7F1EC\" stroke=\"#0D7C5A\" stroke-width=\"1.6\"/\u003e\n  \u003ctext x=\"655\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#0A5C43\"\u003e4. pdflatex (3ª) ✓\u003c/text\u003e\n  \u003ctext x=\"655\" y=\"394\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\"\u003eCuadra refs y emite PDF\u003c/text\u003e\n\n  \u003ctext x=\"45\" y=\"435\" class=\"sub\" font-size=\"10\" fill=\"#6B6B6B\"\u003eEn \u003ctspan font-weight=\"700\" fill=\"#1E3A5F\"\u003eOverleaf\u003c/tspan\u003e, este proceso de 4 pasos es ejecutado en memoria automáticamente con un solo clic en \u003ctspan font-weight=\"700\" fill=\"#C2510A\"\u003eRecompile\u003c/tspan\u003e.\u003c/text\u003e\n  \u003ctext x=\"45\" y=\"452\" class=\"sub\" font-size=\"10\" fill=\"#6B6B6B\"\u003eSi ves \u003ctspan class=\"mono\" font-weight=\"700\" fill=\"#B91C1C\"\u003e??\u003c/tspan\u003e en tus citas o referencias, falta una pasada adicional o el fichero \u003ctspan class=\"mono\"\u003e.aux\u003c/tspan\u003e está desfasado.\u003c/text\u003e\n\n  \u003c!-- PANEL 4: CHULETA .GITIGNORE Y REGLAS --\u003e\n  \u003crect x=\"770\" y=\"74\" width=\"400\" height=\"396\" rx=\"8\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"770\" y=\"74\" width=\"400\" height=\"28\" rx=\"8\" fill=\"#1E3A5F\"/\u003e\n  \u003ctext x=\"785\" y=\"93\" class=\"role\" fill=\"#FFFFFF\"\u003eCONFIGURACIÓN .GITIGNORE RECOMENDADA\u003c/text\u003e\n\n  \u003crect x=\"785\" y=\"112\" width=\"370\" height=\"150\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\"/\u003e\n  \u003ctext x=\"800\" y=\"132\" class=\"mono\" font-size=\"10.5\" fill=\"#6B6B6B\"\u003e# Intermedios LaTeX (regenerables)\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"148\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\"\u003e*.aux *.log *.out\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"164\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\"\u003e*.bbl *.blg\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"180\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\"\u003e*.toc *.lot *.lof\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"196\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\"\u003e*.synctex.gz\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"212\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\"\u003e*.fls *.fdb_latexmk\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"235\" class=\"mono\" font-size=\"10.5\" fill=\"#0D7C5A\"\u003e# SÍ versionar: *.tex *.bib figures/\u003c/text\u003e\n  \u003ctext x=\"800\" y=\"251\" class=\"mono\" font-size=\"10.5\" fill=\"#2E6B9E\"\u003e# Opcional: *.pdf (entregable final)\u003c/text\u003e\n\n  \u003c!-- CHIPS DE REGLAS ①②③ --\u003e\n  \u003crect x=\"785\" y=\"274\" width=\"370\" height=\"42\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"795\" y=\"292\" font-size=\"11\" font-weight=\"700\" fill=\"#0A5C43\"\u003e① Versiona solo la fuente\u003c/text\u003e\n  \u003ctext x=\"795\" y=\"307\" class=\"sub\"\u003eGit almacena .tex, .bib y assets; nunca subas archivos .aux ni .log.\u003c/text\u003e\n\n  \u003crect x=\"785\" y=\"324\" width=\"370\" height=\"42\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"795\" y=\"342\" font-size=\"11\" font-weight=\"700\" fill=\"#7C2D12\"\u003e② El .aux es la memoria entre pasadas\u003c/text\u003e\n  \u003ctext x=\"795\" y=\"357\" class=\"sub\"\u003eAlmacena referencias cruzadas. Si ves \u0027??\u0027, borra el .aux o recompila.\u003c/text\u003e\n\n  \u003crect x=\"785\" y=\"374\" width=\"370\" height=\"42\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#2E6B9E\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"795\" y=\"392\" font-size=\"11\" font-weight=\"700\" fill=\"#1E3A5F\"\u003e③ Overleaf es independiente de tu Git\u003c/text\u003e\n  \u003ctext x=\"795\" y=\"407\" class=\"sub\"\u003eSube solo .tex y .bib. Overleaf compila en la nube sin requerir auxiliares.\u003c/text\u003e\n\n  \u003crect x=\"785\" y=\"424\" width=\"370\" height=\"34\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#B91C1C\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"795\" y=\"444\" font-size=\"10.5\" font-weight=\"700\" fill=\"#B91C1C\"\u003e⚠ Advertencia: \u003ctspan font-weight=\"normal\" fill=\"#6B6B6B\"\u003eNo edites nunca a mano ficheros .bbl ni .aux.\u003c/tspan\u003e\u003c/text\u003e\n\n  \u003c!-- FOOTER Y LEYENDA --\u003e\n  \u003c!-- Leyenda --\u003e\n  \u003crect x=\"30\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0D7C5A\"/\u003e\n  \u003ctext x=\"50\" y=\"511\" class=\"lbl\" font-weight=\"700\"\u003eFuente pura (.tex / .bib)\u003c/text\u003e\n\n  \u003crect x=\"230\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#C2510A\"/\u003e\n  \u003ctext x=\"250\" y=\"511\" class=\"lbl\" font-weight=\"700\"\u003eIntermedios efímeros (.aux / .bbl)\u003c/text\u003e\n\n  \u003crect x=\"470\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"490\" y=\"511\" class=\"lbl\" font-weight=\"700\"\u003ePipeline / Compilador\u003c/text\u003e\n\n  \u003crect x=\"670\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#B91C1C\"/\u003e\n  \u003ctext x=\"690\" y=\"511\" class=\"lbl\" font-weight=\"700\"\u003eExclusión en .gitignore\u003c/text\u003e\n\n  \u003c!-- Línea divisoria y pie de página --\u003e\n  \u003cline x1=\"30\" y1=\"535\" x2=\"1170\" y2=\"535\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"600\" y=\"555\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\"\u003eLaTeX y Overleaf: gestión de ficheros y compilación · core-human-knowledge · paleta COIIAOC (tipografía V2) · 2026-09-10\u003c/text\u003e\n\u003c/svg\u003e\n"},{"id":"05","type":"CHEATSHEET","slug":"spec-kit","title":"Cheatsheet · Spec-Kit (GitHub): Spec-Driven Development (SDD)","summary":"Guía de referencia rápida del ciclo de vida de **Spec-Kit**: el framework de *Spec-Driven Development* (SDD) de GitHub que convierte especificaciones en ejecutables mediante pipelines de IA deterministas, erradicando el \"vibe coding\".","mdFilename":"05-CHEATSHEET-spec-kit.md","svgFilename":"05-CHEATSHEET-spec-kit.svg","hasSvg":true,"tags":["cheatsheet","spec","kit","git","spec-kit","sdd"],"contentMarkdown":"# Cheatsheet · Spec-Kit (GitHub): Spec-Driven Development (SDD)\n\n\u003e Guía de referencia rápida del ciclo de vida de **Spec-Kit**: el framework de *Spec-Driven Development* (SDD) de GitHub que convierte especificaciones en ejecutables mediante pipelines de IA deterministas, erradicando el \"vibe coding\".\n\n---\n\n## Idea rectora\n\n**Spec-Driven Development (SDD):** Las especificaciones dejan de ser documentación estática para convertirse en artefactos estructurados y ejecutables. El ciclo de vida garantiza que ninguna línea de código se escriba sin haber validado previamente la pirámide determinista: **Constitución (`constitution.md`) ➔ Especificación (`spec.md`) ➔ Plan técnico (`plan.md`) ➔ Tareas ordenadas (`tasks.md`) ➔ Auditoría cruzada (`analyze`) ➔ Implementación (`implement`)**.\n\n---\n\n## 1. El ciclo de vida de Spec-Kit paso a paso\n\n```\n[0. init / check] ────▶ [1. constitution] ────▶ [2. specify] ────▶ [3. clarify]\n  Configuración           Reglas globales         spec.md           Reduce dudas\n                                                                         │\n[6. implement] ◀───── [5. analyze] ◀────── [4. tasks] ◀────── [3b. plan] ┘\n  Genera código         Auditoría cruzada     tasks.md          plan.md + data-model\n```\n\n| Fase | Comando / Slash | Insumo | Artefacto resultante | Propósito principal |\n|---|---|---|---|---|\n| **0. Setup** | `specify init . --integration [model]` | Entorno local | `.specify/` | Inicializa el workspace e integraciones CLI. |\n| **1. Constitución** | `/speckit-constitution [prompt]` | Principios y políticas | `.specify/memory/constitution.md` | Fija arquitectura, estándares de API, seguridad y calidad. |\n| **2. Especificar** | `/speckit-specify [descripción]` | Requisitos en lenguaje natural | `specs/NNN-\u003cnombre\u003e/spec.md` | Define casos de uso, requisitos funcionales y criterios de éxito sin tecnología. |\n| **3. Clarificar** | `/speckit-clarify` | `spec.md` activo | `spec.md` (resuelto) | Lanza hasta 5 preguntas para eliminar lagunas y decisiones ambiguas. |\n| **4. Planificar** | `/speckit-plan [detalles técnicos]` | `spec.md` + tech stack | `plan.md`, `data-model.md`, `contracts/` | Fija arquitectura técnica, modelos de datos, endpoints y pruebas. |\n| **5. Tareas** | `/speckit-tasks` | `spec.md` + `plan.md` | `specs/NNN-\u003cnombre\u003e/tasks.md` | Desglosa la implementación en subtareas atómicas y ordenadas por dependencia. |\n| **6. Auditar** | `/speckit-analyze` | Trilogía spec + plan + tasks | Informe de inconsistencias | Análisis *read-only* de coherencia entre los tres documentos clave. |\n| **7. Implementar** | `/speckit-implement` | `tasks.md` validado | Código fuente + tests | Ejecuta la generación de código y validación automatizada tarea a tarea. |\n\n---\n\n## 2. Anatomía de una Feature (`specs/NNN-feature/`)\n\nCada funcionalidad se aísla en su propio directorio numerado consecutivamente:\n\n```\nspecs/003-user-auth/\n├── spec.md                  # Especificación funcional pura (agnóstica de tech)\n├── plan.md                  # Arquitectura técnica, dependencias y fases\n├── research.md              # Alternativas consideradas y justificaciones\n├── data-model.md            # Entidades, esquemas, tipos y validaciones\n├── quickstart.md            # Escenarios de prueba e integración guiada\n├── tasks.md                 # Lista ordenada de tareas atómicas\n└── contracts/               # Contratos OpenAPI, GraphQL o CLI\n    └── api-contracts.json\n```\n\n---\n\n## 3. Reglas de oro numeradas\n\n1. **① La especificación es agnóstica de implementación:** En `/speckit-specify`, prohíbe mencionar frameworks, bases de datos o sintaxis concreta; define solo el *qué*, no el *cómo*.\n2. **② Validación de constitución obligatoria:** Cada `/speckit-plan` realiza un *Constitution Check*; si viola un principio de `constitution.md`, la fase no avanza.\n3. **③ Jamás implementes sin `/speckit-analyze` limpio:** El comando de análisis cruzado es la última barrera para detectar discrepancias entre contratos, entidades y tareas antes de codificar.\n\n---\n\n## 4. Chuleta de comandos rápidos\n\n```bash\n# 1. Instalación de la CLI mediante uv\nuv tool install specify-cli --from git+https://github.com/github/spec-kit.git@vX.Y.Z\nspecify check\n\n# 2. Inicialización en el proyecto\nspecify init . --integration claude    # O antigravity / copilot\n\n# 3. Pipeline guiado por el agente\n/speckit-constitution [principios del proyecto]\n/speckit-specify [descripción del caso de negocio]\n/speckit-clarify\n/speckit-plan [especificaciones del stack y endpoints]\n/speckit-tasks\n/speckit-analyze\n/speckit-implement\n```\n","contentSvg":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"630\" viewBox=\"0 0 1200 630\"\u003e\n  \u003cdefs\u003e\n    \u003cmarker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aOrange\" markerWidth=\"11\" markerHeight=\"9\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 10 3.5, 0 7\" fill=\"#C2510A\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aGreen\" markerW
