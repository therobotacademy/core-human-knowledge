--\u003e\n  \u003crect x=\"40\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#1E3A5F\" stroke-width=\"1.4\"/\u003e\n  \u003ctext x=\"109\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\"\u003e/speckit-constitution\u003c/text\u003e\n  \u003ctext x=\"109\" y=\"141\" text-anchor=\"middle\" class=\"sub\"\u003eReglas del proyecto\u003c/text\u003e\n  \u003ctext x=\"109\" y=\"153\" text-anchor=\"middle\" class=\"mono\" font-size=\"9\" fill=\"#2E6B9E\"\u003econstitution.md\u003c/text\u003e\n\n  \u003cline x1=\"178\" y1=\"134\" x2=\"202\" y2=\"134\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 2: Specify --\u003e\n  \u003crect x=\"204\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"273\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\"\u003e/speckit-specify\u003c/text\u003e\n  \u003ctext x=\"273\" y=\"141\" text-anchor=\"middle\" class=\"sub\"\u003eRequisitos funcionales\u003c/text\u003e\n  \u003ctext x=\"273\" y=\"153\" text-anchor=\"middle\" class=\"mono\" font-size=\"9\" fill=\"#2E6B9E\"\u003espec.md\u003c/text\u003e\n\n  \u003cline x1=\"342\" y1=\"134\" x2=\"366\" y2=\"134\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 3: Clarify --\u003e\n  \u003crect x=\"368\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#C2510A\"/\u003e\n  \u003ctext x=\"437\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#7C2D12\"\u003e/speckit-clarify\u003c/text\u003e\n  \u003ctext x=\"437\" y=\"141\" text-anchor=\"middle\" class=\"sub\"\u003eMáx. 5 preguntas\u003c/text\u003e\n  \u003ctext x=\"437\" y=\"153\" text-anchor=\"middle\" class=\"sub\" fill=\"#C2510A\"\u003eResuelve dudas\u003c/text\u003e\n\n  \u003cline x1=\"506\" y1=\"134\" x2=\"530\" y2=\"134\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 4: Plan --\u003e\n  \u003crect x=\"532\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"601\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\"\u003e/speckit-plan\u003c/text\u003e\n  \u003ctext x=\"601\" y=\"141\" text-anchor=\"middle\" class=\"sub\"\u003eStack \u0026amp; arquitectura\u003c/text\u003e\n  \u003ctext x=\"601\" y=\"153\" text-anchor=\"middle\" class=\"mono\" font-size=\"9\" fill=\"#2E6B9E\"\u003eplan.md + models\u003c/text\u003e\n\n  \u003cline x1=\"670\" y1=\"134\" x2=\"694\" y2=\"134\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 5: Tasks --\u003e\n  \u003crect x=\"696\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"765\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\"\u003e/speckit-tasks\u003c/text\u003e\n  \u003ctext x=\"765\" y=\"141\" text-anchor=\"middle\" class=\"sub\"\u003eDesglose atómico\u003c/text\u003e\n  \u003ctext x=\"765\" y=\"153\" text-anchor=\"middle\" class=\"mono\" font-size=\"9\" fill=\"#2E6B9E\"\u003etasks.md\u003c/text\u003e\n\n  \u003cline x1=\"834\" y1=\"134\" x2=\"858\" y2=\"134\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/\u003e\n\n  \u003c!-- Step 6: Analyze --\u003e\n  \u003crect x=\"860\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#FFF7ED\" stroke=\"#C2510A\" stroke-width=\"1.6\"/\u003e\n  \u003ctext x=\"929\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#7C2D12\"\u003e/speckit-analyze\u003c/text\u003e\n  \u003ctext x=\"929\" y=\"141\" text-anchor=\"middle\" class=\"sub\"\u003eAuditoría cruzada\u003c/text\u003e\n  \u003ctext x=\"929\" y=\"153\" text-anchor=\"middle\" class=\"sub\" font-weight=\"700\" fill=\"#B91C1C\"\u003eRead-only check\u003c/text\u003e\n\n  \u003cline x1=\"998\" y1=\"134\" x2=\"1022\" y2=\"134\" stroke=\"#C2510A\" stroke-width=\"2\" marker-end=\"url(#aOrange)\"/\u003e\n\n  \u003c!-- Step 7: Implement --\u003e\n  \u003crect x=\"1024\" y=\"106\" width=\"138\" height=\"56\" rx=\"6\" fill=\"#E7F1EC\" stroke=\"#0D7C5A\" stroke-width=\"1.8\"/\u003e\n  \u003ctext x=\"1093\" y=\"124\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#0A5C43\"\u003e/speckit-implement\u003c/text\u003e\n  \u003ctext x=\"1093\" y=\"141\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\"\u003eGenera código y test\u003c/text\u003e\n  \u003ctext x=\"1093\" y=\"153\" text-anchor=\"middle\" class=\"sub\" font-weight=\"700\" fill=\"#0D7C5A\"\u003eEjecución final ✓\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"192\" class=\"sub\" font-size=\"9.5\" fill=\"#6B6B6B\"\u003ePrincipio fundamental: \u003ctspan font-weight=\"700\" fill=\"#1E3A5F\"\u003eNingún código se genera\u003c/tspan\u003e sin que el análisis cruzado valide que \u003ctspan class=\"mono\"\u003espec.md\u003c/tspan\u003e, \u003ctspan class=\"mono\"\u003eplan.md\u003c/tspan\u003e y \u003ctspan class=\"mono\"\u003etasks.md\u003c/tspan\u003e coinciden al 100%.\u003c/text\u003e\n\n  \u003c!-- PANEL IZQUIERDO: ANATOMÍA DE specs/NNN-feature --\u003e\n  \u003crect x=\"25\" y=\"224\" width=\"370\" height=\"280\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#2E6B9E\" stroke-width=\"1.5\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"25\" y=\"224\" width=\"370\" height=\"26\" rx=\"8\" fill=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"40\" y=\"241\" class=\"role\" fill=\"#FFFFFF\"\u003eESTRUCTURA DE UNA FEATURE (specs/NNN-*)\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"270\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003espec.md\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"270\" class=\"lbl\"\u003eRequisitos funcionales puros (sin tech).\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"296\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003eplan.md\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"296\" class=\"lbl\"\u003eDecisiones técnicas, stack y fases.\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"322\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003edata-model.md\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"322\" class=\"lbl\"\u003eEntidades, contratos de datos y tipos.\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"348\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003eresearch.md\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"348\" class=\"lbl\"\u003eAlternativas evaluadas y descartadas.\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"374\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003etasks.md\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"374\" class=\"lbl\"\u003eSubtareas ordenadas por dependencia.\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"400\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003econtracts/*\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"400\" class=\"lbl\"\u003eEsquemas JSON, OpenAPI o interfaces.\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"426\" class=\"mono cmd\" font-size=\"11\" fill=\"#1E3A5F\"\u003equickstart.md\u003c/text\u003e\n  \u003ctext x=\"135\" y=\"426\" class=\"lbl\"\u003eCasos de validación e integración.\u003c/text\u003e\n\n  \u003cline x1=\"40\" y1=\"446\" x2=\"375\" y2=\"446\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"40\" y=\"468\" class=\"sub\" fill=\"#0D7C5A\" font-weight=\"700\"\u003eTrazabilidad total: cada test deriva de un requisito en spec.md.\u003c/text\u003e\n  \u003ctext x=\"40\" y=\"486\" class=\"sub\"\u003eLos artefactos son portables e independientes del modelo LLM.\u003c/text\u003e\n\n  \u003c!-- PANEL CENTRAL: CHULETA DE COMANDOS --\u003e\n  \u003crect x=\"415\" y=\"224\" width=\"370\" height=\"280\" rx=\"8\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"415\" y=\"224\" width=\"370\" height=\"26\" rx=\"8\" fill=\"#1E3A5F\"/\u003e\n  \u003ctext x=\"430\" y=\"241\" class=\"role\" fill=\"#FFFFFF\"\u003eCHULETA DE COMANDOS TERMINAL / CLI\u003c/text\u003e\n\n  \u003crect x=\"430\" y=\"260\" width=\"340\" height=\"230\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\"/\u003e\n  \u003ctext x=\"445\" y=\"278\" class=\"mono\" font-size=\"10\" fill=\"#6B6B6B\"\u003e# Instalación CLI (vía uv)\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"293\" class=\"mono\" font-size=\"10\" fill=\"#C2510A\"\u003euv tool install specify-cli\u003c/text\u003e\n  \n  \u003ctext x=\"445\" y=\"316\" class=\"mono\" font-size=\"10\" fill=\"#6B6B6B\"\u003e# Setup inicial del repo\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"331\" class=\"mono\" font-size=\"10\" fill=\"#1E3A5F\"\u003especify init . --integration claude\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"346\" class=\"mono\" font-size=\"10\" fill=\"#1E3A5F\"\u003especify check\u003c/text\u003e\n\n  \u003ctext x=\"445\" y=\"369\" class=\"mono\" font-size=\"10\" fill=\"#6B6B6B\"\u003e# Ciclo guiado con el Agente\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"384\" class=\"mono\" font-size=\"10\" fill=\"#0D7C5A\"\u003e/speckit-constitution [principios]\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"399\" class=\"mono\" font-size=\"10\" fill=\"#0D7C5A\"\u003e/speckit-specify [descripción]\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"414\" class=\"mono\" font-size=\"10\" fill=\"#0D7C5A\"\u003e/speckit-clarify\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"429\" class=\"mono\" font-size=\"10\" fill=\"#0D7C5A\"\u003e/speckit-plan [arquitectura]\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"444\" class=\"mono\" font-size=\"10\" fill=\"#0D7C5A\"\u003e/speckit-tasks\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"459\" class=\"mono\" font-size=\"10\" fill=\"#C2510A\"\u003e/speckit-analyze\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"474\" class=\"mono\" font-size=\"10\" fill=\"#0D7C5A\"\u003e/speckit-implement\u003c/text\u003e\n\n  \u003c!-- PANEL DERECHO: CHIPS DE REGLAS ①②③ --\u003e\n  \u003crect x=\"805\" y=\"224\" width=\"370\" height=\"280\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.5\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"805\" y=\"224\" width=\"370\" height=\"26\" rx=\"8\" fill=\"#0D7C5A\"/\u003e\n  \u003ctext x=\"820\" y=\"241\" class=\"role\" fill=\"#FFFFFF\"\u003eREGLAS DE ORO DE ESPECIFICACIÓN\u003c/text\u003e\n\n  \u003crect x=\"820\" y=\"260\" width=\"340\" height=\"52\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#0D7C5A\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"830\" y=\"278\" font-size=\"11\" font-weight=\"700\" fill=\"#0A5C43\"\u003e① spec.md = qué, nunca cómo\u003c/text\u003e\n  \u003ctext x=\"830\" y=\"293\" class=\"sub\"\u003eDefine casos de uso, valor de negocio y criterios de aceptación sin mencionar librerías ni base de datos.\u003c/text\u003e\n\n  \u003crect x=\"820\" y=\"322\" width=\"340\" height=\"52\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#C2510A\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"830\" y=\"340\" font-size=\"11\" font-weight=\"700\" fill=\"#7C2D12\"\u003e② El plan valida la constitución\u003c/text\u003e\n  \u003ctext x=\"830\" y=\"355\" class=\"sub\"\u003eCada /speckit-plan ejecuta Constitution Check. Las decisiones que violan principios son rechazadas.\u003c/text\u003e\n\n  \u003crect x=\"820\" y=\"384\" width=\"340\" height=\"52\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"830\" y=\"402\" font-size=\"11\" font-weight=\"700\" fill=\"#1E3A5F\"\u003e③ Análisis cruzado antes de codificar\u003c/text\u003e\n  \u003ctext x=\"830\" y=\"417\" class=\"sub\"\u003e/speckit-analyze garantiza consistencia exacta entre spec, plan y tasks antes de invocar la implementación.\u003c/text\u003e\n\n  \u003crect x=\"820\" y=\"446\" width=\"340\" height=\"44\" rx=\"6\" fill=\"#FFF7ED\" stroke=\"#B91C1C\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"830\" y=\"464\" font-size=\"10.5\" font-weight=\"700\" fill=\"#B91C1C\"\u003e⚠ Cero Vibe Coding: \u003ctspan font-weight=\"normal\" fill=\"#6B6B6B\"\u003eNo programes sin checklist de tareas validado.\u003c/tspan\u003e\u003c/text\u003e\n\n  \u003c!-- LEYENDA Y FOOTER --\u003e\n  \u003crect x=\"25\" y=\"525\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#1E3A5F\"/\u003e\n  \u003ctext x=\"45\" y=\"536\" class=\"lbl\" font-weight=\"700\"\u003eConstitución \u0026amp; Setup\u003c/text\u003e\n\n  \u003crect x=\"220\" y=\"525\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"240\" y=\"536\" class=\"lbl\" font-weight=\"700\"\u003eFases de Especificación / Plan\u003c/text\u003e\n\n  \u003crect x=\"460\" y=\"525\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#C2510A\"/\u003e\n  \u003ctext x=\"480\" y=\"536\" class=\"lbl\" font-weight=\"700\"\u003eClarificación \u0026amp; Auditoría\u003c/text\u003e\n\n  \u003crect x=\"680\" y=\"525\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0D7C5A\"/\u003e\n  \u003ctext x=\"700\" y=\"536\" class=\"lbl\" font-weight=\"700\"\u003eImplementación ejecutable\u003c/text\u003e\n\n  \u003cline x1=\"25\" y1=\"560\" x2=\"1175\" y2=\"560\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"600\" y=\"580\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\"\u003eSpec-Kit: Spec-Driven Development · core-human-knowledge · paleta COIIAOC (tipografía V2) · 2026-09-10\u003c/text\u003e\n\u003c/svg\u003e\n"},{"id":"06","type":"TUTORIAL","slug":"superpowers-antigravity","title":"Tutorial · Superpowers en Google Antigravity: instalación, activación y sinergia con Spec-Kit","summary":"Tutorial paso a paso para desplegar e integrar las habilidades de **Superpowers** (Brainstorming, TDD, Systematic Debugging, Code Review, Subagents) en Google Antigravity (IDE, CLI y Desktop) y su combinación con Spec-Kit.","mdFilename":"06-TUTORIAL-superpowers-antigravity.md","svgFilename":"06-TUTORIAL-superpowers-antigravity.svg","hasSvg":true,"tags":["tutorial","superpowers","antigravity","spec-kit","sdd","tdd"],"contentMarkdown":"# Tutorial · Superpowers en Google Antigravity: instalación, activación y sinergia con Spec-Kit\n\n\u003e Tutorial paso a paso para desplegar e integrar las habilidades de **Superpowers** (Brainstorming, TDD, Systematic Debugging, Code Review, Subagents) en Google Antigravity (IDE, CLI y Desktop) y su combinación con Spec-Kit.\n\n---\n\n## Idea rectora\n\n**Superpowers dota de rigor de ingeniería al agente:** Añade protocolos disciplinados (TDD estricto, análisis de causa raíz antes de proponer fixes, revisiones de código de dos pasadas y diseño guiado). Puede instalarse como **plugin global nativo**, mediante **paquetes CLI** o **por workspace local**. En proyectos con Spec-Kit, Superpowers asume el control en la fase de codificación (`/speckit-implement`), garantizando que cada tarea se implemente mediante ciclos Red-Green-Refactor sin atajos.\n\n---\n\n## 1. Métodos de instalación\n\n### Método 1: Plugin nativo global (Recomendado para Antigravity 2.0 e IDE)\n\nClona el repositorio adaptado de Superpowers directamente en la carpeta de plugins globales de Gemini/Antigravity:\n\n```bash\ngit clone https://github.com/roundpilot/superpowers-antigravity ~/.gemini/config/plugins/superpowers\n```\n\n- **Ventaja:** Antigravity carga automáticamente el plugin en cada sesión iniciada; todos los skills quedan disponibles desde el primer turno.\n\n---\n\n### Método 2: Instalación global mediante CLI / Gestor de paquetes\n\nSi utilizas Antigravity CLI (`agy`) o quieres registrar los skills en tu perfil global:\n\n```bash\n# Opción A: Mediante npx skills\nnpx skills add obra/superpowers -A \"claude, agy\"\n\n# Opción B: Mediante gestor Python (uv)\nuvx google-agents-cli setup\n```\n\n\u003e **Nota de compatibilidad en Windows / Antigravity CLI:** Si los skills se instalan por defecto en `~/.agents/skills`, muévelos a `~/.gemini/antigravity-cli/skills` (o regístralos en `settings.json`) para que el CLI global los descubra de inmediato.\n\n---\n\n### Método 3: Configuración manual por Workspace (Ámbito de proyecto)\n\nPara proyectos aislados donde no deseas alterar la configuración global de tu máquina:\n\n1. **Descargar los skills:** Descarga la carpeta `skills/` del repositorio de Superpowers (ej. `brainstorming`, `test-driven-development`, `systematic-debugging`...).\n2. **Copiar a la carpeta local:** Colócalos en la raíz de tu proyecto dentro de:\n   - `.agents/skills/\u003cskill-name\u003e/SKILL.md` (estándar Antigravity) o\n   - `.claude/skills/\u003cskill-name\u003e/SKILL.md` (si tu `AGENTS.md` enruta a `.claude`).\n3. **Activación contextual:** El agente cargará dinámicamente el skill por coincidencia semántica o invocación explícita.\n\n---\n\n## 2. Sinergia estratégica: Spec-Kit + Superpowers\n\nAmbas metodologías no compiten, sino que se complementan en una cadena de valor perfecta:\n\n```\n[Spec-Kit: Fases 1 a 5]\nconstitution ─▶ spec.md ─▶ plan.md ─▶ tasks.md ─▶ analyze\n                                                    │\n                 ┌──────────────────────────────────┘\n                 ▼\n      [Omitir /speckit-implement]\n                 │\n                 ▼\n[Superpowers: Fase de Ejecución]\n  1. using-git-worktrees       (Aislamiento de workspace)\n  2. subagent-driven-dev       (Orquestador de tareas)\n  3. test-driven-development   (Ciclo TDD: Red ➔ Green ➔ Refactor)\n  4. requesting-code-review    (Revisión estricta de código)\n```\n\n\u003e **Regla de oro de integración:** En proyectos que empleen Spec-Kit, tras validar `/speckit-analyze`, **omite** `/speckit-implement` y pide al agente ejecutar las tareas de `tasks.md` utilizando el skill `test-driven-development` y subagentes de Superpowers.\n\n---\n\n## 3. Catálogo de Superpoderes clave y cómo invocarlos\n\n| Superpoder | Cuándo se dispara / Prompt | Efecto disciplinado |\n|---|---|---|\n| **`brainstorming`** | *\"Vamos a diseñar...\", \"Explora opciones para...\"* | Explora alternativas y requisitos antes de redactar código o planes. |\n| **`test-driven-development`** | *\"Implementa la tarea X con TDD\"* | Obliga a escribir el test primero, verle fallar y luego escribir el mínimo código. |\n| **`systematic-debugging`** | *\"Tenemos este bug/error...\"* | Prohíbe soluciones a ciegas; exige aislar la causa raíz con hipótesis verificables. |\n| **`requesting-code-review`** | *\"Revisa este commit/diff\"* | Auditoría de dos pasadas: análisis estático y adherencia a requisitos. |\n| **`using-git-worktrees`** | *\"Arranca una nueva rama/feature\"* | Crea un worktree aislado para no ensuciar la copia principal de trabajo. |\n\n---\n\n## 4. Reglas de oro numeradas\n\n1. **① TDD estricto:** Jamás se genera código productivo sin su test previo que falle por la razón esperada.\n2. **② Depuración con causa raíz:** Si un test o comando falla, el agente debe formular hipótesis y comprobarlas con logs antes de editar código.\n3. **③ Despliegue en capas:** Usa el plugin global `~/.gemini/config/plugins/superpowers` para tus proyectos diarios y el scope de proyecto (`.agents/skills`) cuando requieras versiones personalizadas.\n","contentSvg":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"630\" viewBox=\"0 0 1200 630\"\u003e\n  \u003cdefs\u003e\n    \u003cmarker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aOrange\" markerWidth=\"11\" markerHeight=\"9\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 10 3.5, 0 7\" fill=\"#C2510A\"/\u003e\u003c/marker\u003e\n    \u003cmarker id=\"aGreen\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpolygon points=\"0 0, 9 3.5, 0 7\" fill=\"#0D7C5A\"/\u003e\u003c/marker\u003e\n    \u003cfilter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"\u003e\u003cfeDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.08)\"/\u003e\u003c/filter\u003e\n    \u003cstyle\u003e\n      text{font-family:\u0027Segoe UI\u0027, Arial, sans-serif}\n      .mono{font-family:Consolas,\u0027Courier New\u0027,monospace}\n      .role{font-size:10px;letter-spacing:.1em;font-weight:700}\n      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}\n      .sub{font-size:9.5px;fill:#6B6B6B}\n      .cmd{font-size:11.5px;font-weight:700;fill:#1E3A5F}\n      .lbl{font-size:10.5px;fill:#6B6B6B}\n    \u003c/style\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- BACKGROUND --\u003e\n  \u003crect width=\"1200\" height=\"630\" fill=\"#F5F2EC\"/\u003e\n\n  \u003c!-- HEADER --\u003e\n  \u003crect x=\"0\" y=\"0\" width=\"1200\" height=\"58\" fill=\"#1E3A5F\"/\u003e\n  \u003crect x=\"0\" y=\"0\" width=\"6\" height=\"58\" fill=\"#FF8C3B\"/\u003e\n  \u003ctext x=\"600\" y=\"25\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"#FFFFFF\"\u003eSuperpowers en Google Antigravity — instalación, activación y sinergia\u003c/text\u003e\n  \u003ctext x=\"600\" y=\"45\" text-anchor=\"middle\" font-size=\"10.5\" letter-spacing=\".04em\" fill=\"#9AB0C8\"\u003eañade rigor de ingeniería al agente · \u003ctspan fill=\"#FF8C3B\"\u003eTDD estricto\u003c/tspan\u003e · causa raíz · \u003ctspan fill=\"#0D7C5A\"\u003esinergia con Spec-Kit\u003c/tspan\u003e\u003c/text\u003e\n\n  \u003c!-- PANEL 1: 3 MÉTODOS DE DESPLIEGUE --\u003e\n  \u003crect x=\"25\" y=\"74\" width=\"370\" height=\"270\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#2E6B9E\" stroke-width=\"1.5\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"25\" y=\"74\" width=\"370\" height=\"26\" rx=\"8\" fill=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"40\" y=\"91\" class=\"role\" fill=\"#FFFFFF\"\u003e3 MÉTODOS DE INSTALACIÓN\u003c/text\u003e\n\n  \u003c!-- Método 1 --\u003e\n  \u003crect x=\"40\" y=\"110\" width=\"340\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#0D7C5A\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"50\" y=\"128\" font-size=\"11\" font-weight=\"700\" fill=\"#0A5C43\"\u003e1. Plugin Nativo Global (Recomendado)\u003c/text\u003e\n  \u003ctext x=\"50\" y=\"144\" class=\"mono\" font-size=\"9\" fill=\"#1E3A5F\"\u003egit clone ... ~/.gemini/config/plugins/superpowers\u003c/text\u003e\n  \u003ctext x=\"50\" y=\"160\" class=\"sub\"\u003eAutocargado en Antigravity 2.0 y sesión desde el primer turno.\u003c/text\u003e\n\n  \u003c!-- Método 2 --\u003e\n  \u003crect x=\"40\" y=\"184\" width=\"340\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#C2510A\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"50\" y=\"202\" font-size=\"11\" font-weight=\"700\" fill=\"#7C2D12\"\u003e2. CLI Global (npx / uvx)\u003c/text\u003e\n  \u003ctext x=\"50\" y=\"218\" class=\"mono\" font-size=\"9\" fill=\"#1E3A5F\"\u003enpx skills add obra/superpowers -A \"claude, agy\"\u003c/text\u003e\n  \u003ctext x=\"50\" y=\"234\" class=\"sub\"\u003eInstala en perfil global; mover a antigravity-cli/skills si es CLI.\u003c/text\u003e\n\n  \u003c!-- Método 3 --\u003e\n  \u003crect x=\"40\" y=\"258\" width=\"340\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#E8E3D8\" stroke-width=\"1.3\"/\u003e\n  \u003ctext x=\"50\" y=\"276\" font-size=\"11\" font-weight=\"700\" fill=\"#1E3A5F\"\u003e3. Workspace Local (Ámbito Proyecto)\u003c/text\u003e\n  \u003ctext x=\"50\" y=\"292\" class=\"mono\" font-size=\"9\" fill=\"#2E6B9E\"\u003e.agents/skills/*  o  .claude/skills/*\u003c/text\u003e\n  \u003ctext x=\"50\" y=\"308\" class=\"sub\"\u003eAislamiento total por proyecto sin tocar configuración global.\u003c/text\u003e\n\n  \u003c!-- PANEL 2: SINERGIA SPEC-KIT + SUPERPOWERS --\u003e\n  \u003crect x=\"415\" y=\"74\" width=\"760\" height=\"270\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.5\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"415\" y=\"74\" width=\"760\" height=\"26\" rx=\"8\" fill=\"#0D7C5A\"/\u003e\n  \u003ctext x=\"430\" y=\"91\" class=\"role\" fill=\"#FFFFFF\"\u003eLA ALIANZA PERFECTA: SPEC-KIT (ESPECIFICACIÓN) + SUPERPOWERS (EJECUCIÓN)\u003c/text\u003e\n\n  \u003c!-- SpecKit chain --\u003e\n  \u003crect x=\"430\" y=\"112\" width=\"165\" height=\"70\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"512\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#1E3A5F\"\u003eSpec-Kit (Fases 1–5)\u003c/text\u003e\n  \u003ctext x=\"512\" y=\"148\" text-anchor=\"middle\" class=\"mono\" font-size=\"9.5\"\u003econstitution → spec\u003c/text\u003e\n  \u003ctext x=\"512\" y=\"162\" text-anchor=\"middle\" class=\"mono\" font-size=\"9.5\"\u003eplan.md → tasks.md\u003c/text\u003e\n  \u003ctext x=\"512\" y=\"174\" text-anchor=\"middle\" class=\"mono\" font-size=\"8.5\" fill=\"#0D7C5A\"\u003e/speckit-analyze ✓\u003c/text\u003e\n\n  \u003cline x1=\"595\" y1=\"147\" x2=\"630\" y2=\"147\" stroke=\"#C2510A\" stroke-width=\"2.2\" marker-end=\"url(#aOrange)\"/\u003e\n\n  \u003c!-- Decision Junction --\u003e\n  \u003crect x=\"635\" y=\"122\" width=\"130\" height=\"50\" rx=\"6\" fill=\"#FFF7ED\" stroke=\"#B91C1C\" stroke-width=\"1.6\"/\u003e\n  \u003ctext x=\"700\" y=\"141\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#B91C1C\"\u003eOMITIR\u003c/text\u003e\n  \u003ctext x=\"700\" y=\"157\" text-anchor=\"middle\" class=\"mono\" font-size=\"10\" fill=\"#7C2D12\"\u003e/speckit-implement\u003c/text\u003e\n\n  \u003cline x1=\"765\" y1=\"147\" x2=\"800\" y2=\"147\" stroke=\"#0D7C5A\" stroke-width=\"2.4\" marker-end=\"url(#aGreen)\"/\u003e\n\n  \u003c!-- Superpowers chain --\u003e\n  \u003crect x=\"805\" y=\"112\" width=\"350\" height=\"70\" rx=\"6\" fill=\"#E7F1EC\" stroke=\"#0D7C5A\" stroke-width=\"1.8\"/\u003e\n  \u003ctext x=\"980\" y=\"132\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#0A5C43\"\u003eSuperpowers toma el control de codificación\u003c/text\u003e\n  \u003ctext x=\"980\" y=\"150\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\"\u003eEjecuta las tareas de \u003ctspan class=\"mono\" font-weight=\"700\"\u003etasks.md\u003c/tspan\u003e con TDD estricto y subagentes\u003c/text\u003e\n  \u003ctext x=\"980\" y=\"166\" text-anchor=\"middle\" class=\"mono\" font-size=\"9.5\" fill=\"#0D7C5A\"\u003eusing-git-worktrees ➔ subagent-dev ➔ TDD ➔ code-review\u003c/text\u003e\n\n  \u003c!-- Explanation under pipeline --\u003e\n  \u003crect x=\"430\" y=\"196\" width=\"725\" height=\"134\" rx=\"6\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\"/\u003e\n  \u003ctext x=\"445\" y=\"218\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1E3A5F\"\u003e¿Por qué combinarlos?\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"238\" class=\"sub\"\u003e1. \u003ctspan font-weight=\"700\" fill=\"#1E3A5F\"\u003eSpec-Kit\u003c/tspan\u003e destaca en el diseño determinista de producto: requisitos funcionales agnósticos, modelos de datos y análisis de consistencia.\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"258\" class=\"sub\"\u003e2. \u003ctspan font-weight=\"700\" fill=\"#0D7C5A\"\u003eSuperpowers\u003c/tspan\u003e destaca en la disciplina de código: prohíbe escribir lógica sin un test que falle (Red ➔ Green ➔ Refactor).\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"278\" class=\"sub\"\u003e3. \u003ctspan font-weight=\"700\" fill=\"#C2510A\"\u003eResultado:\u003c/tspan\u003e Cero código especulativo, trazabilidad del 100% y cero regresiones en producción.\u003c/text\u003e\n  \u003ctext x=\"445\" y=\"302\" class=\"mono\" font-size=\"10\" fill=\"#7C2D12\"\u003ePrompt de relevo: \"Tareas aprobadas en tasks.md. Implementa la tarea 01 usando TDD y subagentes de Superpowers.\"\u003c/text\u003e\n\n  \u003c!-- PANEL 3: CATÁLOGO DE HABILIDADES SUPERPOWERS --\u003e\n  \u003crect x=\"25\" y=\"360\" width=\"760\" height=\"150\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\n  \u003ctext x=\"40\" y=\"380\" class=\"bt\"\u003eHabilidades clave de Superpowers en Antigravity\u003c/text\u003e\n\n  \u003crect x=\"40\" y=\"394\" width=\"135\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"107\" y=\"412\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"10.5\"\u003ebrainstorming\u003c/text\u003e\n  \u003ctext x=\"107\" y=\"428\" text-anchor=\"middle\" class=\"sub\"\u003eAntes de diseñar\u003c/text\u003e\n  \u003ctext x=\"107\" y=\"442\" text-anchor=\"middle\" class=\"sub\"\u003eEvalúa alternativas\u003c/text\u003e\n\n  \u003crect x=\"185\" y=\"394\" width=\"135\" height=\"66\" rx=\"6\" fill=\"#E7F1EC\" stroke=\"#0D7C5A\" stroke-width=\"1.5\"/\u003e\n  \u003ctext x=\"252\" y=\"412\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"10.5\" fill=\"#0A5C43\"\u003etest-driven-dev\u003c/text\u003e\n  \u003ctext x=\"252\" y=\"428\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\"\u003eTest primero\u003c/text\u003e\n  \u003ctext x=\"252\" y=\"442\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\"\u003eRed ➔ Green ➔ Refactor\u003c/text\u003e\n\n  \u003crect x=\"330\" y=\"394\" width=\"135\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#C2510A\"/\u003e\n  \u003ctext x=\"397\" y=\"412\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"10.5\" fill=\"#7C2D12\"\u003esystematic-debug\u003c/text\u003e\n  \u003ctext x=\"397\" y=\"428\" text-anchor=\"middle\" class=\"sub\"\u003eAnte fallos/bugs\u003c/text\u003e\n  \u003ctext x=\"397\" y=\"442\" text-anchor=\"middle\" class=\"sub\"\u003eAísla causa raíz\u003c/text\u003e\n\n  \u003crect x=\"475\" y=\"394\" width=\"135\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"542\" y=\"412\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"10.5\"\u003ecode-review\u003c/text\u003e\n  \u003ctext x=\"542\" y=\"428\" text-anchor=\"middle\" class=\"sub\"\u003eAntes de mergear\u003c/text\u003e\n  \u003ctext x=\"542\" y=\"442\" text-anchor=\"middle\" class=\"sub\"\u003eRevisión en 2 pasadas\u003c/text\u003e\n\n  \u003crect x=\"620\" y=\"394\" width=\"150\" height=\"66\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#1E3A5F\"/\u003e\n  \u003ctext x=\"695\" y=\"412\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"10.5\"\u003eusing-git-worktrees\u003c/text\u003e\n  \u003ctext x=\"695\" y=\"428\" text-anchor=\"middle\" class=\"sub\"\u003eAislamiento total\u003c/text\u003e\n  \u003ctext x=\"695\" y=\"442\" text-anchor=\"middle\" class=\"sub\"\u003eEspacios de trabajo limpios\u003c/text\u003e\n\n  \u003ctext x=\"40\" y=\"485\" class=\"sub\" font-size=\"9.5\" fill=\"#6B6B6B\"\u003eEl agente activa estas habilidades proactivamente según el flujo de trabajo o cuando las invocas en el chat.\u003c/text\u003e\n\n  \u003c!-- PANEL 4: CHIPS DE REGLAS ①②③ --\u003e\n  \u003crect x=\"805\" y=\"360\" width=\"370\" height=\"150\" rx=\"8\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/\u003e\n  \u003crect x=\"805\" y=\"360\" width=\"370\" height=\"24\" rx=\"8\" fill=\"#1E3A5F\"/\u003e\n  \u003ctext x=\"820\" y=\"376\" class=\"role\" fill=\"#FFFFFF\"\u003eREGLAS DE ORO DE INGENIERÍA\u003c/text\u003e\n\n  \u003crect x=\"818\" y=\"392\" width=\"345\" height=\"32\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"828\" y=\"408\" font-size=\"10\" font-weight=\"700\" fill=\"#0A5C43\"\u003e① TDD sin excepciones\u003c/text\u003e\n  \u003ctext x=\"828\" y=\"419\" class=\"sub\"\u003eNinguna línea entra en producción sin su test unitario fallido previo.\u003c/text\u003e\n\n  \u003crect x=\"818\" y=\"428\" width=\"345\" height=\"32\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"828\" y=\"444\" font-size=\"10\" font-weight=\"700\" fill=\"#7C2D12\"\u003e② Causa raíz antes de editar\u003c/text\u003e\n  \u003ctext x=\"828\" y=\"455\" class=\"sub\"\u003eSi un test falla, formula hipótesis verificables antes de modificar código.\u003c/text\u003e\n\n  \u003crect x=\"818\" y=\"464\" width=\"345\" height=\"32\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#2E6B9E\" stroke-width=\"1.2\"/\u003e\n  \u003ctext x=\"828\" y=\"480\" font-size=\"10\" font-weight=\"700\" fill=\"#1E3A5F\"\u003e③ Despliegue en capas\u003c/text\u003e\n  \u003ctext x=\"828\" y=\"491\" class=\"sub\"\u003eUsa el plugin global ~/.gemini para sesión diaria; local para overrides.\u003c/text\u003e\n\n  \u003c!-- LEYENDA Y FOOTER --\u003e\n  \u003crect x=\"25\" y=\"530\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2E6B9E\"/\u003e\n  \u003ctext x=\"45\" y=\"541\" class=\"lbl\" font-weight=\"700\"\u003eInstalación \u0026amp; Setup\u003c/text\u003e\n\n  \u003crect x=\"220\" y=\"530\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#1E3A5F\"/\u003e\n  \u003ctext x=\"240\" y=\"541\" class=\"lbl\" font-weight=\"700\"\u003eSpec-Kit (Especificación)\u003c/text\u003e\n\n  \u003crect x=\"440\" y=\"530\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#B91C1C\"/\u003e\n  \u003ctext x=\"460\" y=\"541\" class=\"lbl\" font-weight=\"700\"\u003ePunto de relevo (Omitir implement)\u003c/text\u003e\n\n  \u003crect x=\"700\" y=\"530\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0D7C5A\"/\u003e\n  \u003ctext x=\"720\" y=\"541\" class=\"lbl\" font-weight=\"700\"\u003eSuperpowers (TDD \u0026amp; Ejecución)\u003c/text\u003e\n\n  \u003cline x1=\"25\" y1=\"565\" x2=\"1175\" y2=\"565\" stroke=\"#E8E3D8\" stroke-width=\"1\"/\u003e\n  \u003ctext x=\"600\" y=\"585\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\"\u003eSuperpowers en Antigravity \u0026amp; Sinergia Spec-Kit · core-human-knowledge · paleta COIIAOC (tipografía V2) · 2026-09-10\u003c/text\u003e\n\u003c/svg\u003e\n"}]};

    let currentFilter = 'ALL';
    let currentSearch = '';
    let currentGuide = null;
    let currentDisplayMode = 'split';

    // Init App
    function init() {
      document.getElementById('header-count').textContent = CATALOG.guides.length + ' Gu\u00EDas';
      renderFilterChips();
      renderGuideCards();
      setupEventListeners();
    }

    // Filter Chips
    function renderFilterChips() {
      const container = document.getElementById('filter-container');
      container.innerHTML = '';
      CATALOG.availableTypes.forEach(type => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (type === currentFilter ? ' active' : '');
        chip.textContent = type === 'ALL' ? 'Todas' : type;
        chip.addEventListener('click', () => {
          currentFilter = type;
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          renderGuideCards();
        });
        container.appendChild(chip);
      });
    }

    // Catalog Grid
    function renderGuideCards() {
      const grid = document.getElementById('guide-grid');
      grid.innerHTML = '';

      const filtered = CATALOG.guides.filter(g => {
        const matchesFilter = (currentFilter === 'ALL' || g.type === currentFilter);
        const q = currentSearch.toLowerCase();
        const matchesSearch = !q || 
          g.title.toLowerCase().includes(q) || 
          (g.summary && g.summary.toLowerCase().includes(q)) || 
          (Array.isArray(g.tags) && g.tags.some(t => {
            const str = typeof t === 'string' ? t : (t?.value || '');
            return str.toLowerCase().includes(q);
          }));
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-msg">No se encontraron gu\u00EDas coincidentes con tu b\u00FAsqueda.</div>';
        return;
      }

      filtered.forEach(g => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-meta">
            <span class="card-num">#${g.id}</span>
            <span class="card-badge badge-${g.type}">${g.type}</span>
          </div>
          <div class="card-title">${escapeHtml(g.title)}</div>
          <div class="card-desc">${escapeHtml(g.summary || 'Sin resumen disponible.')}</div>
          <div class="card-footer">
            <span class="svg-status ${g.hasSvg ? 'available' : 'missing'}">
              ${g.hasSvg ? '\u25CF Diagrama SVG incluido' : '\u25CB Sin diagrama'}
            </span>
            <span style="font-weight:700; color:var(--c-blue);">Leer gu\u00EDa &rarr;</span>
          </div>
        `;
        card.addEventListener('click', () => openReader(g));
        grid.appendChild(card);
      });
    }

    // Open Reader
    function openReader(guide) {
      currentGuide = guide;
      document.getElementById('catalog-view').style.display = 'none';
      document.getElementById('reader-view').style.display = 'flex';

      document.getElementById('reader-title').textContent = '#' + guide.id + ' \u00B7 ' + guide.title;
      
      let mdText = guide.contentMarkdown;
      if (typeof mdText !== 'string' && mdText && mdText.value) {
        mdText = mdText.value;
      }
      document.getElementById('md-content').innerHTML = renderSimpleMarkdown(mdText);

      const svgContainer = document.getElementById('svg-content');
      let svgText = guide.contentSvg;
      if (typeof svgText !== 'string' && svgText && svgText.value) {
        svgText = svgText.value;
      }

      if (guide.hasSvg && svgText) {
        svgContainer.innerHTML = svgText;
      } else {
        svgContainer.innerHTML = '<div style="color:var(--c-text-muted); padding:40px; text-align:center;">Diagrama SVG pendiente para esta gu\u00EDa.</div>';
      }

      attachCopyButtons();
      window.scrollTo(0, 0);
    }

    // Back to Catalog
    function closeReader() {
      document.getElementById('reader-view').style.display = 'none';
      document.getElementById('catalog-view').style.display = 'block';
      currentGuide = null;
    }

    // Simple Markdown Renderer (Zero dependencies)
    function renderSimpleMarkdown(md) {
      if (!md) return '';
      if (typeof md !== 'string' && md.value) md = md.value;
      if (typeof md !== 'string') return '';

      // Normalize CRLF to LF
      let html = md.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // Extract and preserve code blocks
      const codeBlocks = [];
      html = html.replace(/```([a-z0-9_-]*)\n([\s\S]*?)```/gi, (match, lang, code) => {
        const id = '___CODE_BLOCK_' + codeBlocks.length + '___';
        codeBlocks.push({ id, lang, code: escapeHtml(code.trim()) });
        return id;
      });

      // Headers
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Horizontal rules
      html = html.replace(/^---$/gim, '<hr style="border:none; border-top:1px solid var(--c-border); margin:20px 0;">');

      // Blockquotes
      html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');

      // Bold & Italic
      html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/gim, '<em>$1</em>');

      // Inline code
      html = html.replace(/`([^`]+)`/gim, '<code style="background:var(--c-panel); padding:2px 5px; border-radius:4px; font-family:var(--font-mono); font-size:12px; color:var(--c-navy);">$1</code>');

      // Tables
      html = html.replace(/((?:\|[^\n]+\|\n)+)/g, (match) => {
        const lines = match.trim().split('\n').filter(l => !l.includes('---'));
        if (lines.length === 0) return '';
        let tableHtml = '<table>';
        lines.forEach((line, idx) => {
          const cells = line.split('|').filter((_, i, arr) => i > 0 && i < arr.length - 1).map(c => c.trim());
          if (idx === 0) {
            tableHtml += '<thead><tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
          } else {
            tableHtml += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
          }
        });
        tableHtml += '</tbody></table>';
        return tableHtml;
      });

      // Paragraphs & lists
      html = html.split('\n\n').map(block => {
        block = block.trim();
        if (!block) return '';
        if (block.startsWith('<h') || block.startsWith('<blockquote') || block.startsWith('<table') || block.startsWith('<hr') || block.startsWith('___CODE_BLOCK_')) {
          return block;
        }
        if (block.startsWith('- ') || block.startsWith('* ')) {
          const items = block.split('\n').map(li => '<li>' + li.replace(/^[-*]\s+/, '') + '</li>').join('');
          return '<ul>' + items + '</ul>';
        }
        return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');

      // Re-insert code blocks with copy button
      codeBlocks.forEach(b => {
        const blockHtml = `
          <div class="code-container">
            <button class="copy-btn" data-code="${escapeAttr(b.code)}">Copiar</button>
            <pre><code>${b.code}</code></pre>
          </div>
        `;
        html = html.replace(b.id, blockHtml);
      });

      return html;
    }

    function attachCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const code = btn.getAttribute('data-code');
          navigator.clipboard.writeText(code).then(() => {
            const original = btn.textContent;
            btn.textContent = '\u00A1Copiado! \u2713';
            btn.style.background = 'var(--c-green)';
            setTimeout(() => {
              btn.textContent = original;
              btn.style.background = '';
            }, 2000);
          });
        });
      });
    }

    function setupEventListeners() {
      // Search Input
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderGuideCards();
      });

      // Back Button
      document.getElementById('btn-back').addEventListener('click', closeReader);

      // Display Mode Toggles
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const mode = btn.getAttribute('data-mode');
          const layout = document.getElementById('reader-layout');
          layout.className = 'reader-content mode-' + mode;
        });
      });

      // Global Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.getElementById('catalog-view').style.display !== 'none' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape') {
          if (document.getElementById('reader-view').style.display === 'flex') {
            closeReader();
          } else if (searchInput.value) {
            searchInput.value = '';
            currentSearch = '';
            renderGuideCards();
          }
        }
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function escapeAttr(text) {
      if (!text) return '';
      return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
