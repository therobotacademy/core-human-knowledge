  <title>Explorador de Gu&iacute;as &middot; Core Human Knowledge</title>
  <style>

      --font-mono: Consolas, 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background-color: var(--c-bg);
      color: var(--c-text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--c-navy);
      color: #fff;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-left: 6px solid var(--c-accent-orange);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.02em;
    }
    .brand-sub {
      color: #9AB0C8;
      font-size: 12px;
      font-weight: normal;
      margin-left: 8px;
    }
    .badge-count {
      background: rgba(255,255,255,0.15);
      color: #fff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }
    /* Toolbar / Controls */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      background: var(--c-surface);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--c-border);
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 480px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--c-border);
      border-radius: 6px;
      background: var(--c-panel);
      outline: none;
      transition: all 0.15s;
    }
    .search-box input:focus {
      border-color: var(--c-blue);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(46,107,158,0.15);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--c-text-muted);
      font-size: 14px;
      pointer-events: none;
    }
    .shortcut-hint {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--c-border);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--c-text-muted);
      pointer-events: none;
    }
    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--c-border);
      background: var(--c-panel);
      color: var(--c-text-muted);
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover {
      border-color: var(--c-navy);
      color: var(--c-navy);
    }
    .chip.active {
      background: var(--c-navy);
      color: #fff;
      border-color: var(--c-navy);
    }

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));

      border: 1px solid var(--c-border);
      border-radius: 8px;

      flex-direction: column;

    .card:hover {

      border-color: var(--c-blue);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }
    .card-meta {

      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-num {

      font-weight: 800;
      font-size: 18px;

      font-weight: 700;
      color: var(--c-navy);
      margin-bottom: 8px;
      line-height: 1.35;

      margin-bottom: 16px;
      display: -webkit-box;

      padding-top: 12px;

      border: 1px solid var(--c-border);
      border-radius: 8px;

      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;

      font-weight: 800;
      color: var(--c-navy);

  <script>
    // Embedded Catalog Data
    const CATALOG = {"version":"1.0.0","lastUpdated":"2026-09-10T17:13:56Z","totalGuides":6,"availableTypes":["ALL","CHEATSHEET","TUTORIAL","PROCEDIMIENTO","REFERENCIA"],"guides":[{"id":"01","type":"CHEATSHEET","slug":"git-PR-vs-merge","title":"Cheatsheet · Git nativo (merge) vs. Pull Requests de GitHub (`gh`)","summary":"**Idea rectora: un *merge* y un *PR* son operaciones independientes.**","mdFilename":"01-CHEATSHEET-git-PR-vs-merge.md","svgFilename":"01-CHEATSHEET-git-PR-vs-merge.svg","hasSvg":true,"tags":["cheatsheet","git","PR","vs","merge"],"contentMarkdown":"# Cheatsheet · Git nativo (merge) vs. Pull Requests de GitHub (`gh`)\n\n> **Idea rectora: un *merge* y un *PR* son operaciones independientes.**\n> - El **merge** es **git nativo**: fusiona ramas en tu repo local; GitHub no se entera hasta que haces `push`.\n> - El **PR** es un objeto **de GitHub** (una solicitud de revisión/integración) que vive en el servidor; no cambia tu repo local.\n> - Puedes **mergear sin PR**, y **cerrar un PR sin mergear**. No son lo mismo.\n\n---\n\n## Sección 1 · Pull Requests (GitHub · vía `gh`)\n\n**Qué es:** una propuesta de integrar la rama `HEAD` en la rama `BASE`, gestionada en GitHub. Sirve para revisión/registro; **por sí solo no toca tu código local**.\n\n**Reglas que aprendimos:**\n- **Cerrar ≠ mergear.** `gh pr close` descarta la propuesta **sin fusionar nada**.\n- **Hace falta diferencia.** Sólo se puede crear un PR si `HEAD` tiene commits que no están en `BASE`. Si la rama **ya está mergeada** → error `No commits between BASE and HEAD`.\n- **El orden importa:** si quieres dejar registro de PR, **crea el PR ANTES del merge**. Después del merge ya no se puede.\n\n**Comandos:**\n```bash\ngh pr create --base master --head dev/mi-rama \\\n     --title \"Título\" --body-file cuerpo.md     # crear\ngh pr view 8 --json number,state,headRefName     # consultar\ngh pr close 8                                    # cerrar SIN borrar rama\ngh pr close 8 --delete-branch                    # cerrar Y borrar rama\ngh pr merge 8 --merge | --squash | --rebase      # mergear DESDE GitHub\n```\n\n**Autenticación de `gh` (distinta de git):**\n- `gh` necesita su propio login (`gh auth login`); el *credential helper* de git **no** lo loguea.\n- Si `gh` no está logueado pero git sí puede pushear, reutiliza la credencial de git como token:\n  ```bash\n  GH_TOKEN=$(printf \"protocol=https\\nhost=github.com\\n\\n\" \\\n       | git credential fill | sed -n 's/^password=//p')\n  GH_TOKEN=\"$GH_TOKEN\" gh pr create ...\n  ```\n- En Windows, si `gh` no está en el PATH: `& \"C:\\Program Files\\GitHub CLI\\gh.exe\" ...`\n\n---\n\n## Sección 2 · Git nativo (merge) y su relación con GitHub\n\n**El merge real** (lo que de verdad mete la rama en `master`):\n```bash\ngit stash push -m wip -- ruta/fichero   # 1. árbol limpio (o commitea) antes de cambiar de rama\ngit checkout master                     # 2. sitúate en la rama destino\ngit merge --no-ff dev/mi-rama \\         # 3. fusiona (--no-ff = commit de merge explícito)\n     -m \"Merge dev/mi-rama: ...\"\ngit push origin master                  # 4. SUBE el resultado a GitHub  ← clave\ngit checkout dev/mi-rama && git stash pop # 5. vuelve y recupera tu trabajo\n```\n- `--no-ff` crea un **commit de merge** (deja constancia de la integración, convención del repo).\n  *Alternativa:* fast-forward (sin commit de merge) si la rama es `master`+N lineal.\n\n**Relación con GitHub:**\n- GitHub solo \"ve\" lo que **pusheas**. El merge local **no aparece** en GitHub hasta `git push`.\n- **Merge local + push = `master` actualizado en GitHub, sin ningún PR.**\n- Si había un PR **abierto** de esa rama, al pushear el merge GitHub suele marcarlo **\"Merged\"** al detectar los commits en `BASE`. Si lo habías **cerrado antes** (como el #8), queda **\"Closed\"**, no \"Merged\".\n- `gh pr close` **no hace nada** en tu git local ni en `master`.\n\n**Conservar la rama:** ni el merge ni `gh pr close` (sin `--delete-branch`) la borran. Para borrarla:\n```bash\ngit branch -d dev/mi-rama                 # local\ngit push origin --delete dev/mi-rama      # remota\n```\n\n---\n\n## Tabla resumen — qué hace cada operación\n\n| Acción | ¿Cambia `master` local? | ¿Sube a GitHub? | ¿Afecta al PR? |\n|---|:--:|:--:|:--:|\n| `git merge --no-ff` | **sí** | no (hasta push) | no |\n| `git push origin master` | no (sube lo ya hecho) | **sí** | lo marca *merged* si seguía abierto |\n| `gh pr create` | no | no | **crea** el PR |\n| `gh pr close` | no | no | **cierra** (sin fusionar) |\n| `gh pr merge` | — | sí (lo hace `gh`) | **mergea + cierra** |\n\n---\n\n## Lo que pasó en esta sesión (ejemplo real)\n\n- **Rama A `dev/ddf-wizard-alpha`:** `commit` → `push` → `gh pr create` (#8) → `gh pr close 8` (sin mergear) → `git merge --no-ff` a `master` → `push`.\n  → El PR quedó **Closed**, pero el trabajo **sí entró** en `master` por el merge nativo posterior. (PR y merge, independientes.)\n- **Rama B `dev/ddf-app-template`:** `git merge --no-ff` directo a `master` → `push`. Al intentar `gh pr create` **después**, GitHub respondió `No commits between master and dev/ddf-app-template` → ya estaba integrada, no había nada que proponer.\n\n> Moraleja: **el merge integra; el PR documenta/revisa.** Si quieres ambas cosas con su registro en GitHub, haz el PR **primero** y mergéalo (o ciérralo) **después**.\n\n---\n\n*Referencia derivada de las operaciones de la sesión dev DDF-Wizard · 2026-06-09.*\n","contentSvg":"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"618\" viewBox=\"0 0 1200 618\">\n  <defs>\n    <marker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/></marker>\n    <marker id=\"aOrange\" markerWidth=\"11\" markerHeight=\"9\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#C2510A\"/></marker>\n    <marker id=\"aMute\" markerWidth=\"9\" markerHeight=\"7\" refX=\"7\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 8 3.5, 0 7\" fill=\"#9B9B9B\"/></marker>\n    <filter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"><feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.08)\"/></filter>\n    <style>\n      text{font-family:'Segoe UI', Arial, sans-serif}\n      .mono{font-family:Consolas,'Courier New',monospace}\n      .role{font-size:10px;letter-spacing:.12em;font-weight:700}\n      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}\n      .sub{font-size:9.5px;fill:#6B6B6B}\n      .cmd{font-size:12px;font-weight:700;fill:#1E3A5F}\n      .lbl{font-size:11px;fill:#6B6B6B}\n    </style>\n  </defs>\n\n  <rect width=\"1200\" height=\"618\" fill=\"#F5F2EC\"/>\n\n  <!-- HEADER -->\n  <rect x=\"0\" y=\"0\" width=\"1200\" height=\"58\" fill=\"#1E3A5F\"/>\n  <rect x=\"0\" y=\"0\" width=\"6\" height=\"58\" fill=\"#FF8C3B\"/>\n  <text x=\"600\" y=\"25\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"#FFFFFF\">Git nativo (merge)  vs.  Pull Requests (gh)  —  operaciones independientes</text>\n  <text x=\"600\" y=\"45\" text-anchor=\"middle\" font-size=\"10.5\" letter-spacing=\".04em\" fill=\"#9AB0C8\">el <tspan fill=\"#FF8C3B\">git push</tspan> es el único puente  LOCAL → GitHub</text>\n\n  <!-- FRONTERA -->\n  <line x1=\"600\" y1=\"76\" x2=\"600\" y2=\"340\" stroke=\"#9B9B9B\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>\n  <text x=\"300\" y=\"92\" text-anchor=\"middle\" class=\"role\" fill=\"#1E3A5F\">● TU REPO · GIT NATIVO (local)</text>\n  <text x=\"900\" y=\"92\" text-anchor=\"middle\" class=\"role\" fill=\"#2E6B9E\">● GITHUB · servidor (gh)</text>\n\n  <!-- ===== LEFT · git flow ===== -->\n  <rect x=\"150\" y=\"104\" width=\"300\" height=\"42\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/>\n  <text x=\"300\" y=\"130\" text-anchor=\"middle\" class=\"bt\">rama  <tspan class=\"mono\" font-size=\"11.5\">dev/mi-r text x=\"438\" y=\"401\" class=\"sub\" font-size=\"10.5\">Cerrar un PR no fusiona nada.</text>\n\n  <rect x=\"800\" y=\"364\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.4\"/>\n  <text x=\"818\" y=\"384\" font-size=\"10\" font-weight=\"700\" fill=\"#0D7C5A\">③ EL ORDEN IMPORTA</text>\n  <text x=\"818\" y=\"401\" class=\"sub\" font-size=\"10.5\">¿Registro de PR? Créalo ANTES del merge.</text>\n\n  <!-- ===== EJEMPLO de la sesión ===== -->\n  <rect x=\"40\" y=\"430\" width=\"1120\" height=\"86\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\"/>\n  <text x=\"58\" y=\"451\" class=\"role\" fill=\"#9B9B9B\">EN ESTA SESIÓN</text>\n  <text x=\"58\" y=\"475\" font-size=\"11\"><tspan font-weight=\"700\" fill=\"#2E6B9E\">Rama A</tspan> <tspan class=\"mono\" fill=\"#1C1C1C\">commit → push → gh pr create #8 → gh pr close → git merge --no-ff → push</tspan></text>\n  <text x=\"58\" y=\"492\" font-size=\"10.5\" fill=\"#6B6B6B\">⟹ el PR quedó <tspan font-weight=\"700\" fill=\"#B91C1C\">Closed</tspan>, pero la rama <tspan font-weight=\"700\" fill=\"#0D7C5A\">SÍ se integró</tspan> por el merge nativo posterior.</text>\n  <text x=\"58\" y=\"509\" font-size=\"11\"><tspan font-weight=\"700\" fill=\"#2E6B9E\">Rama B</tspan> <tspan class=\"mono\" fill=\"#1C1C1C\">git merge --no-ff → push</tspan><tspan fill=\"#6B6B6B\">  ⟹  gh pr create después falla: «No commits between…» (ya integrada).</tspan></text>\n\n  <!-- ===== LEYENDA ===== -->\n  <g>\n    <rect x=\"40\" y=\"534\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#0D7C5A\"/><text x=\"58\" y=\"544\" class=\"sub\">merge = integra (git)</text>\n    <rect x=\"232\" y=\"534\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#C2510A\"/><text x=\"250\" y=\"544\" class=\"sub\">PR = documenta/revisa (gh)</text>\n    <rect x=\"470\" y=\"534\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#1E3A5F\"/><text x=\"488\" y=\"544\" class=\"sub\">GitHub (servidor) = lo que pusheas</text>\n    <line x1=\"740\" y1=\"540\" x2=\"772\" y2=\"540\" stroke=\"#9B9B9B\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><text x=\"780\" y=\"544\" class=\"sub\">frontera local | GitHub</text>\n  </g>\n\n  <!-- FOOTER -->\n  <text x=\"600\" y=\"600\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\">Cheatsheet git/gh · merge (nativo) y PR (GitHub) son independientes · sesión dev DDF-Wizard · paleta COIIAOC (tipografía V2) · 2026-06-09</text>\n</svg>\n"},{"id":"02","type":"TUTORIAL","slug":"git-worktree","title":"Tutorial — `git worktree`","summary":"Cómo tener **varias ramas abiertas a la vez en carpetas distintas**, compartiendo un único repositorio.","mdFilename":"02-TUTORIAL-git-worktree.md","svgFilename":"02-TUTORIAL-git-worktree.svg","hasSvg":true,"tags":["tutorial","git","worktree"],"contentMarkdown":"# Tutorial — `git worktree`\n\n> Cómo tener **varias ramas abiertas a la vez en carpetas distintas**, compartiendo un único repositorio.\n> Escrito sobre el caso real de este repo (`master` con LAB4 + rama `skill/prueba-validacion`), en Windows + PowerShell.\n\n---\n\n## 1. El problema que resuelve\n\nCon git \"normal\" solo puedes tener **una rama** checada en tu carpeta a la vez. Si estás en `skill/prueba-validacion` y necesitas mirar (o ejecutar) los ficheros de `master`, tienes que:\n\n- `git switch master` → pero entonces **pierdes de vista** tu trabajo de PV (y si tienes cambios sin commitear, te toca `git stash`).\n- o clonar el repo otra vez en otra carpeta → pero eso **duplica** el `.git` entero y se desincroniza.\n\n`git worktree` resuelve esto: **un mismo repositorio, varios directorios de trabajo**, cada uno con una rama distinta checada, todos compartiendo la misma base de objetos y refs.\n\n```\n                ┌──────────────────────────────┐\n                │   repositorio (.git único)    │\n                │  commits · ramas · tags · stash│\n                └───────────────┬───────────────┘\n              ┌─────────────────┼──────────────────┐\n              ▼                 ▼                  ▼\n   carpeta principal     ../LAB4-master      ../revision-pr\n   rama: skill/pv        rama: master        rama: labs/1\n   (tu trabajo)          (referencia LAB4)   (revisar otra cosa)\n```\n\nEs **un solo repo** visto desde tres carpetas, cada una \"congelada\" en una rama diferente.\n\n---\n\n## 2. Modelo mental (lo que comparten y lo que no)\n\n| Se **comparte** entre worktrees | Es **propio** de cada worktree |\n| --- | --- |\n| Historial de commits, ramas, tags | El directorio de trabajo (los ficheros en disco) |\n| El `stash` (es global) | El `HEAD` (qué rama/commit tiene checada) |\n| `remotes` y la mayoría de `config` | El índice (staging area) |\n| Los hooks de `.git/hooks` | Ficheros **no rastreados** e **ignorados** (`.tmp/`, `node_modules/`, PDFs de QA…) |\n\n**Consecuencia práctica clave:** los ficheros ignorados/temporales **no viajan** entre worktrees. Si en la carpeta principal tienes `.tmp/` con scripts de build o `node_modules/`, en `../LAB4-master` **no estarán** — cada worktree parte limpio salvo lo versionado. Esto suele ser una ventaja (aíslas builds), pero conviene saberlo.\n\n**La regla de oro:** una rama solo puede estar checada en **un** worktree a la vez. Git te impedirá checar `master` en dos sitios — y está bien, porque evita que edites la misma rama desde dos carpetas y te pises.\n\n---\n\n## 3. El caso de este repo\n\nSituación: estás en `skill/prueba-validacion` y quieres **consultar los ficheros de LAB4 que viven en `master`** sin mezclarlos en tu rama de trabajo.\n\n```powershell\n# Estás en la carpeta principal, rama skill/prueba-validacion\ngit worktree add ..\\LAB4-master master\n```\n\nEsto crea la carpeta hermana `..\\LAB4-master` con `master` checado. Ahora:\n\n- **Carpeta principal** (`46-UNIPRO-...`) → rama `skill/prueba-validacion`, tu trabajo del skill.\n- **`..\\LAB4-master`** → rama `master`, con `raw-unipro/LABORATORIOS/LAB4.../materiales/`, `intuitions.md`, `wiki/lab4-guia/`, etc., para consultar o ejecutar.\n\nCuando termines de consultar, la quitas (sección 6). El trabajo de PV nunca se \"ensucia\" con el contenido de LAB4.\n\n> En este repo ya hicimos la **Opción A** (merge de `master` en la rama PV), así que LAB4 ya está disponible en la carpeta principal. El worktree (Opción B) es la alternativa para cuando **no** quieras esa mezcla — ver la comparación en §7.\n\n---\n\n## 4. Comandos esenciales\n\n### Crear un worktree\n\n```powershell\n# Rama EXISTENTE en una carpeta nueva\ngit worktree add ..\\LAB4-master master\n\n# Rama NUEVA creada al vuelo (equivale a git switch -c)\ngit worktree add -b hotfix/typo ..\\hotfix master\n#  └ crea la rama hotfix/typo a partir de master, en ../hotfix\n\n# Solo inspeccionar un commit/rama SIN ocupar la rama (HEAD desacoplado)\ngit worktree add --detach ..\\inspeccion v1.0\n#  útil para mirar/compilar algo puntual sin \"reservar\" la rama\n```\n\n### Listar\n\n```powershell\ngit worktree list\n# C:/.../46-UNIPRO-...        0964670 [skill/prueba-validacion]\n# C:/.../LAB4-master          83cdd35 [master]\n```\n\n### Quitar (cuando ya no lo necesitas)\n\n```powershell\ngit worktree remove ..\\LAB4-master        # debe estar limpio\ngit worktree remove --force ..\\LAB4-master # si tiene cambios sin guardar\n```\n\n### Limpiar referencias huérfanas\n\nSi borraste la carpeta **a mano** (con el explorador) en vez de con `remove`, git se queda con un registro fantasma. Lo limpias con:\n\n```powershell\ngit worktree prune\n```\n\n### Otros\n\n```powershell\ngit worktree move ..\\LAB4-master ..\\nueva-ubicacion   # mover de sitio\ngit worktree lock ..\\LAB4-master      # evita que prune lo borre (p. ej. en un USB)\ngit worktree unlock ..\\LAB4-master\n```\n\n---\n\n## 5. Anatomía (para entender qué pasa por dentro)\n\n- La carpeta principal tiene el `.git/` real (la base de datos del repo).\n- Cada worktree enlazado **no** tiene un `.git/` carpeta, sino un **fichero** `.git` con una línea `gitdir: .../.git/worktrees/<nombre>`.\n- Dentro de `.git/worktrees/<nombre>/` git guarda el `HEAD`, el índice y la config propia de ese worktree.\n\nNo necesitas tocar nada de eso, pero saberlo explica por qué **no se duplica** el historial (a diferencia de un `git clone`): solo se añade un puntero ligero.\n\n---\n\n## 6. Ciclo de vida típico (de principio a fin)\n\n```powershell\n# 1. Crear el worktree de referencia\ngit worktree add ..\\LAB4-master master\n\n# 2. Trabajar: en la carpeta principal sigues con PV;\n#    cuando necesites LAB4, abres ..\\LAB4-master (otra ventana del editor)\n\n# 3. (opcional) actualizarlo si master avanza\ncd ..\\LAB4-master\ngit pull            # o git fetch + git merge\ncd ..\\46-UNIPRO-... # vuelves a tu carpeta de PV\n\n# 4. Al terminar, eliminarlo\ngit worktree remove ..\\LAB4-master\n```\n\n---\n\n## 7. ¿Worktree o merge? (Opción B vs Opción A)\n\nLas dos formas de \"trabajar en PV teniendo LAB4 a mano\":\n\n| | **Opción A — merge** (`git merge master`) | **Opción B — worktree** |\n| --- | --- | --- |\n| Qué hace | Trae el contenido de `master` **dentro** de la rama PV | Monta `master` en **otra carpeta** |\n| Resultado | Una sola carpeta con LAB4 + PV juntos | Dos carpetas, ramas separadas |\n| LAB4 acaba… | **versionado en PV** (hasta que mergees a master) | solo como **referencia**, fuera de los commits de PV |\n| Historia | crea un commit de merge | no toca la historia |\n| Cuándo conviene | quieres de verdad incorporar lo de master a tu rama | LAB4 es **solo consulta** y quieres PV \"limpia\" |\n| Coste | resolver conflictos una vez | gestionar una carpeta extra |\n\nRegla rápida: **¿necesito que el contenido de master forme parte de mi rama?** → A (merge). **¿solo lo quiero ver/ejecutar al lado?** → B (worktree).\n\n---\n\n## 8. Worktree frente a otras alternativas\n\n| Herramienta | Para qué | Por qué worktree puede ser mejor |\n| --- | --- | --- |\n| `git switch` | cambiar de rama en la misma carpeta | switch te obliga a **abandonar** la rama actual; worktree las tiene **a la vez** |\n| `git stash` | guardar cambios a medias | con worktree no necesitas stash: cada rama vive en su carpeta |\n| `git clone` (2.ª copia) | otra copia del repo | clone **duplica** `.git` y se desincroniza; worktree comparte uno solo |\n\nCasos de uso habituales del worktree:\n- **Referencia en paralelo** (nuestro caso: LAB4 mientras trabajas en PV).\n- **Hotfix urgente**: arreglar un bug en `master` sin tocar tu feature a medias.\n- **Revisar un PR**: checar la rama de otro en una carpeta aparte y ejecutarla.\n- **Builds/tests largos**: lanzar la suite en un worktree mientras sigues programando en otro.\n\n---\n\n## 9. Notas para Windows + PowerShell (este repo)\n\n- **Rutas con espacios:** este repo cuelga de `...\\Mi unidad\\__Active-AGENTS\\...`. Si la ruta del worktree lleva espacios, **entre comillas**:\n  ```powershell\n  git worktree add \"..\\LAB4 master\" master\n  ```\n  (Mejor evita espacios en el nombre del worktree: usa `..\\LAB4-master`.)\n- **Pon el worktree FUERA del repo**, como hermano (`..\\nombre`), nunca dentro de la carpeta del repo (git intentaría rastrearlo y se lía).\n- **Google Drive:** la carpeta está sincronizada con Drive. Un worktree hermano (`..\\LAB4-master`) **también** se sincronizará. No es un problema, pero genera tráfico de sync; para algo efímero, considera crearlo en una ruta local fuera de Drive (p. ej. `C:\\tmp\\LAB4-master`):\n  ```powershell\n  git worktree add C:\\tmp\\LAB4-master master\n  ```\n- **Ficheros de bloqueo de Office (`~$*.docx`) y `.tmp/`:** recuerda que **no** se comparten entre worktrees (son ignorados/no rastreados). Cada carpeta tiene los suyos.\n\n---\n\n## 10. Errores comunes y cómo evitarlos\n\n| Síntoma | Causa | Solución |\n| --- | --- | --- |\n| `fatal: 'master' is already checked out at ...` | intentas checar en dos sitios la misma rama | usa otra rama, o `--detach` para solo inspeccionar |\n| Borré la carpeta a mano y `worktree list` aún la muestra | git no se enteró | `git worktree prune` |\n| `remove` se queja de cambios sin guardar | el worktree está sucio | commitea/descarta, o `git worktree remove --force` |\n| No veo mi `node_modules` / `.tmp` en el nuevo worktree | son ignorados, no se comparten | reinstala/regenera en ese worktree si los necesitas |\n| El worktree quedó \"detached HEAD\" | lo creaste con un commit/tag, no una rama | normal para inspección; crea rama con `git switch -c` si vas a commitear |\n\n---\n\n## 11. Chuleta\n\n```powershell\ngit worktree add  ..\\dir <rama>        # nueva carpeta con una rama existente\ngit worktree add -b <rama> ..\\dir base # crear rama nueva + carpeta\ngit worktree add --detach ..\\dir <ref> # inspección sin ocupar rama\ngit worktree list                      # ver todos\ngit worktree remove ..\\dir             # quitar (limpio)\ngit worktree remove --force ..\\dir     # quitar (con cambios)\ngit worktree prune                     # limpiar fantasmas\ngit worktree move ..\\dir ..\\otro       # mover\ngit worktree lock / unlock ..\\dir      # proteger de prune\n```\n\n**En una frase:** `git worktree` te da varias \"ventanas\" sobre el mismo repositorio, cada una en una rama distinta y en su propia carpeta, sin clonar ni hacer malabares con `stash` — ideal para tener `master` (referencia de LAB4) abierto al lado de tu rama de trabajo `skill/prueba-validacion`.\n","contentSvg":"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"634\" viewBox=\"0 0 1200 634\">\n  <defs>\n    <marker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/></marker>\n    <marker id=\"aMute\" markerWidth=\"9\" markerHeight=\"7\" refX=\"7\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 8 3.5, 0 7\" fill=\"#9B9B9B\"/></marker>\n    <filter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"><feDropShadow dx=\"0\" dy=\"2\" std <tspan fill=\"#C2510A\" font-weight=\"700\">·</tspan>  El <tspan class=\"mono\" font-size=\"10.5\">HEAD</tspan> — qué rama/commit tiene checada</text>\n  <text x=\"628\" y=\"366\" class=\"bul\"><tspan fill=\"#C2510A\" font-weight=\"700\">·</tspan>  El índice (staging area)</text>\n  <text x=\"628\" y=\"388\" class=\"bul\"><tspan fill=\"#C2510A\" font-weight=\"700\">·</tspan>  Ignorados / no rastreados (<tspan class=\"mono\" font-size=\"10.5\">.tmp</tspan>, <tspan class=\"mono\" font-size=\"10.5\">node_modules</tspan>) <tspan font-weight=\"700\" fill=\"#B91C1C\">— NO viajan</tspan></text>\n\n  <!-- ===== REGLAS (3 chips) ===== -->\n  <rect x=\"40\" y=\"412\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#1E3A5F\" stroke-width=\"1.4\"/>\n  <text x=\"58\" y=\"432\" font-size=\"10\" font-weight=\"700\" fill=\"#1E3A5F\">① UNA RAMA → UN WORKTREE</text>\n  <text x=\"58\" y=\"449\" class=\"sub\" font-size=\"10.5\">Git impide checar la misma rama en dos carpetas.</text>\n\n  <rect x=\"420\" y=\"412\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.4\"/>\n  <text x=\"438\" y=\"432\" font-size=\"10\" font-weight=\"700\" fill=\"#0D7C5A\">② NO DUPLICA EL .git</text>\n  <text x=\"438\" y=\"449\" class=\"sub\" font-size=\"10.5\">Solo un puntero ligero — no como <tspan class=\"mono\">git clone</tspan>.</text>\n\n  <rect x=\"800\" y=\"412\" width=\"360\" height=\"48\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.4\"/>\n  <text x=\"818\" y=\"432\" font-size=\"10\" font-weight=\"700\" fill=\"#C2510A\">③ ADIÓS A switch / stash</text>\n  <text x=\"818\" y=\"449\" class=\"sub\" font-size=\"10.5\">Cada rama vive en su carpeta, todas a la vez.</text>\n\n  <!-- ===== CHULETA ===== -->\n  <rect x=\"40\" y=\"474\" width=\"1120\" height=\"100\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\"/>\n  <text x=\"58\" y=\"495\" class=\"role\" fill=\"#9B9B9B\">CHULETA — comandos esenciales</text>\n  <!-- col izq -->\n  <text x=\"58\" y=\"518\" class=\"cmd mono\">git worktree add ..\\dir &lt;rama&gt;</text><text x=\"330\" y=\"518\" class=\"lbl\">carpeta nueva con una rama existente</text>\n  <text x=\"58\" y=\"540\" class=\"cmd mono\">git worktree list</text><text x=\"330\" y=\"540\" class=\"lbl\">ver todos los worktrees</text>\n  <text x=\"58\" y=\"562\" class=\"cmd mono\">git worktree remove ..\\dir</text><text x=\"330\" y=\"562\" class=\"lbl\">quitar (<tspan class=\"mono\">--force</tspan> si hay cambios)</text>\n  <!-- col der -->\n  <text x=\"620\" y=\"518\" class=\"cmd mono\">git worktree add -b &lt;rama&gt; ..\\dir base</text><text x=\"930\" y=\"518\" class=\"lbl\">crea rama nueva + carpeta</text>\n  <text x=\"620\" y=\"540\" class=\"cmd mono\">git worktree add --detach ..\\dir &lt;ref&gt;</text><text x=\"930\" y=\"540\" class=\"lbl\">inspección sin ocupar rama</text>\n  <text x=\"620\" y=\"562\" class=\"cmd mono\">git worktree prune</text><text x=\"930\" y=\"562\" class=\"lbl\">limpiar carpeta borrada a mano</text>\n\n  <!-- ===== LEYENDA ===== -->\n  <g>\n    <rect x=\"40\" y=\"588\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#1E3A5F\"/><text x=\"58\" y=\"598\" class=\"sub\">hub = el <tspan class=\"mono\">.git</tspan> compartido</text>\n    <rect x=\"232\" y=\"588\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#0D7C5A\"/><text x=\"250\" y=\"598\" class=\"sub\">rama activa (tu trabajo)</text>\n    <rect x=\"452\" y=\"588\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#C2510A\"/><text x=\"470\" y=\"598\" class=\"sub\">worktree de referencia (consulta)</text>\n    <rect x=\"720\" y=\"588\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#2E6B9E\"/><text x=\"738\" y=\"598\" class=\"sub\">worktree de revisión (PR / build)</text>\n  </g>\n\n  <!-- FOOTER -->\n  <text x=\"600\" y=\"622\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\">Tutorial git worktree · un repo, varias carpetas · Windows + PowerShell · paleta COIIAOC (tipografía V2) · 2026-06-09</text>\n</svg>\n"},{"id":"03","type":"TUTORIAL","slug":"git-force-with-lease","title":"Tutorial — `git push --force-with-lease`","summary":"Cómo reescribir historia ya publicada **sin machacar** el trabajo de un compañero (o de una sesión paralela).","mdFilename":"03-TUTORIAL-git-force-with-lease.md","svgFilename":"03-TUTORIAL-git-force-with-lease.svg","hasSvg":true,"tags":["tutorial","git","force","with","lease"],"contentMarkdown":"# Tutorial — `git push --force-with-lease`\n\n> Cómo reescribir historia ya publicada **sin machacar** el trabajo de un compañero (o de una sesión paralela).\n> Fundamentado en el caso real de este repo: el hook `push-prompt-log.ps1`, que enmienda el mismo commit diario y debe force-pushear — pero nunca sobrescribir lo que otro publicó mientras tanto.\n\n---\n\n## 1. El problema que resuelve\n\nUn push normal solo acepta **fast-forward**: el tip remoto debe ser ancestro de lo que mandas (solo añades commits encima). En cuanto **reescribes** historia — `git commit --amend`, `git rebase`, `git reset` — tu commit nuevo ya no desciende del tip remoto, y git se niega:\n\n```\n$ git push\n ! [rejected]  master -> master (non-fast-forward)\nerror: failed to push some refs\nhint: Updates were rejected because the tip of your current branch is behind...\n```\n\nPara avanzar necesitas forzar. La pregunta es **cuál** de las dos fuerzas usar.\n\n---\n\n## 2. Las tres opciones (y por qué solo una es segura)\n\n| Comando | Comprobación de seguridad | Riesgo |\n|---|---|---|\n| `git push` | Solo fast-forward | No sirve tras reescribir historia |\n| `git push --force` | Ninguna | **Destruye** commits que no hayas visto |\n| `git push --force-with-lease` | Compara con tu último `fetch` | Rechaza si alguien movió el remoto |\n\n> **Regla de oro:** nunca escribas `--force`. Escribe `--force-with-lease`.\n\n---\n\n## 3. Cómo funciona el \"lease\" (fianza)\n\nCuando haces `git fetch`, git registra dónde estaba el remoto en tu **ref de seguimiento** (`origin/master`). El lease es la promesa *\"creo que el remoto sigue en el commit X\"*. Al hacer push, git verifica esa promesa:\n\n- **Remoto sigue en X** (lo que viste la última vez) → el push **se acepta**.\n- **Remoto avanzó a Y** (alguien empujó algo) → el lease **se rompe**, el push **se rechaza** sin destruir nada.\n\n```\n$ git push --force-with-lease\n ! [rejected]  master -> master (stale info)\nerror: failed to push some refs\n```\n\n`stale info` = el lease funcionó. Nadie perdió trabajo.\n\n---\n\n## 4. Por qué `--force` es peligroso\n\n```\nTú:        hiciste fetch de master en commit A, enmendaste → A'\nMientras:  una sesión paralela publicó B encima de A\nTú:        git push --force   # remoto era A→B, ahora es A'\n                              # commit B DESAPARECE. Silenciosamente.\n```\n\nNunca viste `B`. `--force` lo borró. En un `master` compartido así es como se pierde trabajo.\n\n---\n\n## 5. Cuándo necesitas un force push\n\nCada vez que **reescribes un commit ya publicado**:\n\n- `git commit --amend` sobre un commit ya pusheado (exactamente lo que hace el hook de este repo)\n- `git rebase` de una rama ya publicada (squash, reword, reorder, drop)\n- `git reset --hard <anterior>` y re-push\n\n**No** necesitas force para trabajo normal (añadir commits nuevos = fast-forward).\n\n---\n\n## 6. El caso real de este repo\n\n`push-prompt-log.ps1` mantiene **un commit por día** (`c1 daily <fecha>`). El primer prompt del día lo crea; los posteriores lo **enmiendan** (reescriben un commit ya publicado) y vuelven a pushear:\n\n```powershell\nif ($head -eq $msg) {\n    # El commit de hoy está en HEAD: pliega los nuevos prompts.\n    git commit --amend --no-edit *>$null\n    # --force-with-lease aborta con seguridad si una sesión paralela o el\n    # evaluador en la nube movió origin desde nuestro último fetch.\n    git push --force-with-lease *>$null\n} else {\n    git commit -m $msg *>$null   # primer commit del día\n    git push *>$null             # push normal: solo fast-forward\n}\n```\n\nPor qué el lease es imprescindible aquí:\n\n- **Sesiones paralelas.** Varios procesos Claude comparten `master`. Dos amend-and-push en carrera son inevitables. El lease hace que **el perdedor sea rechazado** (y reintente) en vez de **borrar al ganador**.\n- **El evaluador en la nube.** La rutina nocturna hace commit `eval: …` y pushea a `master`. Si aterriza entre nuestro amend y nuestro push, el lease lo detecta.\n\nEl modo de fallo es suave: al recibir un lease roto el hook simplemente **sale** (el commit queda local); el siguiente `Stop` reintenta cuando la copia local esté al día.\n\n---\n\n## 7. Receta paso a paso (manual)\n\nEnmendaste un commit publicado y necesitas actualizar el remoto:\n\n```bash\n# 1. Asegura que tu ref de seguimiento refleja la realidad.\ngit fetch origin\n\n# 2. Comprueba que no vas a pisarte nada nuevo:\ngit log --oneline origin/master..HEAD     # tus commits que no están en remoto\ngit log --oneline HEAD..origin/master     # commits remotos que no están en los tuyos  ← quieres VACÍO\n\n# 3. Si la segunda línea está vacía, pushea con seguridad:\ngit push --force-with-lease\n\n# 4. Si NO estaba vacía, integra primero:\ngit pull --rebase        # o merge\ngit push --force-with-lease\n```\n\n---\n\n## 8. Gotchas\n\n- **No hagas `git fetch` inmediatamente antes de un `--force-with-lease` sin inspeccionar.** Hacer fetch refresca el lease al nuevo valor remoto — ya no puede detectar el cambio. Inspecciona siempre tras el fetch (receta §7) o ancla el lease explícitamente:\n  ```bash\n  git push --force-with-lease=master:<sha-que-esperas>\n  ```\n- **Protege la ref, no el árbol de trabajo.** `--force-with-lease` no sabe nada de cambios locales sin commitear; solo compara el tip de rama.\n- **Opción más fuerte (git moderno):** `git push --force-with-lease --force-if-includes` también verifica que tu historial local **contenga** los commits remotos que vas a sobrescribir — cierra el hueco de \"hice fetch pero no mergé\".\n- **Hooks y CI** deben usar siempre `--force-with-lease`, nunca `--force` — no hay ningún humano mirando que pueda notar una sobrescritura silenciosa.\n\n---\n\n## 9. Chuleta\n\n```bash\n# Situación normal (solo añades commits)\ngit push\n\n# Enmendaste/rebasaste un commit ya publicado\ngit push --force-with-lease\n\n# Lease rechazado (stale info) → integra y reintenta\ngit fetch origin\ngit rebase origin/master     # o merge\ngit push --force-with-lease\n\n# Anclar el tip remoto esperado (máxima precisión)\ngit push --force-with-lease=master:<sha>\n\n# Opción más segura en git moderno\ngit push --force-with-lease --force-if-includes\n\n# NUNCA\ngit push --force\n```\n\n---\n\n*Complementario a `02-TUTORIAL-git-worktree.md`. Uso real en `artifacts/Daily-Prompt-Evaluator/push-prompt-log.ps1`.*\n","contentSvg":"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"634\" viewBox=\"0 0 1200 634\">\n  <defs>\n    <marker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/></marker>\n    <marker id=\"aGreen\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#0D7C5A\"/></marker>\n    <marker id=\"aRed\"   markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#B91C1C\"/></marker>\n    <filter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"><feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.08)\"/></filter>\n    <style>\n      text{font-family:'Segoe UI', Arial, sans-serif}\n      .mono{font-family:Consolas,'Courier New',monospace}\n      .role{font-size:10px;letter-spacing:.12em;font-weight:700}\n      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F}\n      .sub{font-size:9.5px;fill:#6B6B6B}\n      .cmd{font-size:11px;font-weight:700;fill:#1E3A5F}\n      .lbl \" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#6B6B6B\">Comando</text>\n  <text x=\"580\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#6B6B6B\">Comprobación de seguridad</text>\n  <text x=\"980\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"#6B6B6B\">Riesgo</text>\n  <line x1=\"58\" y1=\"200\" x2=\"1142\" y2=\"200\" stroke=\"#F0ECE4\" stroke-width=\"1\"/>\n\n  <!-- fila 1: push normal -->\n  <rect x=\"58\" y=\"206\" width=\"280\" height=\"26\" rx=\"4\" fill=\"#F5F2EC\"/>\n  <text x=\"76\" y=\"224\" class=\"mono\" font-size=\"11.5\" fill=\"#1E3A5F\">git push</text>\n  <text x=\"420\" y=\"224\" text-anchor=\"middle\" class=\"lbl\">Solo fast-forward</text>\n  <text x=\"980\" y=\"224\" text-anchor=\"middle\" class=\"lbl\">No sirve tras reescribir historia</text>\n\n  <!-- fila 2: force -->\n  <rect x=\"58\" y=\"236\" width=\"280\" height=\"26\" rx=\"4\" fill=\"#FFF5F5\"/>\n  <text x=\"76\" y=\"254\" class=\"mono\" font-size=\"11.5\" fill=\"#B91C1C\">git push --force</text>\n  <text x=\"420\" y=\"254\" text-anchor=\"middle\" class=\"bad\">Ninguna</text>\n  <text x=\"980\" y=\"254\" text-anchor=\"middle\" class=\"bad\">Destruye commits que no hayas visto  ⚠</text>\n\n  <!-- fila 3: force-with-lease -->\n  <rect x=\"58\" y=\"266\" width=\"280\" height=\"26\" rx=\"4\" fill=\"#E6F7F2\"/>\n  <text x=\"76\" y=\"284\" class=\"mono\" font-size=\"11.5\" fill=\"#0A5C43\">git push --force-with-lease</text>\n  <text x=\"420\" y=\"284\" text-anchor=\"middle\" class=\"ok\">Compara con tu último fetch</text>\n  <text x=\"980\" y=\"284\" text-anchor=\"middle\" class=\"ok\">Rechaza si alguien movió el remoto  ✓</text>\n\n  <!-- ===== CHIPS DE REGLAS ===== -->\n  <!-- Chip 1 -->\n  <rect x=\"40\" y=\"294\" width=\"368\" height=\"52\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.4\"/>\n  <text x=\"58\" y=\"314\" font-size=\"10\" font-weight=\"700\" fill=\"#C2510A\">① EL LEASE = UNA PROMESA FECHADA</text>\n  <text x=\"58\" y=\"332\" class=\"sub\" font-size=\"10.5\">\"Creo que origin está en X.\" Si X cambió, el push se rechaza.</text>\n  <text x=\"58\" y=\"348\" class=\"sub\" font-size=\"10.5\">El valor de X viene del último <tspan class=\"mono\">git fetch</tspan> que hiciste.</text>\n\n  <!-- Chip 2 -->\n  <rect x=\"420\" y=\"294\" width=\"368\" height=\"52\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#B91C1C\" stroke-width=\"1.4\"/>\n  <text x=\"438\" y=\"314\" font-size=\"10\" font-weight=\"700\" fill=\"#B91C1C\">② NO HAGAS FETCH JUSTO ANTES SIN INSPECCIONAR</text>\n  <text x=\"438\" y=\"332\" class=\"sub\" font-size=\"10.5\">Fetch refresca el lease → ya no detecta el cambio.</text>\n  <text x=\"438\" y=\"348\" class=\"sub\" font-size=\"10.5\">Inspecciona siempre, o ancla: <tspan class=\"mono\">--force-with-lease=master:&lt;sha&gt;</tspan></text>\n\n  <!-- Chip 3 -->\n  <rect x=\"800\" y=\"294\" width=\"360\" height=\"52\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.4\"/>\n  <text x=\"818\" y=\"314\" font-size=\"10\" font-weight=\"700\" fill=\"#0D7C5A\">③ OPCIÓN MÁS SEGURA (git moderno)</text>\n  <text x=\"818\" y=\"332\" class=\"sub\" font-size=\"10.5\"><tspan class=\"mono\">--force-with-lease --force-if-includes</tspan></text>\n  <text x=\"818\" y=\"348\" class=\"sub\" font-size=\"10.5\">Verifica que tu historial contiene los commits remotos.</text>\n\n  <!-- ===== CASO REAL DEL REPO ===== -->\n  <rect x=\"40\" y=\"360\" width=\"554\" height=\"88\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#2E6B9E\" stroke-width=\"1.3\" filter=\"url(#sh)\"/>\n  <text x=\"58\" y=\"380\" class=\"role\" fill=\"#2E6B9E\">CASO REAL — push-prompt-log.ps1 · un commit por día</text>\n  <text x=\"58\" y=\"400\" class=\"mono\" font-size=\"10.5\" fill=\"#1E3A5F\">if ($head -eq $msg) {</text>\n  <text x=\"58\" y=\"416\" class=\"mono\" font-size=\"10.5\" fill=\"#1E3A5F\">    git commit --amend --no-edit  →  git push --force-with-lease</text>\n  <text x=\"58\" y=\"432\" class=\"mono\" font-size=\"10.5\" fill=\"#6B6B6B\">} else { git commit -m $msg  →  git push  }</text>\n  <text x=\"58\" y=\"446\" class=\"sub\">Sesiones paralelas + evaluador nocturno compiten en master — el lease protege a todos.</text>\n\n  <!-- ===== RECETA MANUAL ===== -->\n  <rect x=\"606\" y=\"360\" width=\"554\" height=\"88\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\" stroke-width=\"1.3\" filter=\"url(#sh)\"/>\n  <text x=\"624\" y=\"380\" class=\"role\" fill=\"#9B9B9B\">RECETA — tras enmendar un commit publicado</text>\n  <text x=\"624\" y=\"400\" class=\"mono\" font-size=\"10.5\" fill=\"#1E3A5F\">git fetch origin</text>\n  <text x=\"624\" y=\"416\" class=\"mono\" font-size=\"10.5\" fill=\"#6B6B6B\">git log --oneline HEAD..origin/master   # ← debe estar VACÍO</text>\n  <text x=\"624\" y=\"432\" class=\"mono\" font-size=\"10.5\" fill=\"#0A5C43\">git push --force-with-lease</text>\n  <text x=\"624\" y=\"448\" class=\"sub\">Si no está vacío: <tspan class=\"mono\">git pull --rebase</tspan> → <tspan class=\"mono\">git push --force-with-lease</tspan></text>\n\n  <!-- ===== CHULETA ===== -->\n  <rect x=\"40\" y=\"462\" width=\"1120\" height=\"104\" rx=\"9\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\"/>\n  <text x=\"58\" y=\"482\" class=\"role\" fill=\"#9B9B9B\">CHULETA — comandos</text>\n  <!-- col izq -->\n  <text x=\"58\"  y=\"504\" class=\"mono cmd\">git push</text>\n  <text x=\"290\" y=\"504\" class=\"lbl\">push normal (fast-forward, sin reescritura)</text>\n  <text x=\"58\"  y=\"524\" class=\"mono cmd\">git push --force-with-lease</text>\n  <text x=\"290\" y=\"524\" class=\"lbl\">enmendaste / rebasaste un commit ya publicado</text>\n  <text x=\"58\"  y=\"544\" class=\"mono cmd\">git push --force-with-lease=master:&lt;sha&gt;</text>\n  <text x=\"290\" y=\"544\" class=\"lbl\">anclar el tip remoto esperado (máxima precisión)</text>\n  <!-- col der -->\n  <text x=\"630\" y=\"504\" class=\"mono cmd\">git fetch  →  git rebase  →  --force-with-lease</text>\n  <text x=\"970\" y=\"504\" class=\"lbl\">lease rechazado → integra y reintenta</text>\n  <text x=\"630\" y=\"524\" class=\"mono cmd\">--force-with-lease --force-if-includes</text>\n  <text x=\"970\" y=\"524\" class=\"lbl\">opción más segura (git moderno)</text>\n  <text x=\"630\" y=\"544\" class=\"mono bad\">git push --force</text>\n  <text x=\"970\" y=\"544\" class=\"bad\">NUNCA — cero comprobaciones, borra commits</text>\n  <!-- línea separadora -->\n  <line x1=\"620\" y1=\"462\" x2=\"620\" y2=\"566\" stroke=\"#E8E3D8\" stroke-width=\"1\"/>\n\n  <!-- ===== LEYENDA ===== -->\n  <g>\n    <rect x=\"40\"  y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#2E6B9E\"/><text x=\"58\"  y=\"593\" class=\"sub\">tus commits locales</text>\n    <rect x=\"220\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#1E3A5F\"/><text x=\"238\" y=\"593\" class=\"sub\">remoto / lease</text>\n    <rect x=\"380\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#0D7C5A\"/><text x=\"398\" y=\"593\" class=\"sub\">push aceptado (lease ok)</text>\n    <rect x=\"600\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#B91C1C\"/><text x=\"618\" y=\"593\" class=\"sub\">push rechazado / peligro</text>\n    <rect x=\"820\" y=\"582\" width=\"13\" height=\"13\" rx=\"2\" fill=\"#C2510A\"/><text x=\"838\" y=\"593\" class=\"sub\">regla / gotcha</text>\n  </g>\n\n  <!-- FOOTER -->\n  <text x=\"600\" y=\"622\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\">Tutorial git push --force-with-lease · reescritura segura de historia publicada · paleta COIIAOC (tipografía V2) · 2026-06-22</text>\n</svg>\n"},{"id":"04","type":"CHEATSHEET","slug":"latex-overleaf-ficheros","title":"Cheatsheet · LaTeX y Overleaf: mapa de ficheros, compilación y Git","summary":"Guía de referencia rápida para identificar los ficheros de un documento LaTeX/Overleaf: qué se edita, qué se genera solo, cómo funciona el ciclo de compilación de 3 pasadas y qué versionar en Git.","mdFilename":"04-CHEATSHEET-latex-overleaf-ficheros.md","svgFilename":"04-CHEATSHEET-latex-overleaf-ficheros.svg","hasSvg":true,"tags":["cheatsheet","latex","overleaf","ficheros","git"],"contentMarkdown":"# Cheatsheet · LaTeX y Overleaf: mapa de ficheros, compilación y Git\n\n> Guía de referencia rápida para identificar los ficheros de un documento LaTeX/Overleaf: qué se edita, qué se genera solo, cómo funciona el ciclo de compilación de 3 pasadas y qué versionar en Git.\n\n---\n\n## Idea rectora\n\n**LaTeX** es un lenguaje de composición: texto + comandos en un `.tex` que un compilador convierte en `.pdf`. **Overleaf** es su entorno en navegador que compila automáticamente en segundo plano. En Git y en el flujo de trabajo: **versiona y sube únicamente las fuentes (`.tex`, `.bib`, figuras); ignora siempre los ficheros intermedios (`.aux`, `.log`, `.bbl`...)**.\n\n---\n\n## 1. Mapa de ficheros: fuente vs. intermedios\n\n### Ficheros que SÍ importan (fuente + resultado)\n\n| Fichero | Qué es | ¿Se edita? | ¿Se sube a Overleaf? | ¿En Git? |\n|---|---|---|---|---|\n| `main.tex` | **El documento/paper:** Texto y comandos. | ✅ Sí (o se genera de `.md`) | ✅ Sí (indispensable) | ✅ Sí |\n| `references.bib` | **Bibliografía:** Entradas BibTeX por cita. | ✅ Sí (al añadir citas) | ✅ Sí | ✅ Sí |\n| `template.tex` / `.cls` / `.sty` | **Plantilla / estilo:** Preámbulo y macros. | ⚠️ Rara vez | ✅ Sí | ✅ Sí |\n| `figures/` | **Activos visuales:** Imágenes, gráficas. | ⚠️ Al actualizar figuras | ✅ Sí | ✅ Sí |\n| `main.pdf` | **Resultado final:** Documento generado. | ❌ No (se autogenera) | ❌ No (Overleaf lo crea) | ⚠️ Opcional |\n\n### Ficheros intermedios (generados automáticamente — NO tocar)\n\n| Extensión | Nombre | Función en el compilador |\n|---|---|---|\n| `.aux` | **Auxiliar** | Almacena etiquetas (`\\label`), números de tabla/figura y citas entre pasadas de compilación. |\n| `.log` | **Registro** | Transcripción de avisos, warnings y errores de compilación (`undefined control sequence`, etc.). |\n| `.out` | **Bookmarks** | Hipervínculos e índice de navegación generado por el paquete `hyperref`. |\n| `.bbl` | **Bibliografía formateada** | Puente generado por BibTeX a partir de `references.bib` y `.aux` listo para incrustar. |\n| `.blg` | **Log de BibTeX** | Errores y diagnósticos específicos de procesamiento bibliográfico. |\n| `.toc` / `.lot` / `.lof` | **Sumarios** | Tablas de contenido, listas de tablas y listas de figuras. |\n\n---\n\n## 2. El ciclo de compilación: por qué se compila 3 veces (+ bibtex)\n\nCuando compilas en local, las referencias cruzadas y la bibliografía no pueden resolverse en una sola pasada:\n\n```\n[1ª Pasada: pdflatex] ─▶ Escribe .aux (etiquetas/citas como '??')\n         │\n         ▼\n[2ª Pasada: bibtex]   ─▶ Lee .aux + references.bib ─▶ Genera .bbl\n         │\n         ▼\n[3ª Pasada: pdflatex] ─▶ Incrusta .bbl y resuelve referencias cruzadas\n         │\n         ▼\n[4ª Pasada: pdflatex] ─▶ Cuadra numeración definitiva y saltos de página ─▶ PDF final\n```\n\n> **En Overleaf:** Todo este ciclo ocurre de forma automática al pulsar *Recompile*. Los ficheros `.aux`, `.bbl` y `.log` se generan en servidores internos y permanecen ocultos.\n\n---\n\n## 3. Reglas de oro numeradas\n\n1. **① Versiona la fuente pura:** En Git solo viven `.tex`, `.bib`, estilos (`.sty`/`.cls`) y la carpeta de figuras.\n2. **② El `.aux` es el árbitro:** Si una referencia (`\\ref`) o cita (`\\cite`) aparece rota con `??`, el problema está en la sincronización del `.aux` o en la falta de una pasada de compilación.\n3. **③ Overleaf solo necesita insumos:** No exportes ni subas ficheros auxiliares a Overleaf; deja que el motor de Overleaf los regenere limpios en cada build.\n\n---\n\n## 4. Chuleta `.gitignore` recomendada\n\nAñade este bloque al `.gitignore` en la raíz del documento:\n\n```gitignore\n# LaTeX - Ficheros intermedios generados (nunca versionar)\n*.aux\n*.log\n*.out\n*.bbl\n*.blg\n*.toc\n*.lot\n*.lof\n*.synctex.gz\n*.fls\n*.fdb_latexmk\n```\n","cont !-- PANEL 1: FUENTES (SÍ VERSIONAR) -->\n  <rect x=\"30\" y=\"74\" width=\"340\" height=\"230\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.8\" filter=\"url(#sh)\"/>\n  <rect x=\"30\" y=\"74\" width=\"340\" height=\"28\" rx=\"8\" fill=\"#E7F1EC\"/>\n  <text x=\"45\" y=\"93\" class=\"role\" fill=\"#0A5C43\">✔ FUENTES REALES (SÍ GIT / SÍ OVERLEAF)</text>\n  \n  <text x=\"45\" y=\"125\" class=\"mono cmd\" fill=\"#0D7C5A\">main.tex</text>\n  <text x=\"140\" y=\"125\" class=\"lbl\">Texto + comandos. La fuente viva.</text>\n  \n  <text x=\"45\" y=\"155\" class=\"mono cmd\" fill=\"#0D7C5A\">references.bib</text>\n  <text x=\"140\" y=\"155\" class=\"lbl\">Base de datos de citas BibTeX.</text>\n  \n  <text x=\"45\" y=\"185\" class=\"mono cmd\" fill=\"#0D7C5A\">template.tex</text>\n  <text x=\"140\" y=\"185\" class=\"lbl\">Preámbulo, paquetes y layout.</text>\n  \n  <text x=\"45\" y=\"215\" class=\"mono cmd\" fill=\"#0D7C5A\">figures/*</text>\n  <text x=\"140\" y=\"215\" class=\"lbl\">Diagramas, gráficas y activos PNG/PDF.</text>\n  \n  <line x1=\"45\" y1=\"235\" x2=\"355\" y2=\"235\" stroke=\"#E8E3D8\" stroke-width=\"1\"/>\n  <text x=\"45\" y=\"258\" class=\"mono cmd\" fill=\"#1E3A5F\">main.pdf</text>\n  <text x=\"140\" y=\"258\" class=\"lbl\" fill=\"#2E6B9E\">Entregable final (Overleaf lo compila).</text>\n  <text x=\"45\" y=\"285\" class=\"sub\" font-style=\"italic\">Todo lo que no esté en esta lista es generado automáticamente.</text>\n\n  <!-- PANEL 2: INTERMEDIOS (IGNORAR EN GIT) -->\n  <rect x=\"390\" y=\"74\" width=\"360\" height=\"230\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.8\" filter=\"url(#sh)\"/>\n  <rect x=\"390\" y=\"74\" width=\"360\" height=\"28\" rx=\"8\" fill=\"#FFF7ED\"/>\n  <text x=\"405\" y=\"93\" class=\"role\" fill=\"#7C2D12\">✖ INTERMEDIOS DE PASADA (NO GIT / NO EDITAR)</text>\n  \n  <text x=\"405\" y=\"123\" class=\"mono cmd\" fill=\"#C2510A\">.aux</text>\n  <text x=\"460\" y=\"123\" class=\"lbl\">Memoria intermedia (\\label, \\ref, citas).</text>\n  \n  <text x=\"405\" y=\"151\" class=\"mono cmd\" fill=\"#C2510A\">.log</text>\n  <text x=\"460\" y=\"151\" class=\"lbl\">Registro completo de warnings y errores.</text>\n  \n  <text x=\"405\" y=\"179\" class=\"mono cmd\" fill=\"#C2510A\">.bbl</text>\n  <text x=\"460\" y=\"179\" class=\"lbl\">Bibliografía precompilada (puente BibTeX).</text>\n\n  <text x=\"405\" y=\"207\" class=\"mono cmd\" fill=\"#C2510A\">.out</text>\n  <text x=\"460\" y=\"207\" class=\"lbl\">Bookmarks y destinos de hipervínculos.</text>\n  \n  <text x=\"405\" y=\"235\" class=\"mono cmd\" fill=\"#C2510A\">.blg</text>\n  <text x=\"460\" y=\"235\" class=\"lbl\">Log del procesador BibTeX.</text>\n\n  <line x1=\"405\" y1=\"250\" x2=\"735\" y2=\"250\" stroke=\"#E8E3D8\" stroke-width=\"1\"/>\n  <text x=\"405\" y=\"272\" class=\"sub\" fill=\"#B91C1C\" font-weight=\"700\">¡Son efímeros! Nunca los subas a Overleaf ni a tu repo.</text>\n  <text x=\"405\" y=\"290\" class=\"sub\">Overleaf los genera dentro de un contenedor en cada clic en Recompile.</text>\n\n  <!-- PANEL 3: PIPELINE DE 3 PASADAS -->\n  <rect x=\"30\" y=\"320\" width=\"720\" height=\"150\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/>\n  <text x=\"45\" y=\"342\" class=\"bt\">Ciclo de compilación local: ¿por qué compilar 3 veces (+ bibtex)?</text>\n  \n  <!-- Step 1 -->\n  <rect x=\"45\" y=\"358\" width=\"135\" height=\"48\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/>\n  <text x=\"112\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\">1. pdflatex</text>\n  <text x=\"112\" y=\"394\" text-anchor=\"middle\" class=\"sub\">Escribe .aux (citas '??')</text>\n\n  <line x1=\"180\" y1=\"382\" x2=\"215\" y2=\"382\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/>\n\n  <!-- Step 2 -->\n  <rect x=\"220\" y=\"358\" width=\"135\" height=\"48\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#C2510A\"/>\n  <text x=\"287\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#7C2D12\">2. bibtex</text>\n  <text x=\"287\" y=\"394\" text-anchor=\"middle\" class=\"sub\">Lee .aux + .bib → .bbl</text>\n\n  <line x1=\"355\" y1=\"382\" x2=\"390\" y2=\"382\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/>\n\n  <!-- Step 3 -->\n  <rect x=\"395\" y=\"358\" width=\"145\" height=\"48\" rx=\"6\" fill=\"#F5F2EC\" stroke=\"#2E6B9E\"/>\n  <text x=\"467\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\">3. pdflatex (2ª)</text>\n  <text x=\"467\" y=\"394\" text-anchor=\"middle\" class=\"sub\">Incrusta .bbl y resuelve</text>\n\n  <line x1=\"540\" y1=\"382\" x2=\"575\" y2=\"382\" stroke=\"#6B6B6B\" stroke-width=\"1.3\" marker-end=\"url(#aSlate)\"/>\n\n  <!-- Step 4 -->\n  <rect x=\"580\" y=\"358\" width=\"150\" height=\"48\" rx=\"6\" fill=\"#E7F1EC\" stroke=\"#0D7C5A\" stroke-width=\"1.6\"/>\n  <text x=\"655\" y=\"377\" text-anchor=\"middle\" class=\"mono cmd\" font-size=\"11\" fill=\"#0A5C43\">4. pdflatex (3ª) ✓</text>\n  <text x=\"655\" y=\"394\" text-anchor=\"middle\" class=\"sub\" fill=\"#0A5C43\">Cuadra refs y emite PDF</text>\n\n  <text x=\"45\" y=\"435\" class=\"sub\" font-size=\"10\" fill=\"#6B6B6B\">En <tspan font-weight=\"700\" fill=\"#1E3A5F\">Overleaf</tspan>, este proceso de 4 pasos es ejecutado en memoria automáticamente con un solo clic en <tspan font-weight=\"700\" fill=\"#C2510A\">Recompile</tspan>.</text>\n  <text x=\"45\" y=\"452\" class=\"sub\" font-size=\"10\" fill=\"#6B6B6B\">Si ves <tspan class=\"mono\" font-weight=\"700\" fill=\"#B91C1C\">??</tspan> en tus citas o referencias, falta una pasada adicional o el fichero <tspan class=\"mono\">.aux</tspan> está desfasado.</text>\n\n  <!-- PANEL 4: CHULETA .GITIGNORE Y REGLAS -->\n  <rect x=\"770\" y=\"74\" width=\"400\" height=\"396\" rx=\"8\" fill=\"#FAFAF7\" stroke=\"#E8E3D8\" filter=\"url(#sh)\"/>\n  <rect x=\"770\" y=\"74\" width=\"400\" height=\"28\" rx=\"8\" fill=\"#1E3A5F\"/>\n  <text x=\"785\" y=\"93\" class=\"role\" fill=\"#FFFFFF\">CONFIGURACIÓN .GITIGNORE RECOMENDADA</text>\n\n  <rect x=\"785\" y=\"112\" width=\"370\" height=\"150\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#E8E3D8\"/>\n  <text x=\"800\" y=\"132\" class=\"mono\" font-size=\"10.5\" fill=\"#6B6B6B\"># Intermedios LaTeX (regenerables)</text>\n  <text x=\"800\" y=\"148\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\">*.aux *.log *.out</text>\n  <text x=\"800\" y=\"164\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\">*.bbl *.blg</text>\n  <text x=\"800\" y=\"180\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\">*.toc *.lot *.lof</text>\n  <text x=\"800\" y=\"196\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\">*.synctex.gz</text>\n  <text x=\"800\" y=\"212\" class=\"mono\" font-size=\"10.5\" fill=\"#B91C1C\">*.fls *.fdb_latexmk</text>\n  <text x=\"800\" y=\"235\" class=\"mono\" font-size=\"10.5\" fill=\"#0D7C5A\"># SÍ versionar: *.tex *.bib figures/</text>\n  <text x=\"800\" y=\"251\" class=\"mono\" font-size=\"10.5\" fill=\"#2E6B9E\"># Opcional: *.pdf (entregable final)</text>\n\n  <!-- CHIPS DE REGLAS ①②③ -->\n  <rect x=\"785\" y=\"274\" width=\"370\" height=\"42\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#0D7C5A\" stroke-width=\"1.3\"/>\n  <text x=\"795\" y=\"292\" font-size=\"11\" font-weight=\"700\" fill=\"#0A5C43\">① Versiona solo la fuente</text>\n  <text x=\"795\" y=\"307\" class=\"sub\">Git almacena .tex, .bib y assets; nunca subas archivos .aux ni .log.</text>\n\n  <rect x=\"785\" y=\"324\" width=\"370\" height=\"42\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#C2510A\" stroke-width=\"1.3\"/>\n  <text x=\"795\" y=\"342\" font-size=\"11\" font-weight=\"700\" fill=\"#7C2D12\">② El .aux es la memoria entre pasadas</text>\n  <text x=\"795\" y=\"357\" class=\"sub\">Almacena referencias cruzadas. Si ves '??', borra el .aux o recompila.</text>\n\n  <rect x=\"785\" y=\"374\" width=\"370\" height=\"42\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#2E6B9E\" stroke-width=\"1.3\"/>\n  <text x=\"795\" y=\"392\" font-size=\"11\" font-weight=\"700\" fill=\"#1E3A5F\">③ Overleaf es independiente de tu Git</text>\n  <text x=\"795\" y=\"407\" class=\"sub\">Sube solo .tex y .bib. Overleaf compila en la nube sin requerir auxiliares.</text>\n\n  <rect x=\"785\" y=\"424\" width=\"370\" height=\"34\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#B91C1C\" stroke-width=\"1.3\"/>\n  <text x=\"795\" y=\"444\" font-size=\"10.5\" font-weight=\"700\" fill=\"#B91C1C\">⚠ Advertencia: <tspan font-weight=\"normal\" fill=\"#6B6B6B\">No edites nunca a mano ficheros .bbl ni .aux.</tspan></text>\n\n  <!-- FOOTER Y LEYENDA -->\n  <!-- Leyenda -->\n  <rect x=\"30\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0D7C5A\"/>\n  <text x=\"50\" y=\"511\" class=\"lbl\" font-weight=\"700\">Fuente pura (.tex / .bib)</text>\n\n  <rect x=\"230\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#C2510A\"/>\n  <text x=\"250\" y=\"511\" class=\"lbl\" font-weight=\"700\">Intermedios efímeros (.aux / .bbl)</text>\n\n  <rect x=\"470\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#2E6B9E\"/>\n  <text x=\"490\" y=\"511\" class=\"lbl\" font-weight=\"700\">Pipeline / Compilador</text>\n\n  <rect x=\"670\" y=\"500\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#B91C1C\"/>\n  <text x=\"690\" y=\"511\" class=\"lbl\" font-weight=\"700\">Exclusión en .gitignore</text>\n\n  <!-- Línea divisoria y pie de página -->\n  <line x1=\"30\" y1=\"535\" x2=\"1170\" y2=\"535\" stroke=\"#E8E3D8\" stroke-width=\"1\"/>\n  <text x=\"600\" y=\"555\" text-anchor=\"middle\" font-size=\"9.5\" font-style=\"italic\" fill=\"#9B9B9B\">LaTeX y Overleaf: gestión de ficheros y compilación · core-human-knowledge · paleta COIIAOC (tipografía V2) · 2026-09-10</text>\n</svg>\n"},{"id":"05","type":"CHEATSHEET","slug":"spec-kit","title":"Cheatsheet · Spec-Kit (GitHub): Spec-Driven Development (SDD)","summary":"Guía de referencia rápida del ciclo de vida de **Spec-Kit**: el framework de *Spec-Driven Development* (SDD) de GitHub que convierte especificaciones en ejecutables mediante pipelines de IA deterministas, erradicando el \"vibe coding\".","mdFilename":"05-CHEATSHEET-spec-kit.md","svgFilename":"05-CHEATSHEET-spec-kit.svg","hasSvg":true,"tags":["cheatsheet","spec","kit","git","spec-kit","sdd"],"contentMarkdown":"# Cheatsheet · Spec-Kit (GitHub): Spec-Driven Development (SDD)\n\n> Guía de referencia rápida del ciclo de vida de **Spec-Kit**: el framework de *Spec-Driven Development* (SDD) de GitHub que convierte especificaciones en ejecutables mediante pipelines de IA deterministas, erradicando el \"vibe coding\".\n\n---\n\n## Idea rectora\n\n**Spec-Driven Development (SDD):** Las especificaciones dejan de ser documentación estática para convertirse en artefactos estructurados y ejecutables. El ciclo de vida garantiza que ninguna línea de código se escriba sin haber validado previamente la pirámide determinista: **Constitución (`constitution.md`) ➔ Especificación (`spec.md`) ➔ Plan técnico (`plan.md`) ➔ Tareas ordenadas (`tasks.md`) ➔ Auditoría cruzada (`analyze`) ➔ Implementación (`implement`)**.\n\n---\n\n## 1. El ciclo de vida de Spec-Kit paso a paso\n\n```\n[0. init / check] ────▶ [1. constitution] ────▶ [2. specify] ────▶ [3. clarify]\n  Configuración           Reglas globales         spec.md           Reduce dudas\n                                                                         │\n[6. implement] ◀───── [5. analyze] ◀────── [4. tasks] ◀────── [3b. plan] ┘\n  Genera código         Auditoría cruzada     tasks.md          plan.md + data-model\n```\n\n| Fase | Comando / Slash | Insumo | Artefacto resultante | Propósito principal |\n|---|---|---|---|---|\n| **0. Setup** | `specify init . --integration [model]` | Entorno local | `.specify/` | Inicializa el workspace e integraciones CLI. |\n| **1. Constitución** | `/speckit-constitution [prompt]` | Principios y políticas | `.specify/memory/constitution.md` | Fija arquitectura, estándares de API, seguridad y calidad. |\n| **2. Especificar** | `/speckit-specify [descripción]` | Requisitos en lenguaje natural | `specs/NNN-<nombre>/spec.md` | Define casos de uso, requisitos funcionales y criterios de éxito sin tecnología. |\n| **3. Clarificar** | `/speckit-clarify` | `spec.md` activo | `spec.md` (resuelto) | Lanza hasta 5 preguntas para eliminar lagunas y decisiones ambiguas. |\n| **4. Planificar** | `/speckit-plan [detalles técnicos]` | `spec.md` + tech stack | `plan.md`, `data-model.md`, `contracts/` | Fija arquitectura técnica, modelos de datos, endpoints y pruebas. |\n| **5. Tareas** | `/speckit-tasks` | `spec.md` + `plan.md` | `specs/NNN-<nombre>/tasks.md` | Desglosa la implementación en subtareas atómicas y ordenadas por dependencia. |\n| **6. Auditar** | `/speckit-analyze` | Trilogía spec + plan + tasks | Informe de inconsistencias | Análisis *read-only* de coherencia entre los tres documentos clave. |\n| **7. Implementar** | `/speckit-implement` | `tasks.md` validado | Código fuente + tests | Ejecuta la generación de código y validación automatizada tarea a tarea. |\n\n---\n\n## 2. Anatomía de una Feature (`specs/NNN-feature/`)\n\nCada funcionalidad se aísla en su propio directorio numerado consecutivamente:\n\n```\nspecs/003-user-auth/\n├── spec.md                  # Especificación funcional pura (agnóstica de tech)\n├── plan.md                  # Arquitectura técnica, dependencias y fases\n├── research.md              # Alternativas consideradas y justificaciones\n├── data-model.md            # Entidades, esquemas, tipos y validaciones\n├── quickstart.md            # Escenarios de prueba e integración guiada\n├── tasks.md                 # Lista ordenada de tareas atómicas\n└── contracts/               # Contratos OpenAPI, GraphQL o CLI\n    └── api-contracts.json\n```\n\n---\n\n## 3. Reglas de oro numeradas\n\n1. **① La especificación es agnóstica de implementación:** En `/speckit-specify`, prohíbe mencionar frameworks, bases de datos o sintaxis concreta; define solo el *qué*, no el *cómo*.\n2. **② Validación de constitución obligatoria:** Cada `/speckit-plan` realiza un *Constitution Check*; si viola un principio de `constitution.md`, la fase no avanza.\n3. **③ Jamás implementes sin `/speckit-analyze` limpio:** El comando de análisis cruzado es la última barrera para detectar discrepancias entre contratos, entidades y tareas antes de codificar.\n\n---\n\n## 4. Chuleta de comandos rápidos\n\n```bash\n# 1. Instalación de la CLI mediante uv\nuv tool install specify-cli --from git+https://github.com/github/spec-kit.git@vX.Y.Z\nspecify check\n\n# 2. Inicialización en el proyecto\nspecify init . --integration claude    # O antigravity / copilot\n\n# 3. Pipeline guiado por el agente\n/speckit-constitution [principios del proyecto]\n/speckit-specify [descripción del caso de negocio]\n/speckit-clarify\n/speckit-plan [especificaciones del stack y endpoints]\n/speckit-tasks\n/speckit-analyze\n/speckit-implement\n```\n","contentSvg":"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"630\" viewBox=\"0 0 1200 630\">\n  <defs>\n    <marker id=\"aSlate\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#6B6B6B\"/></marker>\n    <marker id=\"aOrange\" markerWidth=\"11\" markerHeight=\"9\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#C2510A\"/></marker>\n    <marker id=\"aGreen\" markerWidth=\"10\" markerHeight=\"8\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0 0, 9 3.5, 0 7\" fill=\"#0D7C5A\"/></marker>\n    <filter id=\"sh\" x=\"-6%\" y=\"-6%\" width=\"112%\" height=\"118%\"><feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.08)\"/></filter>\n    <style>\n      text{font-family:'Segoe UI', Arial, sans-serif}\n      .mono{font-family:Consolas,'Courier New',monospace}\n      .role{font-size:10px;letter-spacing:.1em;font-weight:700}\n      .bt{font-size:12.5px;font-weight:700;fill:#1E3A5F
